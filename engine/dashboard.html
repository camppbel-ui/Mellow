      if (res.ok && res.body.url) { location.href = res.body.url; return; }
      errors._accounts = (res.body && res.body.error) || 'Couldn\'t start the sign-in.';
      render();
    });
  }

  if ((el = ev.target.closest('[data-sync]'))) return doSync(el);

  if ((el = ev.target.closest('button[data-role]'))) {
    return post('/api/google/account', { email: el.getAttribute('data-email'), role: el.getAttribute('data-role') })
      .then(function (res) { return afterWrite(res, '_accounts'); });
  }

  if ((el = ev.target.closest('button[data-disconnect]'))) {
    var email = el.getAttribute('data-disconnect');
    if (!window.confirm('Disconnect ' + email + '?\n\nIts saved sign-in is deleted, and anything found in it that you hadn\'t confirmed is forgotten.')) return;
    return post('/api/google/disconnect', { email: email }).then(function (res) { return afterWrite(res, '_accounts'); });
  }

  /* calendar views */

  if ((el = ev.target.closest('[data-cal-view]'))) return setCalView(el.getAttribute('data-cal-view'));
  if ((el = ev.target.closest('[data-cal-nav]'))) return shiftCal(Number(el.getAttribute('data-cal-nav')));

  /* panels, dropped files */

  if ((el = ev.target.closest('[data-scan-file]'))) return pickFiles(el.getAttribute('data-scan-file'));
  if ((el = ev.target.closest('[data-files-open]'))) { dropSel = null; return switchTab('files'); }
  if ((el = ev.target.closest('[data-drop-open]'))) { dropSel = el.getAttribute('data-drop-open'); animateNextRender(); render(); return window.scrollTo({ top: 0, behavior: 'smooth' }); }
  if ((el = ev.target.closest('[data-drop-back]'))) { dropSel = null; animateNextRender(); return render(); }
  if ((el = ev.target.closest('[data-drop-view]'))) return openDropFile(el.getAttribute('data-drop-view'));
  if ((el = ev.target.closest('[data-files-folder]'))) {
    filesFolder = el.getAttribute('data-files-folder');
    dropSel = null;
    try { localStorage.setItem('ratchet-files-folder', filesFolder); } catch (e) {}
    animateNextRender();
    return render();
  }
  if ((el = ev.target.closest('[data-folder-new]'))) {
    var folderName2 = window.prompt('Name the new folder');
    if (!folderName2 || !folderName2.trim()) return;
    return post('/api/drops/folder', { name: folderName2 }).then(function (res) {
      if (res.status === 404) return toast('Restart Mellow to make folders.');
      if (!res.ok) return toast((res.body && res.body.error) || 'That didn\'t work.');
      foldersList = res.body.folders;
      filesFolder = res.body.folder.id; dropSel = null;
      try { localStorage.setItem('ratchet-files-folder', filesFolder); } catch (e) {}
      toast('Made ' + res.body.folder.name + '. Mellow can file things there now.');
      render();
    });
  }
  if ((el = ev.target.closest('[data-folder-delete]'))) {
    var delFolder = el.getAttribute('data-folder-delete');
    if (!window.confirm('Remove the ' + folderName(delFolder) + ' folder?\n\nIts files move to Other. Nothing is deleted.')) return;
    return post('/api/drops/folder/delete', { id: delFolder }).then(function (res) {
      if (!res.ok) return toast((res.body && res.body.error) || 'That didn\'t work.');
      foldersList = res.body.folders;
      filesFolder = 'all';
      toast(res.body.moved ? 'Removed. ' + plural(res.body.moved, 'file') + ' moved to Other.' : 'Removed.');
      refreshDrops();
    });
  }
  if ((el = ev.target.closest('[data-drop-all]')) || (el = ev.target.closest('[data-drop-none]'))) {
    var tick = el.hasAttribute('data-drop-all');
    document.querySelectorAll('#view input[data-find]:not(:disabled)').forEach(function (b) { b.checked = tick; });
    return;
  }
  if ((el = ev.target.closest('[data-drop-apply]'))) return applyDrop(el.getAttribute('data-drop-apply'), el);
  if ((el = ev.target.closest('[data-drop-rescan]'))) {
    var rid = el.getAttribute('data-drop-rescan');
    return post('/api/drops/rescan', { id: rid }).then(function () { dropsList = dropsList.map(function (d) { return d.id === rid ? Object.assign({}, d, { status: 'scanning' }) : d; }); renderFilesPanel(); setTimeout(refreshDrops, 1500); });
  }
  if ((el = ev.target.closest('[data-drop-dismiss]'))) {
    var did = el.getAttribute('data-drop-dismiss');
    var doomed = (dropsList || []).filter(function (d) { return d.id === did; })[0];
    if (!window.confirm('Delete ' + (doomed ? doomed.title || doomed.name : 'this file') + '?\n\nThe file is removed from Mellow. Anything you already added from it stays.')) return;
    return post('/api/drops/dismiss', { id: did }).then(function (res) {
      if (!res.ok) return toast((res.body && res.body.error) || 'That didn\'t work.');
      dropsList = dropsList.filter(function (d) { return d.id !== did; });
      dropSel = null;
      toast('Deleted.');
      renderFilesPanel();
      renderChrome();
    });
  }
  if ((el = ev.target.closest('[data-drop-ask]'))) {
    var ad = (dropsList || []).filter(function (d) { return d.id === el.getAttribute('data-drop-ask'); })[0];
    if (!ad) return;
    ai.files = [{ id: ad.id, name: ad.name }];
    return aiOpen('About ' + ad.name + ': ');
  }
  if ((el = ev.target.closest('[data-panel-close]'))) {
    closePanel();
    if (el.hasAttribute('data-go')) return switchTab(el.getAttribute('data-go'));
    return;
  }

  /* the assistant */

  if ((el = ev.target.closest('[data-ai-open]'))) return aiOpen();
  if ((el = ev.target.closest('[data-ai-send]'))) return aiSend();
  if ((el = ev.target.closest('[data-ai-suggest]'))) return aiSend(el.getAttribute('data-ai-suggest'));
  if ((el = ev.target.closest('[data-ai-attach]'))) return pickFiles('assistant');
  if ((el = ev.target.closest('[data-ai-new]'))) {
    ai.conv = null; ai.convId = ''; ai.view = 'chat'; ai.files = [];
    try { localStorage.removeItem('ratchet-ai-conv'); } catch (e) {}
    renderAi();
    return document.getElementById('ai-input').focus();
  }
  if ((el = ev.target.closest('[data-ai-history]'))) {
    ai.view = ai.view === 'history' ? 'chat' : 'history';
    renderAi();
    if (ai.view === 'history') authGet('/api/assistant/list').then(function (r) { ai.list = r.conversations || []; renderAi(); });
    return;
  }
  if ((el = ev.target.closest('[data-ai-load]'))) {
    ai.view = 'chat';
    ai.convId = el.getAttribute('data-ai-load');
    try { localStorage.setItem('ratchet-ai-conv', ai.convId); } catch (e) {}
    return loadConv(ai.convId);
  }
  if ((el = ev.target.closest('[data-ai-delete]'))) {
    var delId = el.getAttribute('data-ai-delete');
    return post('/api/assistant/delete', { id: delId }).then(function (res) {
      ai.list = (res.body && res.body.conversations) || [];
      if (ai.conv && ai.conv.id === delId) { ai.conv = null; ai.convId = ''; }
      renderAi();
    });
  }
  if ((el = ev.target.closest('[data-ai-decide]')) || (el = ev.target.closest('[data-ai-all]'))) {
    var payload = { id: ai.conv.id };
    if (el.hasAttribute('data-ai-all')) payload.all = el.getAttribute('data-ai-all') === '1';
    else { payload.decisions = {}; payload.decisions[el.getAttribute('data-ai-decide')] = el.getAttribute('data-v') === '1'; }
    el.disabled = true;
    // A click answers the question voice mode asked; stop listening for a yes.
    if (voice.on) voiceHold();
    return post('/api/assistant/decide', payload).then(function (res) {
      if (!res.ok) { el.disabled = false; return toast((res.body && res.body.error) || 'That didn\'t work.'); }
      ai.conv = res.body;
      if (voice.on) voice.mark = res.body.log.length;
      renderAi();
      aiPoll();
      // Whatever it added shows up behind the panel.
      setTimeout(function () { calRanges = {}; refresh(); refreshFinance(); if (tab === 'health') refreshHealth(); }, 600);
    });
  }
  if ((el = ev.target.closest('[data-ai-undo]'))) {
    el.disabled = true;
    return post('/api/assistant/undo', { changeId: el.getAttribute('data-ai-undo') }).then(function (res) {
      if (!res.ok) { el.disabled = false; return toast((res.body && res.body.error) || 'Couldn\'t undo that.'); }
      el.textContent = 'Undone';
      toast('Put back ' + res.body.path + '.' + (/\.js$/.test(res.body.path) ? ' Restart the engine to load it.' : /\.html$/.test(res.body.path) ? ' Reload to see it.' : ''));
    });
  }

  /* AI settings */

  if ((el = ev.target.closest('[data-ai-key-save]')) || (el = ev.target.closest('[data-ai-key-remove]'))) {
    var removing = el.hasAttribute('data-ai-key-remove');
    var keyInput = document.getElementById('ai-key');
    var keyVal = removing ? '' : (keyInput ? keyInput.value.trim() : '');
    if (!removing && !keyVal) return toast('Paste the key first.');
    if (removing && !window.confirm('Remove the API key? The assistant and file scanning stop until you add one again.')) return;
    el.disabled = true;
    return post('/api/ai/key', { key: keyVal }).then(function (res) {
      el.disabled = false;
      if (!res.ok) return toast((res.body && res.body.error) || 'That didn\'t save.');
      if (keyInput) keyInput.value = '';
      ai.status = res.body.ai;
      toast(removing ? 'Key removed.' : 'Key saved. The assistant is ready.');
      render();
    });
  }

  /* news subscriptions */

  if ((el = ev.target.closest('[data-sub-toggle]'))) {
    var subId = el.getAttribute('data-sub-toggle'), turnOn = !el.classList.contains('on');
    el.classList.toggle('on', turnOn);
    return post('/api/news/subscription', { id: subId, on: turnOn }).then(function (res) {
      if (!res.ok) return toast((res.body && res.body.error) || 'That didn\'t save.');
      refreshNews(false);
    });
  }
  if ((el = ev.target.closest('[data-sub-no]'))) {
    return post('/api/news/suggestion/dismiss', { id: el.getAttribute('data-sub-no') }).then(function () { refreshNews(false); });
  }

  /* news */

  if ((el = ev.target.closest('[data-news-source]'))) {
    newsSource = el.getAttribute('data-news-source');
    try { localStorage.setItem('ratchet-news-source', newsSource); } catch (e) {}
    refreshNews(false);
    return render();
  }

  if ((el = ev.target.closest('[data-news-refresh]'))) {
    refreshNews(true);
    return render();
  }

  /* finance */

  if ((el = ev.target.closest('[data-fin-brief-refresh]'))) return refreshFinBrief(true);

  /* a subscription's charge history, opened in place or from elsewhere on the page */
  if ((el = ev.target.closest('[data-sub-open]'))) {
    var subId = el.getAttribute('data-sub-open');
    if (el.hasAttribute('data-sub-jump')) {
      setFinTab('subscriptions');
      finInfo = null;
      finSubOpen[subId] = true;
      var subRow = (((finData && finData.summary && finData.summary.subscriptions) || {}).list || []).filter(function (x) { return x.id === subId; })[0];
      if (subRow && subRow.status !== 'active' && subRow.status !== 'trial') finSubFilter = 'all';
      render();
      setTimeout(function () { var r = document.getElementById('sub-' + subId); if (r) r.scrollIntoView({ block: 'center', behavior: 'smooth' }); }, 60);
      return;
    }
    finSubOpen[subId] = !finSubOpen[subId];
    return render();
  }

  if ((el = ev.target.closest('[data-fin-tab]'))) {
    setFinTab(el.getAttribute('data-fin-tab'));
    finInfo = null;
    if (finEdit && finTabFor(finEdit.kind, finEdit.card) !== finTab) { finEdit = null; delete errors._fin; }
    render();
    var tabsBar = document.querySelector('.fv-tabs');
    if (tabsBar && tabsBar.getBoundingClientRect().top < 0) tabsBar.scrollIntoView({ block: 'start', behavior: 'smooth' });
    return;
  }

  if ((el = ev.target.closest('[data-fin-info]'))) {
    var infoFor = el.getAttribute('data-fin-info');
    finInfo = finInfo === infoFor ? null : infoFor;
    render();
    if (finInfo) setTimeout(function () { var p = document.getElementById('fv-info'); if (p) p.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); }, 40);
    return;
  }

  if ((el = ev.target.closest('[data-sub-filter]'))) {
    finSubFilter = el.getAttribute('data-sub-filter');
    return render();
  }

  if ((el = ev.target.closest('[data-sub-ok]')) || (el = ev.target.closest('[data-sub-status]'))) {
    var okId = el.getAttribute('data-sub-ok');
    var stParts = okId ? [okId] : el.getAttribute('data-sub-status').split('|');
    var subPatch = okId ? { id: okId, reviewed: true } : { id: stParts[0], status: stParts[1], reviewed: true };
    el.disabled = true;
    return post('/api/finance/save', { kind: 'subscriptions', item: subPatch }).then(function (res) {
      el.disabled = false;
      if (!res.ok) return toast((res.body && res.body.error) || 'That didn\'t save.');
      finData = res.body.finance;
      render();
      toast(okId ? 'Kept. It\'s one of your subscriptions now.' : subPatch.status === 'cancelled' ? 'Marked cancelled. Any charge after today gets flagged.' : 'Marked active again.');
    });
  }

  if ((el = ev.target.closest('[data-sub-notmine]'))) {
    var nmId = el.getAttribute('data-sub-notmine');
    var nm = finItem('subscriptions', nmId);
    if (!window.confirm('Remove ' + (nm ? nm.name : 'this') + '? Mellow won\'t add it again from your email.')) return;
    return post('/api/finance/delete', { kind: 'subscriptions', id: nmId }).then(function (res) {
      if (!res.ok) return toast((res.body && res.body.error) || 'That didn\'t delete.');
      finData = res.body.finance;
      render();
      toast('Removed. It won\'t be found again.');
    });
  }

  if ((el = ev.target.closest('[data-sub-scan]'))) {
    el.disabled = true;
    toast('Checking your email for receipts and renewals…');
    return post('/api/google/sync', {}).then(function (res) {
      el.disabled = false;
      if (!res.ok) return toast((res.body && res.body.error) || 'Couldn\'t check your email.');
      return refreshFinance().then(function () {
        var scan = finData && finData.settings && finData.settings.subscriptionScan;
        toast(scan && scan.lastError ? 'Stopped: ' + scan.lastError : scan && scan.lastRead ? 'Read ' + plural(scan.lastRead, 'billing email') + ': ' + plural(scan.lastNew || 0, 'new subscription') + ', ' + plural(scan.lastRenewals || 0, 'renewal') + '.' : 'No new billing emails since the last check.');
      });
    });
  }

  if ((el = ev.target.closest('[data-fin-add]')) || (el = ev.target.closest('[data-fin-edit]'))) {
    var finParts = (el.getAttribute('data-fin-edit') || el.getAttribute('data-fin-add')).split('|');
    finEdit = finParts[0] === 'cards'
      ? { kind: 'accounts', id: finParts[1] || null, card: true }
      : { kind: finParts[0], id: finParts[1] || null };
    setFinTab(finTabFor(finParts[0], finParts[0] === 'cards'));
    delete errors._fin;
    render();
    var form = document.querySelector('.fin-form');
    if (form) {
      form.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
      var first = form.querySelector('input:not([type=checkbox]), select');
      if (first) first.focus();
    }
    return;
  }

  if ((el = ev.target.closest('[data-fin-cancel]'))) {
    finEdit = null;
    delete errors._fin;
    return render();
  }

  if ((el = ev.target.closest('[data-fin-save]'))) {
    var saveKind = el.getAttribute('data-fin-save'), wasNew = !(finEdit && finEdit.id);
    var finItemIn = finCollect(saveKind);
    el.disabled = true;
    return post('/api/finance/save', { kind: saveKind, item: finItemIn }).then(function (res) {
      el.disabled = false;
      if (!res.ok) { errors._fin = (res.body && res.body.error) || 'That didn\'t save.'; return render(); }
      delete errors._fin;
      finData = res.body.finance;
      finAt = Date.now();
      // Adding transactions tends to come in runs, so that form stays open.
      if (saveKind === 'transactions' && wasNew) {
        ['description', 'amount'].forEach(function (f) { var i = document.getElementById('fin-f-' + f); if (i) i.value = ''; });
        render();
        var desc = document.getElementById('fin-f-description');
        if (desc) desc.focus();
      } else {
        finEdit = null;
        render();
      }
      toast(wasNew ? 'Added.' : 'Saved.');
    });
  }

  if ((el = ev.target.closest('[data-fin-del]'))) {
    var delParts = el.getAttribute('data-fin-del').split('|');
    var victim = finItem(delParts[0], delParts[1]);
    var label = victim ? (victim.name || victim.description || victim.category || victim.symbol) : 'this';
    if (!window.confirm('Delete ' + label + '?')) return;
    return post('/api/finance/delete', { kind: delParts[0], id: delParts[1] }).then(function (res) {
      if (!res.ok) return toast((res.body && res.body.error) || 'That didn\'t delete.');
      finData = res.body.finance;
      if (finEdit && finEdit.id === delParts[1]) finEdit = null;
      render();
      toast('Deleted.');
    });
  }

  if ((el = ev.target.closest('[data-fin-paid]')) || (el = ev.target.closest('[data-fin-unpaid]'))) {
    var paying = el.hasAttribute('data-fin-paid');
    var billParts = el.getAttribute(paying ? 'data-fin-paid' : 'data-fin-unpaid').split('|');
    el.disabled = true;
    return post('/api/finance/' + (paying ? 'paid' : 'unpaid'), { id: billParts[0], occurrence: billParts[1] }).then(function (res) {
      if (!res.ok) { el.disabled = false; return toast((res.body && res.body.error) || 'That didn\'t work.'); }
      finData = res.body.finance;
      render();
      if (paying) {
        var isCard = (finData.bills || []).some(function (b) { return b.id === billParts[0] && b.cardId; });
        toast(isCard ? 'Marked paid. The card balance went down.' : 'Marked and logged.', 'Undo', function () {
          post('/api/finance/unpaid', { id: billParts[0], occurrence: billParts[1] }).then(function (r) { if (r.ok) { finData = r.body.finance; render(); } });
        });
      }
    });
  }

  if ((el = ev.target.closest('[data-fin-range]'))) {
    finRange = el.getAttribute('data-fin-range');
    try { localStorage.setItem('ratchet.finRange', finRange); } catch (_) {}
    return render();
  }
  if ((el = ev.target.closest('[data-fin-setup-all]'))) {
    finAllSetup = !finAllSetup;
    return render();
  }
  if ((el = ev.target.closest('[data-fin-go]'))) {
    var goId = el.getAttribute('data-fin-go');
    var goItem = ((finData && finData.setup) || []).filter(function (x) { return x.id === goId; })[0] ||
      ((state && state.tasks) || []).filter(function (x) { return x.id === goId; })[0];
    if (!goItem || !goItem.go) return switchTab('finance');
    return finGo(goItem.go);
  }
  if ((el = ev.target.closest('[data-fin-all]'))) {
    finAllTx = !finAllTx;
    return render();
  }

  /* sleep screen */

  if ((el = ev.target.closest('[data-sleep-now]'))) return enterSleep(true);

  if ((el = ev.target.closest('[data-art-tab]'))) {
    artTab = el.getAttribute('data-art-tab');
    return render();
  }

  if ((el = ev.target.closest('[data-art]'))) {
    var sc = sleepCfg();
    sc.artId = el.getAttribute('data-art');
    sc.shuffle = false;
    saveSleep();
    return render();
  }

  if ((el = ev.target.closest('[data-wzone]')) || (el = ev.target.closest('[data-wmove]'))) {
    var cfgW = sleepCfg(), wid = el.getAttribute('data-wid');
    var at = cfgW.widgets.map(function (w) { return w.id; }).indexOf(wid);
    if (at === -1) return;
    if (el.hasAttribute('data-wzone')) {
      cfgW.widgets[at].zone = el.getAttribute('data-wzone');
    } else {
      var to = at + Number(el.getAttribute('data-wmove'));
      if (to < 0 || to >= cfgW.widgets.length) return;
      cfgW.widgets.splice(to, 0, cfgW.widgets.splice(at, 1)[0]);
    }
    saveSleep();
    return render();
  }

  if ((el = ev.target.closest('[data-sleep-seg]'))) {
    var cfgS = sleepCfg(), segKey = el.getAttribute('data-sleep-seg'), v = el.getAttribute('data-v');
    cfgS[segKey] = segKey === 'hour12' ? v === '1' : v;
    saveSleep();
    return render();
  }

  if ((el = ev.target.closest('[data-custom-url]'))) {
    var input = document.getElementById('custom-url');
    var url = input ? input.value.trim() : '';
    if (!/^https?:\/\/\S+$/i.test(url)) return toast('That needs to be a full address, starting with https://');
    var cfgU = sleepCfg();
    cfgU.customUrl = url;
    cfgU.artId = 'custom';
    cfgU.shuffle = false;
    saveSleep();
    if (input) input.blur();
    toast('Using your picture.');
    return render();
  }

  /* guide */

  if ((el = ev.target.closest('[data-guide-jump]'))) {
    var target = document.getElementById(el.getAttribute('data-guide-jump'));
    if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
    if (target && target.id === 'g-name') { var nameIn = document.getElementById('guide-name'); if (nameIn) setTimeout(function () { nameIn.focus({ preventScroll: true }); }, 400); }
    return;
  }
  if ((el = ev.target.closest('[data-guide-os]'))) { guideOs = el.getAttribute('data-guide-os'); return render(); }
  if ((el = ev.target.closest('[data-copy]'))) return copyText(el.getAttribute('data-copy'));
  if ((el = ev.target.closest('[data-guide-dismiss]'))) {
    try { localStorage.setItem('ratchet-guide-seen', '1'); } catch (e) {}
    return render();
  }
  if ((el = ev.target.closest('[data-guide-name]'))) return saveGuideName(el);

  if (ev.target.closest('.help-backdrop') && !ev.target.closest('.help')) closeHelp();
});

function saveGuideName(btn) {
  var input = document.getElementById('guide-name');
  if (!input) return;
  if (btn) btn.disabled = true;
  return post('/api/profile', { name: input.value }).then(function (res) {
    if (btn) btn.disabled = false;
    if (res.status === 404) return toast('Restart Mellow first, then try again.');
    if (!res.ok) return toast((res.body && res.body.error) || 'That didn\'t save.');
    state = res.body.state || state;
    input.blur();
    toast(state.profile && state.profile.name ? 'Hello, ' + state.profile.name + '.' : 'Name cleared.');
    render();
  });
}

document.addEventListener('change', function (ev) {
  var el = ev.target;
  if (el.matches('select[data-drop-move]')) {
    var moveId = el.getAttribute('data-drop-move');
    return post('/api/drops/move', { id: moveId, folder: el.value }).then(function (res) {
      if (res.status === 404) { render(); return toast('Restart Mellow to move files between folders.'); }
      if (!res.ok) return toast((res.body && res.body.error) || 'That didn\'t move.');
      dropsList = (dropsList || []).map(function (d) { return d.id === moveId ? Object.assign({}, d, { folder: res.body.drop.folder, folderBy: 'you' }) : d; });
      toast('Moved to ' + folderName(res.body.drop.folder) + '.');
      render();
    });
  }
  if (el.matches('[data-ai-set]') || el.matches('#ai-limit') || el.matches('[data-ai-model]')) {
    var patch = {};
    if (el.matches('[data-ai-set]')) patch[el.getAttribute('data-ai-set')] = el.checked;
    else if (el.matches('#ai-limit')) patch.monthlyLimitUsd = Number(el.value);
    else patch.model = el.value;
    return post('/api/ai/settings', patch).then(function (res) {
      if (!res.ok) return toast((res.body && res.body.error) || 'That didn\'t save.');
      ai.status = res.body.ai;
      toast('Saved.');
      render();
    });
  }
  if (el.matches('[data-fin-ai]')) {
    var share = {};
    share[el.getAttribute('data-fin-ai')] = el.checked;
    return post('/api/finance/ai', { share: share }).then(function (res) {
      if (!res.ok) { el.checked = !el.checked; return toast((res.body && res.body.error) || 'That didn\'t save.'); }
      finData = res.body.finance;
      render();
    });
  }
  // Switching an account to "Credit card" brings up the card's own fields.
  if (el.matches('#fin-f-type') && finEdit) {
    finEdit.card = el.value === 'credit';
    return render();
  }
  if (el.matches('[data-sleep-text]')) {
    if (/^\d{2}:\d{2}$/.test(el.value)) { sleepCfg()[el.getAttribute('data-sleep-text')] = el.value; saveSleep(); }
    return render();
  }
  if (el.matches('[data-sleep-style]')) {
    sleepCfg()[el.getAttribute('data-sleep-style')] = el.value;
    saveSleep();
    return render();
  }
  if (el.matches('input[data-flag]')) {
    var patch = { email: el.getAttribute('data-email') };
    patch[el.getAttribute('data-flag')] = el.checked;
    return post('/api/google/account', patch).then(function (res) { return afterWrite(res, '_accounts'); });
  }
  if (el.matches('[data-sleep-set]')) {
    var cfg = sleepCfg(), key = el.getAttribute('data-sleep-set');
    if (key === 'shuffle') {
      cfg.shuffle = el.checked;
      if (el.checked) { cfg.shuffleCollection = artTab; shuffleId = null; }
    } else if (el.type === 'checkbox') {
      cfg[key] = el.checked;
    } else if (key === 'dim') {
      cfg.dim = Number(el.value) / 100;
    } else {
      cfg[key] = Number(el.value);
    }
    saveSleep();
    if (key === 'keepAwake' && sleepOn) { if (cfg.keepAwake) holdWakeLock(); else releaseWakeLock(); }
    return render();
  }
});

/* The dim slider updates the preview while it is being dragged. */
document.addEventListener('input', function (ev) {
  var el = ev.target;
  if (!el.matches('input[data-sleep-set="dim"]')) return;
  var cfg = sleepCfg();
  cfg.dim = Number(el.value) / 100;
  saveSleep();
  var label = document.getElementById('dim-val');
  if (label) label.textContent = el.value + '%';
  if (previewCanvas) previewCanvas.root.style.setProperty('--dim', cfg.dim);
});

/* Keyboard: 1 to 9 for sections, S to sync, Z to sleep, ? for the list. */
function openHelp() {
  if (document.querySelector('.help-backdrop')) return;
  var d = document.createElement('div');
  d.className = 'help-backdrop';
  d.innerHTML = '<div class="card help"><div class="eyebrow">Keyboard</div><h3 style="margin-top:6px">Shortcuts</h3>' +
    [['Today', '1'], ['ADHD tools', '2'], ['Tasks', '3'], ['News', '4'], ['Finance', '5'], ['Health', 'H'], ['Files', '6'], ['Sleep screen settings', '7'], ['Accounts', '8'], ['Guide', '9'], ['Assistant', 'A'], ['Talk to Mellow (voice)', 'Ctrl Space'],
     ['Get going: focus on the next thing', 'G'], ['Park a thought', 'Q'], ['Organize this page', 'O'], ['Day, week or month', 'D W M'], ['Back or forward', '← →'], ['Back to today', 'T'],
     ['Sleep now', 'Z'], ['Night mode, only the time', 'N'], ['Morning briefing', 'B'], ['Full screen', 'F'], ['Sync now', 'S'], ['This list', '?'], ['Close', 'Esc']]
      .map(function (r) { return '<div class="row"><span>' + r[0] + '</span><kbd>' + r[1] + '</kbd></div>'; }).join('') + '</div>';
  document.body.appendChild(d);
}
function closeHelp() { var d = document.querySelector('.help-backdrop'); if (d) d.remove(); }

/* Enter saves your name in the guide. */
document.addEventListener('keydown', function (ev) {
  if (ev.key === 'Enter' && ev.target.id === 'guide-name') { ev.preventDefault(); saveGuideName(document.querySelector('[data-guide-name]')); }
});

/* Enter saves a Finance form; Escape closes it. */
document.addEventListener('keydown', function (ev) {
  var form = ev.target.closest && ev.target.closest('.fin-form');
  if (!form) return;
  if (ev.key === 'Enter' && ev.target.tagName !== 'SELECT') {
    ev.preventDefault();
    var btn = form.querySelector('[data-fin-save]');
    if (btn && !btn.disabled) btn.click();
  } else if (ev.key === 'Escape') {
    finEdit = null;
    delete errors._fin;
    render();
  }
});

document.addEventListener('keydown', function (ev) {
  if (ev.ctrlKey || ev.metaKey || ev.altKey) return;
  if (/input|textarea|select/i.test((ev.target.tagName || ''))) return;
  if (ev.key === 'Escape') { if (document.querySelector('.help-backdrop')) return closeHelp(); return closePanel(); }
  if (panelOpen && !/^Arrow/.test(ev.key)) return;
  if (ev.key === '?') return openHelp();
  var t = TABS.filter(function (x) { return x.key.toLowerCase() === String(ev.key).toLowerCase(); })[0];
  if (t) return switchTab(t.id);
  if (ev.key === 's' || ev.key === 'S') return doSync(null);
  if (ev.key === 'z' || ev.key === 'Z') return enterSleep(true);
  if (ev.key === 'n' || ev.key === 'N') return enterNight();
  if (ev.key === 'f' || ev.key === 'F') return toggleFullscreen();
  if (ev.key === 'b' || ev.key === 'B') return startBriefing(false);
  if (ev.key === 'a' || ev.key === 'A') { ev.preventDefault(); return aiOpen(); }
  if (ev.key === 'g' || ev.key === 'G') { var go = pickNext()[0]; return go ? startFocus(go.t.id) : startFocus(null); }
  if (ev.key === 'q' || ev.key === 'Q') { ev.preventDefault(); return openCapture(); }
  if (ev.key === 'o' || ev.key === 'O') { ev.preventDefault(); return openOrganize(); }
  if (tab === 'today' && /^[dwmDWM]$/.test(ev.key)) return setCalView({ d: 'day', w: 'week', m: 'month' }[ev.key.toLowerCase()]);
  if (tab === 'today' && (ev.key === 'ArrowLeft' || ev.key === 'ArrowRight')) { ev.preventDefault(); return stepDay(ev.key === 'ArrowLeft' ? -1 : 1); }
  if (ev.key === 't' || ev.key === 'T') return showDay(keyOf(new Date()));
});

window.addEventListener('hashchange', function () {
  var h = location.hash.replace('#', '');
  if (h !== tab) switchTab(h);
});

/* Drop a file anywhere to scan it. Onto the assistant, it is attached to the conversation instead. */
(function dropFiles() {
  var depth = 0;
  var hasFiles = function (ev) { return ev.dataTransfer && Array.prototype.indexOf.call(ev.dataTransfer.types || [], 'Files') !== -1; };
  var veil = function (on) {
    mountPanels();
    document.getElementById('drop-veil').classList.toggle('on', on);
    var hint = document.getElementById('drop-hint');
    if (hint) hint.textContent = DROP_HINT;
  };
  document.addEventListener('dragenter', function (ev) {
    if (!hasFiles(ev) || sleepOn) return;
    depth++;
    if (!ev.target.closest || !ev.target.closest('#ai-panel')) veil(true);
  });
  document.addEventListener('dragleave', function (ev) {
    if (!hasFiles(ev)) return;
    depth = Math.max(0, depth - 1);
    if (!depth) veil(false);
  });
  document.addEventListener('dragover', function (ev) {
    if (!hasFiles(ev)) return;
    ev.preventDefault();
    var overAi = ev.target.closest && ev.target.closest('#ai-panel');
    if (overAi) veil(false); else if (depth) veil(true);
  });
  document.addEventListener('drop', function (ev) {
    if (!hasFiles(ev)) return;
    ev.preventDefault();
    depth = 0;
    veil(false);
    var files = Array.prototype.slice.call(ev.dataTransfer.files || []);
    if (!files.length) return;
    if (ev.target.closest && ev.target.closest('#ai-panel')) return attachToAssistant(files);
    scanFiles(files, tab);
  });
})();

animateNextRender();
mountPanels();
refresh();
loadOwnArt();
setInterval(refresh, 30000);
</script>
