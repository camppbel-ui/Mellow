<style>
/* ==========================================================================
   Tokens. Black, white, and one blue. White carries the content, blue marks
   where you are and what moves you forward. Red and amber are kept for late
   and due-soon: they are signals, not decoration.
   ========================================================================== */
:root {
  color-scheme: dark;

  --bg: #050506;
  --surface: #0c0d10;
  --surface-2: #14161a;
  --surface-3: #1b1e24;
  --line: #1d2026;
  --line-strong: #2d323b;
  --ink: #f4f6fa;
  --ink-2: #c5cbd5;
  --muted: #8b929e;
  --faint: #5a616c;

  --accent: #5b9bff;
  --accent-strong: #2f6bff;
  --accent-ink: #ffffff;
  --accent-soft: #0e1a30;
  --accent-line: rgba(91, 155, 255, 0.32);
  --glow: rgba(47, 107, 255, 0.10);

  --good: #5fc796;
  --good-soft: #0d1f17;
  --warn: #e6b35c;
  --warn-soft: #231b0c;
  --bad: #f07a70;
  --bad-soft: #2a1210;

  --shadow: 0 1px 0 rgba(255, 255, 255, 0.03) inset, 0 18px 40px -20px rgba(0, 0, 0, 0.9);

  --r-sm: 6px;
  --r: 12px;
  --r-lg: 16px;

  --sans: "Geist", "Segoe UI Variable Text", "Segoe UI", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
  --serif: "Instrument Serif", "Iowan Old Style", "Palatino Linotype", Georgia, serif;
  --mono: "Geist Mono", "Cascadia Mono", Consolas, "SF Mono", monospace;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
html { background: var(--bg); -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body {
  margin: 0; color: var(--ink); background: transparent; /* html paints the black, so the glow layer shows */
  font: 400 14px/1.55 var(--sans);
  -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; text-rendering: optimizeLegibility;
}
/* A faint blue light from the top corner. Its own fixed layer, so scrolling never repaints it. */
body::before {
  content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
  background:
    radial-gradient(1100px 520px at 88% -8%, var(--glow), transparent 62%),
    radial-gradient(900px 480px at -10% 110%, rgba(47, 107, 255, 0.05), transparent 60%);
}
button { font: inherit; color: inherit; }
button, a, label, summary { -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
a { color: var(--accent); text-underline-offset: 3px; }
::selection { background: rgba(91, 155, 255, 0.35); color: #fff; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
svg { flex: none; }

.eyebrow { font: 500 10.5px/1.2 var(--mono); letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
.serif { font-family: var(--serif); font-weight: 400; }
.muted { color: var(--muted); }
.err { color: var(--bad); font-size: 13px; margin-top: 8px; }

/* ==========================================================================
   Shell: sidebar on a desktop, top bar on anything narrow.
   ========================================================================== */
.shell { display: grid; grid-template-columns: 244px minmax(0, 1fr); min-height: 100%; }

.side {
  position: sticky; top: 0; height: 100vh; height: 100dvh; overflow-y: auto; scrollbar-width: none;
  border-right: 1px solid var(--line); padding: 28px 18px 20px max(18px, env(safe-area-inset-left));
  background: linear-gradient(180deg, rgba(12, 13, 16, 0.92), rgba(5, 5, 6, 0.92));
  display: flex; flex-direction: column; gap: 28px;
}
.brand { display: flex; align-items: center; gap: 12px; padding: 0 8px; }
.brand img { width: 28px; height: 28px; border-radius: 8px; box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.08), 0 6px 18px -6px rgba(47, 107, 255, 0.6); }
.logo-mark { width: 34px; height: 34px; flex: none; border-radius: 9px; display: block; box-shadow: 0 8px 22px -8px rgba(47, 107, 255, 0.85), 0 0 0 1px rgba(255, 255, 255, 0.06); animation: logo-breathe 6s ease-in-out infinite; }
.logo-mark svg { width: 100%; height: 100%; display: block; }
@keyframes logo-breathe { 50% { box-shadow: 0 10px 30px -8px rgba(91, 155, 255, 1), 0 0 0 1px rgba(255, 255, 255, 0.1); } }
.brand b { display: block; font: 400 28px/0.9 var(--serif); letter-spacing: -0.01em; }
.brand b::after { content: "."; color: var(--accent); }
.brand small { display: block; margin-top: 6px; }

.nav { display: flex; flex-direction: column; gap: 2px; }
.nav button {
  position: relative; display: flex; align-items: center; gap: 11px; width: 100%;
  background: none; border: 0; border-radius: 8px; padding: 9px 10px;
  color: var(--muted); font-weight: 450; font-size: 13.5px; cursor: pointer; text-align: left;
  transition: background 0.15s, color 0.15s;
}
.nav button svg { width: 16px; height: 16px; opacity: 0.7; }
.nav button:hover { background: var(--surface-2); color: var(--ink); }
.nav button.on { background: linear-gradient(90deg, var(--accent-soft), rgba(14, 26, 48, 0.25)); color: var(--ink); box-shadow: inset 0 0 0 1px rgba(91, 155, 255, 0.14); font-weight: 550; }
.nav button.on::before { content: ""; position: absolute; left: -18px; top: 8px; bottom: 8px; width: 2px; border-radius: 2px; background: var(--accent); box-shadow: 0 0 12px var(--accent); }
.nav button.on svg { opacity: 1; color: var(--accent); }
.nav .count { margin-left: auto; font: 500 11px/1 var(--mono); color: var(--ink-2); padding: 3px 6px; border-radius: 4px; background: var(--surface-3); }
.nav .count.hot { background: var(--bad); color: #fff; }
.nav kbd { margin-left: auto; }
.nav .count + kbd { margin-left: 6px; }

kbd {
  font: 500 10.5px/1 var(--mono); color: var(--faint); border: 1px solid var(--line-strong);
  border-bottom-width: 2px; border-radius: 5px; padding: 3px 5px; background: var(--surface);
}

.side-card { border-top: 1px solid var(--line); padding: 20px 8px 0; }
.side-card .big { font: 400 40px/1 var(--serif); margin: 10px 0 4px; }
.meter { height: 3px; background: var(--line-strong); border-radius: 2px; overflow: hidden; }
.meter i { display: block; height: 100%; background: linear-gradient(90deg, var(--accent-strong), var(--accent)); box-shadow: 0 0 10px rgba(91, 155, 255, 0.5); transition: width 0.8s; }
.side-foot { margin-top: auto; display: flex; flex-direction: column; gap: 12px; color: var(--muted); font-size: 12.5px; border-top: 1px solid var(--line); padding: 16px 8px 0; }
.passes-dots { display: flex; gap: 5px; align-items: center; }
.passes-dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); display: inline-block; }
.passes-dots i.used { background: var(--line-strong); }
.link-btn { display: flex; align-items: center; gap: 8px; background: none; border: 0; padding: 0; color: var(--muted); cursor: pointer; font-size: 12.5px; text-align: left; }
.link-btn svg { width: 14px; height: 14px; }
.link-btn:hover { color: var(--ink); }
.link-btn kbd { margin-left: auto; }
.link-btn.spin svg { animation: spin 0.9s linear infinite; }
.link-btn.upd-link { color: var(--accent); font-weight: 550; }
.link-btn.upd-link .upd-dot { margin-left: auto; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 10px var(--accent); }
.upd-row { align-items: flex-start; }
.upd-notes { margin-top: 10px; padding: 10px 12px; border-left: 2px solid var(--accent-line); background: var(--surface-2); border-radius: 0 8px 8px 0; color: var(--ink-2); font-size: 12.5px; line-height: 1.5; white-space: pre-wrap; max-height: 220px; overflow: auto; }
@keyframes spin { to { transform: rotate(360deg); } }

.topbar { display: none; }
.main { min-width: 0; padding: 44px max(48px, env(safe-area-inset-right)) 90px 48px; }
.page { max-width: 900px; margin: 0 auto; }
/* Built for a 1920×1080 screen: the page uses the width instead of a narrow column. */
@media (min-width: 1300px) {
  .main { padding: 30px 40px 60px; }
  .page { max-width: 1600px; }
  .hero h1, .page-head h1 { font-size: 44px; margin: 8px 0 8px; }
  .page-head { margin-bottom: 20px; }
  .hero .quip, .page-head p { max-width: 900px; }
}

@media (max-width: 860px) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  .shell > div { min-width: 0; }
  .side { display: none; }
  .topbar {
    display: block; position: sticky; top: 0; z-index: 20; color: var(--ink);
    background: rgba(5, 5, 6, 0.82); backdrop-filter: blur(18px) saturate(1.4); -webkit-backdrop-filter: blur(18px) saturate(1.4);
    border-bottom: 1px solid var(--line);
    padding: calc(12px + env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) 0 max(16px, env(safe-area-inset-left));
  }
  .topbar .row1 { display: flex; align-items: center; gap: 10px; }
  .topbar img { width: 24px; height: 24px; border-radius: 7px; }
  .topbar b { font: 400 24px/1 var(--serif); }
  .topbar b::after { content: "."; color: var(--accent); }
  .topbar .meta { margin-left: auto; font: 500 10.5px/1 var(--mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
  .topbar .moon { background: var(--surface-2); border: 1px solid var(--line); color: inherit; border-radius: 8px; padding: 7px 9px; cursor: pointer; display: grid; place-items: center; }
  .topbar .moon svg { width: 15px; height: 15px; }
  .topbar nav { display: flex; gap: 2px; margin-top: 10px; overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
  .topbar nav::-webkit-scrollbar { display: none; }
  .topbar nav button {
    background: none; border: 0; color: var(--muted); padding: 10px 12px 12px; white-space: nowrap;
    border-bottom: 2px solid transparent; font-weight: 500; font-size: 14px; cursor: pointer;
  }
  .topbar nav button.on { color: var(--ink); border-bottom-color: var(--accent); }
  .main { padding: 26px max(16px, env(safe-area-inset-right)) calc(76px + env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); }
}

/* ==========================================================================
   Page heads and the Calendar's opening
   ========================================================================== */
.hero { margin: 0 0 8px; }
.hero h1, .page-head h1 { margin: 12px 0 10px; font: 400 50px/1 var(--serif); letter-spacing: -0.02em; }
.hero .quip, .page-head p { margin: 0; color: var(--ink-2); font-size: 15px; max-width: 620px; }
.hero .quip b, .page-head p b { font-weight: 600; color: var(--ink); }
.page-head { margin: 0 0 28px; }
.page-head p { color: var(--muted); }

.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); margin-top: 30px; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.stat { padding: 18px 22px 18px 0; min-width: 0; }
.stat + .stat { padding-left: 22px; border-left: 1px solid var(--line); }
.stat .val { font: 400 42px/1 var(--serif); margin-top: 12px; display: flex; align-items: baseline; gap: 8px; }
.stat .val small { font: 500 12px var(--mono); color: var(--muted); }
.stat .sub { color: var(--muted); font-size: 12.5px; margin-top: 8px; }
.stat .meter { margin-top: 14px; }
.stat.hot .val { color: var(--bad); }
@media (max-width: 560px) {
  .hero h1, .page-head h1 { font-size: 38px; }
  .stats { grid-template-columns: 1fr 1fr; }
  .stat:last-child { grid-column: span 2; border-left: 0; padding-left: 0; border-top: 1px solid var(--line); }
}

/* ==========================================================================
   Building blocks
   ========================================================================== */
.section-head { display: flex; align-items: baseline; gap: 12px; margin: 44px 0 14px; padding-bottom: 10px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.section-head h2 { margin: 0; font: 400 28px/1.05 var(--serif); letter-spacing: -0.01em; }
.section-head .sub { color: var(--muted); font-size: 12.5px; }
.section-head .right { margin-left: auto; }

.card { background: linear-gradient(180deg, var(--surface), rgba(12, 13, 16, 0.86)); border: 1px solid var(--line); border-radius: var(--r); box-shadow: 0 1px 0 rgba(255, 255, 255, 0.03) inset; }
.lift { transition: border-color 0.15s, box-shadow 0.15s; }
.lift:hover { border-color: var(--line-strong); box-shadow: var(--shadow); }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  border: 1px solid var(--line-strong); background: var(--surface-2); color: var(--ink);
  border-radius: 8px; padding: 7px 13px; font-weight: 500; font-size: 13px; cursor: pointer;
  transition: background 0.15s, border-color 0.15s, color 0.15s, box-shadow 0.15s; white-space: nowrap;
}
.btn:hover:not(:disabled) { border-color: #4a515d; background: var(--surface-3); }
.btn:disabled { opacity: 0.45; cursor: default; }
.btn svg { width: 14px; height: 14px; }
.btn.primary { background: linear-gradient(180deg, #4a86ff, var(--accent-strong)); border-color: #3a76ff; color: var(--accent-ink); box-shadow: 0 1px 0 rgba(255, 255, 255, 0.18) inset, 0 8px 22px -10px rgba(47, 107, 255, 0.8); }
.btn.primary:hover:not(:disabled) { background: linear-gradient(180deg, #5b92ff, #3a76ff); border-color: #5b92ff; }
.btn.ghost { border-color: transparent; background: none; color: var(--muted); }
.btn.ghost:hover:not(:disabled) { color: var(--ink); background: var(--surface-2); }
.btn.sm { padding: 5px 10px; font-size: 12.5px; border-radius: 7px; }

.check {
  width: 24px; height: 24px; flex: none; border-radius: 50%; cursor: pointer; padding: 0;
  border: 1.5px solid var(--line-strong); background: transparent; display: grid; place-items: center;
  transition: border-color 0.15s, background 0.15s, box-shadow 0.15s;
}
.check svg { width: 12px; height: 12px; opacity: 0; color: var(--accent); transition: opacity 0.15s; }
.check:hover { border-color: var(--accent); }
.check:hover svg { opacity: 0.6; }
.check.done { background: var(--accent-strong); border-color: var(--accent-strong); box-shadow: 0 0 14px rgba(47, 107, 255, 0.55); }
.check.done svg { opacity: 1; color: #fff; }
.check.pop { animation: pop 0.35s ease; }
@keyframes pop { 50% { transform: scale(1.18); } }
.check:disabled { cursor: default; }

.pill {
  display: inline-flex; align-items: center; font: 500 10.5px/1 var(--mono); letter-spacing: 0.06em; text-transform: uppercase;
  padding: 4px 7px; border-radius: 4px; color: var(--muted); background: var(--surface-2); white-space: nowrap;
}
.pill.late { color: var(--bad); background: var(--bad-soft); }
.pill.soon { color: var(--warn); background: var(--warn-soft); }
.pill.near { color: var(--accent); background: var(--accent-soft); }
.pill.good { color: var(--good); background: var(--good-soft); }

.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; color: var(--ink-2); white-space: nowrap; }
.chip i { width: 7px; height: 7px; border-radius: 50%; background: var(--c, var(--accent)); }
.tag {
  display: inline-flex; align-items: center; font: 500 10px/1 var(--mono); letter-spacing: 0.09em; text-transform: uppercase;
  color: var(--muted); padding: 3px 6px; border: 1px solid var(--line); border-radius: 4px; white-space: nowrap;
}
.tag.solid { background: var(--ink); color: var(--bg); border-color: var(--ink); }
/* What a calendar entry is, and whether you have to be there. */
.elabel {
  display: inline-flex; align-items: center; gap: 5px; font: 500 10px/1 var(--mono); letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--ink-2); padding: 3px 6px; border: 1px solid var(--line); border-radius: 4px; white-space: nowrap; background: transparent; cursor: pointer;
}
button.elabel:hover { border-color: var(--line-strong); }
.elabel .att { color: var(--muted); }
.elabel.req .att { color: var(--warn); }
.elabel.opt .att { color: var(--good); }
.elabel.grp { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); cursor: default; }
.gap-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 14px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--line); }
.gap-row:last-child { border-bottom: 0; }
.gap-row .what { font-weight: 550; overflow-wrap: anywhere; }
.gap-row .why { color: var(--muted); font-size: 12.5px; margin-top: 3px; overflow-wrap: anywhere; }
@media (max-width: 560px) { .gap-row { grid-template-columns: minmax(0, 1fr); } }

.empty { text-align: center; padding: 42px 24px; border: 1px dashed var(--line-strong); border-radius: var(--r); color: var(--muted); background: rgba(12, 13, 16, 0.5); }
.empty .ico { width: 40px; height: 40px; margin: 0 auto 14px; border-radius: 50%; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent-line); }
.empty .ico svg { width: 17px; height: 17px; }
.empty b { display: block; font: 400 24px/1.15 var(--serif); color: var(--ink); margin-bottom: 4px; }

.alert { display: flex; gap: 12px; align-items: center; padding: 12px 14px; border-radius: var(--r); margin: 18px 0 0; border: 1px solid transparent; }
.alert svg { width: 17px; height: 17px; }
.alert.bad { background: var(--bad-soft); color: var(--bad); border-color: color-mix(in srgb, var(--bad) 25%, transparent); }
.alert.warn { background: var(--warn-soft); color: var(--warn); border-color: color-mix(in srgb, var(--warn) 25%, transparent); }
.alert .txt { color: var(--ink-2); flex: 1; }
.alert b { font-weight: 600; color: inherit; }

/* ==========================================================================
   Calendar
   ========================================================================== */
.strip { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; background: var(--surface); margin-bottom: 12px; }
.day-pill { border: 0; border-left: 1px solid var(--line); background: none; padding: 12px 4px 11px; text-align: center; cursor: pointer; transition: background 0.15s; }
.day-pill:first-child { border-left: 0; }
.day-pill:hover { background: var(--surface-2); }
.day-pill .dow { font: 500 10px/1 var(--mono); letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
.day-pill .num { font: 400 28px/1.1 var(--serif); margin: 5px 0 6px; }
.day-pill .dots { display: flex; justify-content: center; gap: 3px; min-height: 5px; flex-wrap: wrap; }
.day-pill .dots i { width: 5px; height: 5px; border-radius: 50%; background: var(--faint); }
.day-pill .dots i.d { background: var(--warn); }
.day-pill .dots i.l { background: var(--bad); }
.day-pill.today { background: linear-gradient(180deg, #3f7dff, var(--accent-strong)); color: #fff; }
.day-pill.today .dow { color: rgba(255, 255, 255, 0.72); }
.day-pill.today .dots i { background: #fff; }

.next-up { display: flex; align-items: center; gap: 14px; padding: 13px 16px; }
.dot-pulse { width: 8px; height: 8px; border-radius: 50%; background: var(--c, var(--accent)); flex: none; animation: pulse 2.2s infinite; }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--c, var(--accent)) 50%, transparent); } 70% { box-shadow: 0 0 0 9px transparent; } 100% { box-shadow: 0 0 0 0 transparent; } }
.next-up .what { font-weight: 500; margin-top: 3px; }

.day { margin-top: 30px; scroll-margin-top: 90px; }
.day-title { display: flex; align-items: baseline; gap: 12px; margin-bottom: 10px; }
.day-title h3 { margin: 0; font: 400 24px/1.1 var(--serif); }
.free-day { display: flex; align-items: baseline; gap: 14px; color: var(--faint); font-size: 13px; padding: 10px 0 0; margin-top: 14px; border-top: 1px dashed var(--line); }
.free-day b { font: 400 18px/1 var(--serif); color: var(--muted); min-width: 130px; }

.items { display: flex; flex-direction: column; gap: 6px; }
.item { display: grid; grid-template-columns: 86px 3px minmax(0, 1fr) auto; align-items: center; gap: 14px; padding: 12px 14px; }
.item .time { font: 400 11.5px/1.45 var(--mono); color: var(--muted); }
.item .time b { display: block; color: var(--ink); font-weight: 500; font-size: 12.5px; }
.item .bar { align-self: stretch; border-radius: 2px; background: var(--c, var(--accent)); }
.item .title { font-weight: 550; overflow-wrap: anywhere; }
.item .meta { color: var(--muted); font-size: 12.5px; margin-top: 5px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.item.late { border-color: color-mix(in srgb, var(--bad) 35%, var(--line)); }
@media (max-width: 560px) {
  .item { grid-template-columns: 62px 3px minmax(0, 1fr) auto; gap: 10px; padding: 11px; }
  .day-pill .num { font-size: 22px; }
}

/* ==========================================================================
   Tasks
   ========================================================================== */

}

@media (max-width: 560px) {

/* ==========================================================================

.fv-head-acts { margin-left: auto; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.fv-infobtn { display: inline-flex; align-items: center; gap: 8px; height: 31px; padding: 0 13px 0 5px; border-radius: 99px; border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink-2); font: 500 12.5px var(--sans); cursor: pointer; transition: border-color .15s, color .15s, background .15s; }
.fv-infobtn i { display: grid; place-items: center; width: 21px; height: 21px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); font: italic 700 13px/1 Georgia, var(--serif); box-shadow: inset 0 0 0 1px var(--accent-line); }
.fv-infobtn:hover, .fv-infobtn.on { border-color: var(--accent-line); color: var(--ink); background: var(--accent-soft); }
.fv-infobtn.on i { background: var(--accent); color: #fff; }

.fv-info { padding: 18px 20px; margin: 0 0 22px; border-color: var(--accent-line); background: linear-gradient(180deg, rgba(14, 26, 48, .6), var(--surface) 75%); }
.fv-info-top { display: flex; gap: 14px; align-items: flex-start; }
.fv-info-top p { margin: 5px 0 0; color: var(--ink-2); font-size: 13.5px; max-width: 78ch; }
.fv-info-top .btn { margin-left: auto; }
.fv-info-ic { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); flex: none; box-shadow: inset 0 0 0 1px var(--accent-line); }
.fv-info-ic svg { width: 18px; height: 18px; }
.fv-info-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin-top: 16px; }
.fv-ib { border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; background: rgba(5, 5, 6, .4); min-width: 0; }
.fv-ib h4 { display: flex; align-items: center; gap: 7px; margin: 0 0 9px; font: 500 10.5px/1.2 var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.fv-ib h4 svg { width: 14px; height: 14px; }
.fv-ib.best h4 svg { color: var(--accent); }
.fv-ib.show h4 svg { color: var(--good); }
.fv-ib.cover h4 svg { color: var(--bad); }
.fv-ib.how h4 svg { color: var(--warn); }
.fv-ib ul { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 7px; }
.fv-ib li { position: relative; padding-left: 13px; font-size: 12.5px; line-height: 1.45; color: var(--ink-2); overflow-wrap: anywhere; }
.fv-ib li::before { content: ""; position: absolute; left: 0; top: .62em; width: 5px; height: 5px; border-radius: 50%; background: var(--line-strong); }
.fv-ib.best li::before { background: var(--accent); }
.fv-ib.show li::before { background: var(--good); }
.fv-ib.cover li::before { background: var(--bad); }
.fv-ib.how li::before { background: var(--warn); }
.fv-ib b { color: var(--ink); font-weight: 600; }
.fv-info-acts { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }

.fv-sec { display: flex; align-items: baseline; gap: 10px; margin: 34px 0 12px; padding-bottom: 9px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.fv-sec h3 { margin: 0; font: 400 23px/1.1 var(--serif); }
.fv-sec > span { color: var(--muted); font-size: 12px; }
.fv-sec .btn { margin-left: auto; }
.fv-sec .btn svg { width: 13px; height: 13px; }
.fv-link { background: none; border: 0; padding: 0; color: var(--accent); font: inherit; cursor: pointer; }
.fv-link:hover { text-decoration: underline; }

/* big figures */
.fv-big { font: 400 60px/1 var(--serif); letter-spacing: -.02em; margin-top: 10px; font-variant-numeric: tabular-nums; }
.fv-big small { font: 500 12px var(--mono); color: var(--muted); margin-left: 10px; letter-spacing: .02em; }
.fv-figs { display: flex; gap: 6px 22px; flex-wrap: wrap; margin-top: 12px; color: var(--muted); font-size: 13px; }
.fv-figs b { font: 500 13.5px var(--mono); color: var(--ink); margin-right: 6px; }
.fv-hero { display: grid; grid-template-columns: minmax(0, 1fr) 300px; overflow: hidden; background: radial-gradient(700px 260px at 0% 0%, rgba(47, 107, 255, .09), transparent 70%), var(--surface); }
.fv-hero-main { padding: 22px 26px 16px; min-width: 0; }
.fv-hero-chart { height: 132px; margin-top: 14px; }
.fv-hero-chart svg { width: 100%; height: 100%; display: block; overflow: visible; }
.fv-hero-side { border-left: 1px solid var(--line); padding: 22px 24px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.fv-split { display: flex; height: 8px; border-radius: 99px; overflow: hidden; background: var(--line); gap: 2px; margin-top: 2px; }
.fv-split i { display: block; height: 100%; min-width: 3px; }
.fv-kv { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.fv-kv span { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 12.5px; }
.fv-kv span i { width: 8px; height: 8px; border-radius: 2px; }
.fv-kv b { font: 400 25px/1 var(--serif); font-variant-numeric: tabular-nums; }
.fv-kv b.neg { color: var(--bad); }
.fv-hero-side .btn svg { width: 13px; height: 13px; }

.fv-tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin-top: 12px; }
.fv-tile { padding: 15px 16px; min-width: 0; display: flex; flex-direction: column; gap: 5px; text-align: left; cursor: pointer; transition: border-color .15s, transform .15s; font: inherit; color: inherit; }
button.fv-tile:hover { border-color: var(--line-strong); transform: translateY(-1px); }
.fv-tile .v { font: 400 32px/1 var(--serif); font-variant-numeric: tabular-nums; margin-top: 6px; }
.fv-tile .v small { font: 500 11px var(--mono); color: var(--muted); margin-left: 4px; }
.fv-tile .s { color: var(--muted); font-size: 12px; }
.fv-tile.hot .v { color: var(--bad); }
.fv-tile .meter { margin-top: 6px; }

.fv-cols { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 0 40px; align-items: start; }
.fv-briefwrap { margin-top: 10px; }

/* coming up */
.fv-days { border-top: 1px solid var(--ink); }
.fv-day { display: grid; grid-template-columns: 88px minmax(0, 1fr); gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.fv-day .dl { font: 500 10.5px/1.3 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); padding-top: 4px; }
.fv-day .dl b { display: block; color: var(--ink); font: 400 20px/1 var(--serif); letter-spacing: 0; text-transform: none; margin-top: 4px; }
.fv-day.today .dl { color: var(--accent); }
.fv-ev { width: 100%; display: grid; grid-template-columns: 10px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 6px 8px; margin: 0 -8px; border: 0; border-radius: 8px; background: none; color: inherit; font: inherit; text-align: left; cursor: pointer; }
.fv-ev:hover { background: var(--surface); }
.fv-ev .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.fv-ev.bill .dot { background: var(--warn); }
.fv-ev.sub .dot { background: #a78bfa; }
.fv-ev.trial .dot { background: #2dd4bf; }
.fv-ev.card .dot { background: var(--accent); }
.fv-ev.payday .dot { background: var(--good); }
.fv-ev .nm { font-weight: 550; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fv-ev .nm small { font-weight: 400; color: var(--muted); margin-left: 8px; font-size: 12px; }
.fv-ev .a { font: 500 13px var(--mono); font-variant-numeric: tabular-nums; }
.fv-ev.payday .a { color: var(--good); }
.fv-ev.late .nm { color: var(--bad); }

.fv-bars { display: flex; flex-direction: column; gap: 11px; }
.fv-bar-row { display: grid; grid-template-columns: minmax(0, 130px) minmax(0, 1fr) auto; gap: 12px; align-items: center; font-size: 12.5px; }
.fv-bar-row .l { color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fv-bar-row .t { height: 8px; border-radius: 99px; background: var(--surface-3); overflow: hidden; }
.fv-bar-row .t i { display: block; height: 100%; border-radius: 99px; }
.fv-bar-row .a { font: 500 12px var(--mono); color: var(--ink); white-space: nowrap; }
.fv-bar-row .a small { color: var(--faint); }

.fv-mini { padding: 6px 14px; }
.fv-mini-row { width: 100%; display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 8px 4px; border: 0; border-bottom: 1px solid var(--line); background: none; color: inherit; font: inherit; text-align: left; cursor: pointer; }
.fv-mini-row:last-child { border-bottom: 0; }
.fv-mini-row:hover .nm { color: var(--accent); }
.fv-mini-row .nm { font-weight: 550; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fv-mini-row .nm small { display: block; font-weight: 400; color: var(--muted); font-size: 11.5px; }
.fv-mini-row .a { font: 500 13px var(--mono); }
.fv-bud { padding: 7px 0; }
.fv-bud .top { display: flex; justify-content: space-between; gap: 10px; font-size: 13px; }
.fv-bud .top b { font: 500 12.5px var(--mono); }
.fv-bud .top b small { color: var(--faint); }

/* subscriptions */
.fv-logo { width: 38px; height: 38px; border-radius: 10px; }
.fv-logo.mono b { font-size: 16px; }
.fv-logo.sm { width: 30px; height: 30px; border-radius: 8px; }
.fv-logo.sm.mono b { font-size: 13px; }
.fv-scan { display: flex; align-items: center; gap: 12px; padding: 10px 12px 10px 14px; margin: 0 0 14px; border: 1px solid var(--line); border-radius: 11px; background: var(--surface); font-size: 12.5px; color: var(--muted); flex-wrap: wrap; }
.fv-scan > svg { width: 16px; height: 16px; color: var(--accent); flex: none; }
.fv-scan > span:not(.fv-live) { flex: 1; min-width: 220px; }
.fv-scan b { color: var(--ink); font-weight: 550; }
.fv-scan.warn { border-color: rgba(230, 179, 92, .3); background: linear-gradient(90deg, var(--warn-soft), var(--surface) 60%); }
.fv-scan.warn > svg { color: var(--warn); }
.fv-live { width: 8px; height: 8px; border-radius: 50%; background: var(--good); flex: none; animation: fv-pulse 2.4s ease-out infinite; }
@keyframes fv-pulse { 0% { box-shadow: 0 0 0 0 rgba(95, 199, 150, .55); } 70%, 100% { box-shadow: 0 0 0 7px rgba(95, 199, 150, 0); } }

.fv-subhero { display: grid; grid-template-columns: minmax(0, 1fr) 340px; overflow: hidden; background: radial-gradient(640px 260px at 0% 0%, rgba(167, 139, 250, .11), transparent 70%), var(--surface); }
.fv-subhero-main { padding: 22px 26px; min-width: 0; }
.fv-subhero-side { border-left: 1px solid var(--line); padding: 22px 24px; min-width: 0; }
.fv-kpis { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); margin-top: 20px; border-top: 1px solid var(--line); }
.fv-kpi { padding: 14px 14px 0 0; min-width: 0; }
.fv-kpi + .fv-kpi { padding-left: 16px; border-left: 1px solid var(--line); }
.fv-kpi b { display: block; font: 400 26px/1 var(--serif); margin: 8px 0 4px; font-variant-numeric: tabular-nums; }
.fv-kpi small { color: var(--muted); font-size: 12px; }
.fv-payrow { display: grid; grid-template-columns: 26px minmax(0, 1fr) auto auto; gap: 10px; align-items: center; margin-top: 12px; font-size: 13px; }
.fv-payic { width: 26px; height: 26px; border-radius: 7px; display: grid; place-items: center; background: var(--surface-3); color: var(--ink-2); }
.fv-payic svg { width: 14px; height: 14px; }
.fv-payic.card { color: var(--accent); background: var(--accent-soft); }
.fv-payic.bank { color: var(--good); background: var(--good-soft); }
.fv-payrow .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fv-payrow .ct { font: 500 10.5px var(--mono); color: var(--muted); background: var(--surface-3); border-radius: 99px; padding: 2px 7px; }
.fv-payrow b { font: 500 13px var(--mono); }
.fv-payrow b small { color: var(--muted); font-weight: 400; }
.fv-paybar { height: 3px; background: var(--line); border-radius: 2px; margin: 7px 0 0 36px; overflow: hidden; }
.fv-paybar i { display: block; height: 100%; border-radius: 2px; background: linear-gradient(90deg, var(--accent-strong), #a78bfa); }
.fv-donut { margin-top: 10px; }
.fv-donut svg { width: 96px; height: 96px; }

.fv-review { margin-top: 16px; padding: 16px; border-radius: var(--r-lg); border: 1px solid var(--accent-line); background: linear-gradient(180deg, rgba(14, 26, 48, .75), rgba(12, 13, 16, .6)); box-shadow: 0 0 0 1px rgba(91, 155, 255, .05), 0 20px 50px -30px rgba(47, 107, 255, .6); }
.fv-review-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 12.5px; color: var(--muted); }
.fv-review-head svg { width: 16px; height: 16px; color: var(--accent); }
.fv-review-head b { color: var(--ink); font-size: 14px; }
.fv-review-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 320px), 1fr)); gap: 10px; margin-top: 12px; }
.fv-rcard { padding: 14px; display: grid; grid-template-columns: 38px minmax(0, 1fr) auto; gap: 4px 12px; align-items: center; }
.fv-rcard .nm { font-weight: 600; min-width: 0; overflow-wrap: anywhere; }
.fv-rcard .nm small { display: block; font-weight: 400; color: var(--muted); font-size: 12px; }
.fv-rcard .amt { font: 400 23px/1 var(--serif); text-align: right; white-space: nowrap; }
.fv-rcard .amt small { font: 500 11px var(--mono); color: var(--muted); }
.fv-rcard .meta, .fv-rcard .ev, .fv-rcard .acts { grid-column: 1 / -1; }
.fv-rcard .meta { color: var(--muted); font-size: 12px; margin-top: 8px; }
.fv-rcard .ev { color: var(--faint); font-size: 12px; font-style: italic; }
.fv-rcard .acts { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }

.fv-trackcard { padding: 16px 22px 12px; }
.fv-track { position: relative; margin: 0 14px; }
.fv-line { position: absolute; left: 0; right: 0; height: 2px; border-radius: 2px; background: linear-gradient(90deg, var(--accent), var(--line-strong) 35%, var(--line)); }
.fv-tick { position: absolute; width: 1px; height: 10px; background: var(--line-strong); }
.fv-pin { position: absolute; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; padding: 0; border: 0; background: none; cursor: pointer; z-index: 1; }
.fv-pin .slogo { width: 28px; height: 28px; border-radius: 8px; box-shadow: 0 0 0 2px var(--surface), 0 6px 14px -6px rgba(0, 0, 0, .9); transition: transform .15s; }
.fv-pin .slogo.mono b { font-size: 12px; }
.fv-pin:hover { z-index: 2; }
.fv-pin:hover .slogo { transform: translateY(-2px) scale(1.12); }
.fv-pin .stem { width: 2px; background: var(--line-strong); margin-top: 2px; }
.fv-pin.trial .slogo { box-shadow: 0 0 0 2px #2dd4bf, 0 6px 14px -6px rgba(0, 0, 0, .9); }
.fv-track-labels { display: flex; justify-content: space-between; margin: 8px 14px 0; font: 500 10.5px var(--mono); color: var(--faint); }

.fv-filter { display: flex; gap: 6px; flex-wrap: wrap; margin: 0 0 8px; align-items: center; }
.fv-filter button { border: 1px solid var(--line); background: var(--surface); color: var(--muted); font: 500 12.5px var(--sans); padding: 6px 12px; border-radius: 99px; cursor: pointer; }
.fv-filter button:hover { color: var(--ink); }
.fv-filter button.on { color: var(--ink); border-color: var(--accent-line); background: var(--accent-soft); }
.fv-filter button em { font: 500 11px var(--mono); font-style: normal; color: var(--faint); margin-left: 6px; }
.fv-filter .r { margin-left: auto; color: var(--faint); font: 500 10.5px var(--mono); letter-spacing: .04em; }

.fv-subs { border-top: 1px solid var(--ink); }
.fv-sub { border-bottom: 1px solid var(--line); }
.fv-sub-main { width: 100%; display: grid; grid-template-columns: 38px minmax(130px, 1fr) minmax(0, 1.35fr) 100px 108px 112px 16px; gap: 14px; align-items: center; padding: 11px 8px; background: none; border: 0; color: inherit; font: inherit; text-align: left; cursor: pointer; border-radius: 10px; transition: background .15s; }
.fv-sub-main:hover { background: var(--surface); }
.fv-sub.open .fv-sub-main { background: var(--surface); border-radius: 10px 10px 0 0; }
.fv-sub-id { min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.fv-sub-id b { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fv-sub-id > span { color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fv-sub-tags { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; min-width: 0; }
.fv-paywith { display: inline-flex; align-items: center; gap: 5px; font: 500 11px var(--mono); color: var(--ink-2); border: 1px solid var(--line); border-radius: 6px; padding: 2px 7px; white-space: nowrap; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
.fv-paywith svg { width: 11px; height: 11px; flex: none; }
.fv-paywith.card svg { color: var(--accent); }
.fv-paywith.bank svg { color: var(--good); }
.fv-sub-next { display: flex; flex-direction: column; font-size: 13px; line-height: 1.3; }
.fv-sub-next b { font-weight: 550; }
.fv-sub-next small { color: var(--muted); font-size: 11.5px; }
.fv-sub-next small.soon { color: var(--warn); }
.fv-sub-hist { display: grid; grid-template-columns: repeat(12, 1fr); gap: 3px; height: 20px; }
.fv-sub-hist i { border-radius: 2px; background: var(--surface-3); }
.fv-sub-hist i.on { background: linear-gradient(180deg, #a78bfa, var(--accent-strong)); }
.fv-sub-hist i.pre { background: transparent; box-shadow: inset 0 0 0 1px var(--line); }
.fv-sub-amt { text-align: right; font: 400 22px/1 var(--serif); font-variant-numeric: tabular-nums; white-space: nowrap; }
.fv-sub-amt small { display: block; font: 500 10.5px/1.5 var(--mono); color: var(--muted); margin-top: 3px; }
.fv-chev svg { width: 15px; height: 15px; color: var(--faint); transition: transform .2s; display: block; }
.fv-sub.open .fv-chev svg { transform: rotate(180deg); }
.fv-sub.off .fv-sub-id b, .fv-sub.off .fv-sub-amt { color: var(--muted); }
.fv-sub.off .fv-logo { filter: grayscale(1); opacity: .6; }
.fv-sub-detail { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px 30px; padding: 8px 18px 16px 60px; background: var(--surface); border-radius: 0 0 10px 10px; margin-bottom: 10px; }
.fv-facts { display: grid; grid-template-columns: auto 1fr; gap: 7px 16px; font-size: 12.5px; align-content: start; margin: 0; }
.fv-facts dt { color: var(--muted); }
.fv-facts dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.fv-charges table { width: 100%; border-collapse: collapse; font-size: 12.5px; margin-top: 8px; }
.fv-charges td { padding: 6px 0; border-bottom: 1px solid var(--line); }
.fv-charges td.src { color: var(--muted); padding: 6px 10px; }
.fv-charges td.a { text-align: right; font: 500 12.5px var(--mono); }
.fv-sub-acts { grid-column: 1 / -1; display: flex; gap: 6px; flex-wrap: wrap; padding-top: 4px; }

.fv-empty { padding: 36px 26px; text-align: center; }
.fv-empty .ic { width: 50px; height: 50px; border-radius: 14px; display: grid; place-items: center; margin: 0 auto 14px; background: var(--accent-soft); color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent-line); }
.fv-empty .ic svg { width: 22px; height: 22px; }
.fv-empty h3 { margin: 0; font: 400 28px/1.1 var(--serif); }
.fv-empty p { color: var(--muted); max-width: 54ch; margin: 10px auto 18px; font-size: 13.5px; }
.fv-empty .acts { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }

.fv-goals { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }
.fv-goal { padding: 16px; display: grid; grid-template-columns: 76px minmax(0, 1fr); gap: 16px; align-items: center; }
.fv-goal svg { width: 76px; height: 76px; }
.fv-goal svg text { font: 500 15px var(--mono); fill: var(--ink); }
.fv-goal .nm { font-weight: 600; }
.fv-goal .amt { font: 400 26px/1 var(--serif); margin-top: 6px; }
.fv-goal .amt small { font: 500 11px var(--mono); color: var(--muted); }
.fv-goal .sub { color: var(--muted); font-size: 12px; margin-top: 6px; }
.fv-goal .sub b { color: var(--ink); font-weight: 550; }
.fv-goal .acts { display: flex; gap: 4px; margin-top: 8px; }

.fv-privacy { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-top: 22px; }
.fv-privacy .card { padding: 16px 18px; }
.fv-privacy h4 { display: flex; align-items: center; gap: 8px; margin: 0 0 6px; font-size: 14px; font-weight: 600; }
.fv-privacy h4 svg { width: 16px; height: 16px; color: var(--accent); }
.fv-privacy p { margin: 0; color: var(--muted); font-size: 12.5px; line-height: 1.55; }
.fv-privacy b { color: var(--ink-2); font-weight: 600; }

@media (max-width: 1240px) {
  .fv-sub-main { grid-template-columns: 38px minmax(0, 1fr) 100px 108px 16px; }
  .fv-sub-tags { grid-column: 2 / -1; grid-row: 2; }
  .fv-sub-hist { display: none; }
  .fv-info-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 1000px) {
  .fv-hero, .fv-subhero { grid-template-columns: minmax(0, 1fr); }
  .fv-hero-side, .fv-subhero-side { border-left: 0; border-top: 1px solid var(--line); }

/* ==========================================================================
   Sleep screen settings
   ========================================================================== */
.sleep-preview { position: relative; aspect-ratio: 16 / 9; max-width: 100%; border-radius: var(--r-lg); overflow: hidden; background: #050506; box-shadow: var(--shadow); }
.sleep-preview .sleep-canvas { position: absolute; left: 0; top: 0; width: 1280px; height: 720px; font-size: 13.3px; transform-origin: 0 0; }
.sleep-preview .sleep-hint { display: none; }
.preview-actions { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-top: 14px; color: var(--muted); font-size: 13px; }

.set-card { padding: 2px 18px; }
.set-row { display: flex; align-items: center; gap: 12px 16px; flex-wrap: wrap; padding: 14px 0; border-top: 1px solid var(--line); }
.set-row:first-child { border-top: 0; }
.set-row .lbl { min-width: 0; flex: 1 1 240px; }
.set-row .lbl b { display: block; font-weight: 550; }
.set-row .lbl span { color: var(--muted); font-size: 12.5px; }
.set-row input[type=range] { width: 180px; max-width: 100%; accent-color: var(--accent-strong); }
.set-row select, .set-input { font: inherit; font-size: 13px; padding: 6px 10px; border-radius: 7px; min-width: 0; border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink); }
.set-input { flex: 1 1 240px; }

.widget-row { display: grid; grid-template-columns: 30px minmax(0, 1fr) auto auto; gap: 12px; align-items: center; padding: 12px 0; border-top: 1px solid var(--line); }
.widget-row:first-child { border-top: 0; }
.widget-row .ico { width: 30px; height: 30px; border-radius: 7px; display: grid; place-items: center; background: var(--surface-2); color: var(--ink-2); }
.widget-row .ico svg { width: 15px; height: 15px; }
.widget-row .name { font-weight: 550; }
.widget-row .desc { color: var(--muted); font-size: 12.5px; }
.widget-row.off .name, .widget-row.off .ico { opacity: 0.45; }
.move { display: inline-flex; gap: 0; }
.move .btn { padding: 4px 6px; }
@media (max-width: 560px) {
  .widget-row { grid-template-columns: 30px minmax(0, 1fr) auto; }
  .widget-row .seg { grid-column: 2 / -1; justify-self: start; }
  .widget-row .move { grid-column: 3; grid-row: 1; }
}

.art-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(158px, 1fr)); gap: 18px 14px; }
.art-tile { padding: 0; border: 0; background: none; text-align: left; cursor: pointer; color: inherit; }
.art-tile .mat {
  position: relative; display: block; aspect-ratio: 1 / 1; border-radius: var(--r-sm); background: #0e0f12;
  outline: 1px solid transparent; outline-offset: 3px; transition: outline-color 0.15s;
}
/* To scale: the whole painting, never cropped, inside a fixed square. */
.art-tile .frame { position: absolute; inset: 12px; display: flex; align-items: center; justify-content: center; }
.art-tile .frame img { max-width: 100%; max-height: 100%; width: auto; height: auto; display: block; box-shadow: 0 6px 16px -6px rgba(0, 0, 0, 0.8); }
.art-tile .frame .gen { position: absolute; inset: 0; border-radius: 2px; }
.art-tile .mat .wait { font: 500 10px var(--mono); letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
.art-tile:hover .mat { outline-color: var(--line-strong); }
.art-tile.on .mat { outline: 2px solid var(--accent); }
.art-tile .t { display: block; margin-top: 9px; font: italic 400 17px/1.15 var(--serif); color: var(--ink); }
.art-tile .m { display: block; margin-top: 3px; font: 500 10px/1.35 var(--mono); letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
.art-note { color: var(--muted); font-size: 12.5px; margin: 16px 0 0; max-width: 680px; }

/* ==========================================================================
   The sleep screen. Sized in em so the settings preview can draw the same
   thing at 1280x720 and scale it down.
   ========================================================================== */
.sleep { position: fixed; inset: 0; z-index: 100; background: #050506; opacity: 0; transition: opacity 0.7s ease; cursor: none; }
.sleep.show { opacity: 1; }
.sleep .sleep-canvas { position: absolute; inset: 0; font-size: clamp(11px, 1.04vw, 26px); }
.sleep-canvas { overflow: hidden; color: #f4f6fa; font-family: var(--sans); line-height: 1.4; background: #050506; -webkit-font-smoothing: antialiased; }

.sc-arts, .sc-art, .sc-shade { position: absolute; inset: 0; }
.sc-art { transition: opacity 1.6s ease; overflow: hidden; }
.sc-art img { position: absolute; display: block; }
.sc-art img.back { inset: -6%; width: 112%; height: 112%; object-fit: cover; filter: blur(46px) brightness(0.5) saturate(1.15); }
.sc-art img.front { left: 0; top: 0; }
.sc-art.bd-wall { background: radial-gradient(90% 80% at 50% 45%, #22211e 0%, #121210 70%, #0a0a09 100%); }
.sc-art.bd-wall img.front { box-shadow: 0 2.4em 5em -1.6em rgba(0, 0, 0, 0.85), 0 0 0 1px rgba(255, 255, 255, 0.04); }
.sc-art.bd-black { background: #000; }
.sc-art.drift img.front { animation: sc-drift 120s ease-in-out infinite alternate; }
@keyframes sc-drift { from { transform: translate(-0.35%, -0.25%); } to { transform: translate(0.35%, 0.25%); } }
.sc-shade {
  background:
    linear-gradient(90deg, rgb(0 0 0 / calc(var(--dim, .35) * 1.2)) 0%, rgb(0 0 0 / calc(var(--dim, .35) * .25)) 48%, rgb(0 0 0 / calc(var(--dim, .35) * 1.1)) 100%),
    linear-gradient(0deg, rgb(0 0 0 / calc(var(--dim, .35) * 1.1)) 0%, transparent 50%);
}
.sc-midnight { background: radial-gradient(120% 95% at 75% 10%, #26303f 0%, #12161d 45%, #070809 100%); }
.sc-black { background: #000; }
.art-missing { position: absolute; left: 50%; top: 45%; transform: translate(-50%, -50%); font: 500 .75em var(--mono); letter-spacing: .1em; text-transform: uppercase; opacity: .55; }

.sc-layer { position: absolute; inset: 0; padding: 4em 4.4em; display: grid; gap: 3em; grid-template-columns: minmax(0, 1fr) minmax(0, 27em); transition: transform 3s ease; }
.sc-zone { display: flex; flex-direction: column; justify-content: flex-end; gap: 1.1em; min-width: 0; min-height: 0; overflow: hidden; }
.sc-left { align-items: flex-start; }
.sc-left .sw:not(.bare) { width: 27em; max-width: 100%; }
.sw {
  background: rgb(14 14 13 / .52); border: 1px solid rgb(255 255 255 / .09); border-radius: .75em; padding: 1em 1.2em;
  backdrop-filter: blur(20px) saturate(1.2); -webkit-backdrop-filter: blur(20px) saturate(1.2); flex: none;
}
.sw.bare { background: none; border: 0; backdrop-filter: none; -webkit-backdrop-filter: none; padding: 0; text-shadow: 0 .06em 1.4em rgb(0 0 0 / .65); }
.sw-h { display: flex; align-items: center; gap: .6em; font: 500 .66em/1 var(--mono); letter-spacing: .16em; text-transform: uppercase; opacity: .62; margin-bottom: .95em; }
.sw-h .r { margin-left: auto; letter-spacing: .08em; }
.sw-clock .t { font: 400 9.4em/.82 var(--serif); letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
.sw-clock .t .sec { font-size: .4em; opacity: .6; margin-left: .05em; }
.sw-clock .ampm { font: 500 .12em var(--mono); letter-spacing: .14em; margin-left: .7em; opacity: .75; vertical-align: .6em; }
.sw-clock .d { font: 500 .78em/1 var(--mono); letter-spacing: .2em; text-transform: uppercase; margin-top: 1.4em; opacity: .85; }
.sw-greet .g { font: italic 400 2.2em/1.1 var(--serif); }
.sw-greet .q { font-size: 1em; opacity: .8; margin-top: .35em; max-width: 34em; }
.sw-greet .q b { font-weight: 600; }
.sw-caption { border-left: 1px solid rgb(255 255 255 / .35); padding-left: .9em; }
.sw-caption .t { font: italic 400 1.25em/1.2 var(--serif); }
.sw-caption .m { font: 500 .62em/1.5 var(--mono); letter-spacing: .12em; text-transform: uppercase; opacity: .7; margin-top: .35em; }
.sw-stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); }
.sw-stats > div + div { border-left: 1px solid rgb(255 255 255 / .12); padding-left: .9em; }
.sw-stats .big { font: 400 2.3em/1 var(--serif); }
.sw-stats .lbl { font: 500 .6em/1.3 var(--mono); letter-spacing: .12em; text-transform: uppercase; opacity: .6; margin-top: .5em; }
.sw-next .what { font: 400 1.55em/1.15 var(--serif); display: flex; align-items: baseline; gap: .45em; }
.sw-next .what i { width: .34em; height: .34em; border-radius: 50%; background: var(--c, #8fb4ff); flex: none; transform: translateY(-.2em); }
.sw-next .when { opacity: .72; font-size: .88em; margin-top: .35em; }
.sw-rows { display: flex; flex-direction: column; gap: .55em; }
.sw-row { display: grid; grid-template-columns: 4.9em .16em minmax(0, 1fr); gap: .75em; align-items: center; }
.sw-row .tm { font: 400 .78em/1.25 var(--mono); opacity: .75; font-variant-numeric: tabular-nums; }
.sw-row .bar { align-self: stretch; border-radius: .1em; background: var(--c, #8fb4ff); }
.sw-row .tt { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sw-row .tt small { font-weight: 400; opacity: .6; margin-left: .45em; font-size: .85em; }
.sw-row.late .tm { color: #f0a497; opacity: 1; }
.sw-quiet { opacity: .68; font-size: .92em; }
.sw-block { display: flex; gap: .55em; align-items: center; margin-bottom: .75em; padding: .5em .7em; border-radius: .45em; background: rgb(225 110 95 / .18); color: #f7d4cd; font-size: .88em; }
.sw-block svg { width: 1.1em; height: 1.1em; }
.sw-news ol { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: .7em; }
.sw-news li { display: grid; grid-template-columns: 1.6em minmax(0, 1fr); gap: .5em; }
.sw-news .n { font: 400 1.35em/1 var(--serif); opacity: .5; font-variant-numeric: tabular-nums; }
.sw-news li:first-child .n { opacity: 1; }
.sw-news .hl { font-weight: 500; font-size: .95em; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.sw-news .o { font: 500 .6em/1.4 var(--mono); letter-spacing: .1em; text-transform: uppercase; opacity: .55; margin-top: .3em; }
.sw-passes { display: flex; align-items: center; gap: .8em; }
.sw-passes .dots { display: flex; gap: .35em; margin-left: auto; }
.sw-passes .dots i { width: .5em; height: .5em; border-radius: 50%; background: #f4f6fa; }
.sw-passes .dots i.used { background: rgb(255 255 255 / .22); }

.sleep-hint {
  position: absolute; left: 50%; top: 1.8em; transform: translateX(-50%); padding: .55em 1.1em; border-radius: 99px;
  background: rgb(0 0 0 / .5); font: 500 .66em var(--mono); letter-spacing: .14em; text-transform: uppercase;
  opacity: 0; transition: opacity .6s; pointer-events: none; white-space: nowrap;
}
.sleep.hint .sleep-hint { opacity: .85; }
.night-layer { position: absolute; inset: 0; z-index: 5; background: #000; opacity: 0; pointer-events: none; transition: opacity 1.4s ease; display: grid; place-items: center; }
.sleep.night .night-layer { opacity: 1; }
.night-time { font: 400 clamp(56px, 10vw, 200px)/1 var(--serif); color: #8c8374; opacity: .62; letter-spacing: -.02em; font-variant-numeric: tabular-nums; transition: transform 3s ease; white-space: nowrap; }
.night-time .ampm { font: 500 .13em/1 var(--mono); letter-spacing: .16em; margin-left: .7em; vertical-align: .9em; }
/* Any other clock in night mode: smaller units, no date, warm and dim like the plain one. */

.sleep.night .sleep-hint { z-index: 6; background: rgb(255 255 255 / .06); color: #8c8374; }

@media (max-aspect-ratio: 1/1) {
  .sleep .sleep-canvas { font-size: clamp(10px, 3.2vw, 22px); }
  .sleep .sc-layer { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); padding: calc(2.4em + env(safe-area-inset-top)) 1.6em calc(2em + env(safe-area-inset-bottom)); gap: 1.5em; }
  .sleep .sc-left { justify-content: flex-start; }

/* ==========================================================================
   Markets, reading links, email suggestions
   ========================================================================== */
.markets { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); margin: 0 0 28px; overflow: hidden; }

.mk:first-child { border-left: 0; }
.mk .nm { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mk .px { font: 400 28px/1 var(--serif); margin: 8px 0 5px; }
.mk .chg { font: 500 11.5px var(--mono); }
.gain { color: var(--good); }
.loss { color: var(--bad); }
.mk svg { width: 100%; height: 26px; display: block; margin-top: 8px; }
.markets-note { color: var(--faint); font-size: 12px; margin: -20px 0 26px; }

.readin { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }

.readin a small { font: 500 10px var(--mono); letter-spacing: 0.08em; color: var(--muted); }
.papers { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px 40px; margin-top: 8px; }
.paper h3 { margin: 0 0 4px; font: italic 400 22px/1.2 var(--serif); }

.suggest { display: grid; grid-template-columns: 24px minmax(0, 1fr); gap: 4px 12px; padding: 13px 0; border-bottom: 1px solid var(--line); }
.suggest .ico { color: var(--muted); padding-top: 2px; }
.suggest .ico svg { width: 16px; height: 16px; }
.suggest .what { font-weight: 550; overflow-wrap: anywhere; }
.suggest .sub { color: var(--muted); font-size: 12.5px; margin-top: 3px; display: flex; gap: 10px; flex-wrap: wrap; }
.suggest .sub a { color: var(--muted); }
.suggest .acts { grid-column: 2; display: flex; gap: 4px; margin-top: 6px; }

/* Sleep widgets: worth knowing, markets */
.sw-brief .bk { display: grid; grid-template-columns: 6.4em minmax(0, 1fr); gap: .7em; padding: .32em 0; align-items: baseline; }
.sw-brief .bk .k { font: 500 .62em/1.9 var(--mono); letter-spacing: .12em; text-transform: uppercase; opacity: .62; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sw-brief .bk .v { font-weight: 500; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.sw-brief .bk.hot .k { color: #f0a497; opacity: 1; }
.mkr { display: grid; grid-template-columns: 4.2em minmax(0, 1fr) auto; gap: .6em; padding: .26em 0; align-items: baseline; }
.mkr .s { font: 500 .72em var(--mono); letter-spacing: .1em; opacity: .72; }
.mkr .p { font: 400 1.25em/1 var(--serif); }
.mkr .c { font: 500 .78em var(--mono); }
.sleep-canvas .gain, .brief .gain { color: #92d3a2; }
.sleep-canvas .loss, .brief .loss { color: #f2a497; }

/* ==========================================================================
   Morning briefing
   ========================================================================== */
.brief { position: fixed; inset: 0; z-index: 110; background: #050506; color: #f4f6fa; opacity: 0; transition: opacity .9s ease; font-size: clamp(11px, 1.04vw, 26px); font-family: var(--sans); overflow: hidden; }
.brief.show { opacity: 1; }
.brief .sleep-canvas { position: absolute; inset: 0; font-size: inherit; }
.brief .sleep-hint { display: none; }
.brief-top { position: absolute; left: 4.4em; right: 4.4em; top: 2.4em; display: flex; align-items: center; gap: 1.4em; z-index: 3; }
.brief-top .label { font: 500 .66em/1 var(--mono); letter-spacing: .18em; text-transform: uppercase; opacity: .75; white-space: nowrap; }
.brief-bars { flex: 1; display: flex; gap: .35em; }
.brief-bars i { flex: 1; height: 2px; background: rgb(255 255 255 / .2); border-radius: 2px; overflow: hidden; position: relative; }
.brief-bars i b { position: absolute; inset: 0; background: #f4f6fa; transform-origin: left; transform: scaleX(0); }

.brief-bars i.now b { animation: brief-fill var(--dur, 12s) linear forwards; }

@keyframes brief-fill { to { transform: scaleX(1); } }
.brief-btn { background: rgb(255 255 255 / .08); border: 1px solid rgb(255 255 255 / .18); color: inherit; border-radius: 99px; padding: .5em 1.05em; font: 500 .66em/1 var(--mono); letter-spacing: .12em; text-transform: uppercase; cursor: pointer; white-space: nowrap; }
.brief-btn:hover { background: rgb(255 255 255 / .16); }
.brief-slide { position: absolute; inset: 0; z-index: 2; padding: 7em 4.4em 5.2em; display: flex; flex-direction: column; justify-content: flex-end; opacity: 0; transform: translateY(.8em); transition: opacity .8s ease, transform .8s ease; pointer-events: none; }
.brief-slide.on { opacity: 1; transform: none; pointer-events: auto; }
.brief-slide .kicker { font: 500 .7em/1 var(--mono); letter-spacing: .18em; text-transform: uppercase; opacity: .75; margin-bottom: 1.3em; display: flex; gap: 1em; align-items: center; }
.brief-slide h1 { font: 400 5.6em/1 var(--serif); margin: 0 0 .28em; letter-spacing: -.02em; max-width: 15em; }
.brief-slide h2.bh { font: 400 3.7em/1.06 var(--serif); margin: 0 0 .4em; max-width: 17em; letter-spacing: -.015em; text-shadow: 0 .05em 1em rgb(0 0 0 / .5); }
.brief-slide .lede { font-size: 1.4em; opacity: .88; max-width: 36em; margin: 0; line-height: 1.45; }
.brief-meta { display: flex; gap: 1.4em; flex-wrap: wrap; font: 500 .7em var(--mono); letter-spacing: .12em; text-transform: uppercase; opacity: .7; }
.brief-major { background: #c8412f; color: #fff; padding: .45em .7em; border-radius: .25em; opacity: 1; letter-spacing: .14em; }
.brief-links { display: flex; gap: .8em; margin-top: 1.9em; flex-wrap: wrap; }
.brief-links a { color: #050506; background: #f4f6fa; text-decoration: none; padding: .75em 1.25em; border-radius: .35em; font-weight: 600; font-size: .95em; display: inline-flex; gap: .7em; align-items: baseline; }
.brief-links a small { font: 500 .68em var(--mono); letter-spacing: .1em; opacity: .55; }
.brief-links a.ghost { background: rgb(255 255 255 / .08); color: #f4f6fa; border: 1px solid rgb(255 255 255 / .22); }
.brief-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(13em, 1fr)); gap: 1.6em 2.4em; margin-top: 1.4em; max-width: 70em; }
.tick { border-top: 1px solid rgb(255 255 255 / .28); padding-top: 1em; min-width: 0; }
.tick .sym { font: 500 .72em var(--mono); letter-spacing: .16em; opacity: .7; }
.tick .nm { font-size: .95em; opacity: .75; margin-top: .2em; }
.tick .px { font: 400 3.1em/1 var(--serif); margin: .3em 0 .15em; }
.tick .chg { font: 500 .95em var(--mono); }
.tick svg { width: 100%; height: 3.2em; display: block; margin-top: .8em; }
.brief-list { margin-top: 1.2em; max-width: 48em; }
.brief-list .r { display: grid; grid-template-columns: 7.5em minmax(0, 1fr); gap: 1em; padding: .75em 0; border-top: 1px solid rgb(255 255 255 / .16); font-size: 1.2em; }
.brief-list .r .t { font: 400 .75em/1.7 var(--mono); opacity: .75; }
.brief-list .r.late .t { color: #f2a497; opacity: 1; }
.brief-nav { position: absolute; right: 4.4em; bottom: 2.2em; display: flex; gap: .6em; z-index: 3; }
@media (max-aspect-ratio: 1/1) {
  .brief { font-size: clamp(10px, 3vw, 20px); }
  .brief-top { left: 1.6em; right: 1.6em; top: calc(1.6em + env(safe-area-inset-top)); }
  .brief-slide { padding: 6em 1.6em 5em; }
  .brief-slide h1 { font-size: 3.6em; }
  .brief-slide h2.bh { font-size: 2.5em; }
  .brief-nav { right: 1.6em; }
}

/* ==========================================================================
   Source clippings. Each publication keeps its own look - masthead, type,
   colour - inside a card, so you can tell at a glance where a headline is
   from. They sit on Mellow's pages; they never restyle them.
   ========================================================================== */
.clip {
  position: relative; background: #fff; color: #121212; width: 34em; max-width: 100%; padding: 1.3em 1.5em 1.4em;
  box-shadow: 0 1.8em 3.6em -1.2em rgb(0 0 0 / .75), 0 0 0 1px rgb(0 0 0 / .06); text-align: left; overflow: hidden;
}
.clip .mast { display: flex; align-items: center; justify-content: space-between; gap: 1em; padding-bottom: .6em; margin-bottom: .95em; border-bottom: 1px solid #121212; }
.clip .mast small { font: 500 .56em/1 var(--mono); letter-spacing: .1em; text-transform: uppercase; opacity: .55; white-space: nowrap; }
.clip .pic { display: block; width: 100%; aspect-ratio: 16 / 9; object-fit: cover; margin: 0 0 .95em; background: #e8e6e1; }
.clip .hd { margin: 0; font-size: 1.75em; line-height: 1.14; color: inherit; }
.clip .dk { margin: .55em 0 0; font-size: .95em; line-height: 1.45; opacity: .78; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.mk-name { font-weight: 700; white-space: nowrap; }
.mk-boxes { display: inline-flex; gap: .12em; }
.mk-boxes i { font-style: normal; display: inline-grid; place-items: center; width: 1.3em; height: 1.3em; font: 700 .85em/1 Arial, Helvetica, sans-serif; }
.clip .mk-name { font-size: 1.15em; }

.s-nyt, .s-nyt .hd { font-family: 'Libre Caslon Text', Georgia, serif; }
.s-nyt .mast { border-bottom: 3px double #121212; flex-direction: column; gap: .45em; }

.s-nyt .mk-name { font: 400 1.65em/1 'UnifrakturMaguntia', 'Old English Text MT', serif; }
.s-nyt .hd { font-weight: 700; letter-spacing: -.01em; }
.s-nyt .dk { font-family: Georgia, serif; }

.clip.s-wsj { background: #fcfbf7; }
.s-wsj .mast { border-bottom: 4px double #121212; flex-direction: column; gap: .45em; }

.s-wsj .mk-name { font: 700 1.05em/1 'Libre Baskerville', Georgia, serif; letter-spacing: .03em; text-transform: uppercase; }
.s-wsj .hd { font: 700 1.62em/1.18 'Libre Baskerville', Georgia, serif; }
.s-wsj .dk { font-family: Georgia, serif; }

.s-wapo .mast { flex-direction: column; gap: .45em; }

.s-wapo .mk-name { font: 400 1.55em/1 'UnifrakturMaguntia', serif; }
.s-wapo .hd { font: 700 1.85em/1.1 'Bodoni Moda', Georgia, serif; }

.clip.s-bbc { padding-top: 0; }
.s-bbc .mast { margin: 0 -1.5em .95em; padding: .75em 1.5em; background: #b80000; color: #fff; border: 0; }
.s-bbc .mk-boxes i { background: #fff; color: #000; }
.wm.s-bbc .mk-boxes i { background: #000; color: #fff; }
.s-bbc .mk-name, .s-bbc .hd { font-family: Arial, Helvetica, sans-serif; }
.s-bbc .hd { font-weight: 700; }

.s-cnn .mast { border-bottom: 3px solid #cc0000; }
.s-cnn .mk-name { background: #cc0000; color: #fff; font: 700 1em/1 Arial, Helvetica, sans-serif; padding: .28em .4em; letter-spacing: -.03em; }
.s-cnn .hd { font: 700 1.62em/1.16 Arial, Helvetica, sans-serif; }

.s-reuters .mast { border-bottom: 3px solid #fa6400; }
.s-reuters .mk-name { font: 700 1em/1 'Libre Franklin', Arial, sans-serif; color: #404040; }
.s-reuters .mk-name::before { content: ""; display: inline-block; width: .6em; height: .6em; border-radius: 50%; background: #fa6400; margin-right: .35em; vertical-align: .05em; }
.s-reuters .hd { font: 700 1.62em/1.16 'Libre Franklin', Arial, sans-serif; }

.s-ap .mk-name { font: 800 1.35em/1 'Libre Franklin', Arial, sans-serif; letter-spacing: -.05em; }
.s-ap .mk-name::after { content: " News"; font-weight: 500; letter-spacing: 0; font-size: .6em; }
.s-ap .hd { font: 700 1.62em/1.16 'Libre Franklin', Arial, sans-serif; }

.clip.s-bloomberg { background: #000; color: #fff; }
.s-bloomberg .mast { border-bottom-color: #fff; }
.s-bloomberg .mk-name { font: 800 1.15em/1 'Libre Franklin', Arial, sans-serif; letter-spacing: -.04em; }
.s-bloomberg .hd { font: 700 1.62em/1.16 'Libre Franklin', Arial, sans-serif; }

.s-axios .mast { border-bottom: 3px solid #000; }
.s-axios .mk-name { font: 800 1em/1 'Libre Franklin', Arial, sans-serif; letter-spacing: .12em; text-transform: uppercase; }
.s-axios .hd { font: 800 1.6em/1.16 'Libre Franklin', Arial, sans-serif; }

.clip.s-guardian { padding-top: 0; }
.s-guardian .mast { margin: 0 -1.5em .95em; padding: .9em 1.5em .6em; background: #052962; color: #fff; border: 0; }
.s-guardian .mk-name { font: 700 1.4em/1 Georgia, serif; letter-spacing: -.02em; }
.s-guardian .hd { font: 500 1.7em/1.14 Georgia, serif; color: #052962; }
.wm.s-guardian .mk-name { color: #052962; }

.s-npr .mk-boxes i:nth-child(1) { background: #d62021; color: #fff; }
.s-npr .mk-boxes i:nth-child(2) { background: #000; color: #fff; }
.s-npr .mk-boxes i:nth-child(3) { background: #237bbd; color: #fff; }
.s-npr .hd { font: 700 1.62em/1.16 'Libre Franklin', Arial, sans-serif; }

.clip.s-ft { background: #fff1e5; }
.s-ft .mk-name { font: 700 .95em/1 Georgia, serif; letter-spacing: .16em; text-transform: uppercase; }
.s-ft .hd { font: 600 1.7em/1.12 Georgia, serif; }

.s-economist .mk-name { background: #e3120b; color: #fff; font: 700 .9em/1 Georgia, serif; padding: .35em .5em; }
.s-economist .hd { font: 700 1.7em/1.12 Georgia, serif; }

.s-politico .mast { border-bottom: 3px solid #d71920; }
.s-politico .mk-name { font: 800 1.05em/1 'Libre Franklin', Arial, sans-serif; letter-spacing: .06em; text-transform: uppercase; }
.s-politico .hd { font: 700 1.62em/1.16 'Libre Franklin', Arial, sans-serif; }

.s-generic .mk-name { font: 600 .9em/1 var(--sans); letter-spacing: .1em; text-transform: uppercase; }
.s-generic .hd { font: 600 1.6em/1.18 var(--sans); }

/* The same marks, small, beside an outlet's name in a list. */
.wm { display: inline-flex; align-items: center; font-size: 13px; color: var(--ink); line-height: 1; vertical-align: middle; }
.wm .mk-name { font-size: 1em; }
.wm.s-nyt .mk-name, .wm.s-wapo .mk-name { font-size: 1.3em; }
.wm.s-wsj .mk-name { font-size: .78em; }
.wm.s-bloomberg .mk-name { background: #000; color: #fff; padding: .2em .35em; }
.wm.s-generic .mk-name { font-size: .8em; color: var(--ink-2); }
.wm.s-guardian .mk-name { font-size: 1.05em; color: #7fb2ff; }
.wm.s-reuters .mk-name { color: var(--ink); }
.wm.s-bbc .mk-boxes i { background: #fff; color: #000; }
.wm.s-bloomberg .mk-name { background: #fff; color: #000; }
.wm.s-npr .mk-boxes i:nth-child(2) { background: #fff; color: #000; }

/* In the briefing, the clippings are the story. */
.clips { display: flex; gap: 2.4em; align-items: flex-start; flex-wrap: wrap; margin: .2em 0 1.8em; }
.clips .clip { width: 31em; }
.clips .clip:only-child { width: 40em; }
.clips .clip:only-child .hd { font-size: 2.1em; }
.clips .clip:nth-child(1) { transform: rotate(-.7deg); }
.clips .clip:nth-child(2) { transform: rotate(.6deg); margin-top: 1.6em; }
.brief-slide.story-slide { justify-content: center; }

/* The Times and the Journal on the News page, each in its own dress. */
.paper.clip { width: auto; box-shadow: none; border: 1px solid var(--line); padding: 16px 18px 6px; font-size: 14px; }
.paper.clip .mast { margin-bottom: 4px; }
.paper.clip a { color: inherit; border-bottom-color: rgb(0 0 0 / .1); font-size: 15px; line-height: 1.35; }
.s-nyt.paper a { font-family: Georgia, serif; }
.s-wsj.paper a { font-family: 'Libre Baskerville', Georgia, serif; font-size: 14px; }
.mk.branded { border-top: 3px solid var(--brand); }
.tick.branded { border-top: 3px solid var(--brand); }

/* Filling the screen: the painting cropped around its subject, or cropped a
   little and its edges carried out to the sides. */
.sc-art.fit-fill img.front { inset: 0; width: 100%; height: 100%; object-fit: cover; }
.sc-art.fit-fill.drift img.front { animation: none; }

/* Clock styles */
.sw-clock .t .h, .sw-clock .t .m { display: inline; }
.sw-clock.c-grotesk .t { font: 200 9.6em/.84 var(--sans); letter-spacing: -.055em; }
.sw-clock.c-grotesk .ampm { font-size: .11em; }
.sw-clock.c-mono .t { font: 300 6.6em/.9 var(--mono); letter-spacing: -.05em; }
.sw-clock.c-mono .ampm { font-size: .15em; vertical-align: .9em; }
.sw-clock.c-stack .t { font: 400 8.2em/.78 var(--serif); letter-spacing: -.02em; }
.sw-clock.c-stack .t .h, .sw-clock.c-stack .t .m { display: block; }
.sw-clock.c-stack .t .m { opacity: .55; }
.sw-clock.c-stack .ampm, .sw-clock.c-stack .colon { display: none; }
.sw-clock.c-minimal .t { font: 400 3.4em/1 var(--serif); }
.sw-clock.c-minimal .ampm { font-size: .3em; vertical-align: .35em; }
.sw-clock.c-minimal .d { margin-top: .7em; }
.sw-clock.c-analog .face { width: 12.5em; height: 12.5em; display: block; }
.sw-clock.c-analog .face * { vector-effect: non-scaling-stroke; }
.sw-clock.c-analog .d { margin-top: 1.1em; }
.sw-clock.c-dali .face-dali { width: 19em; height: 16.5em; display: block; margin-left: -1em; filter: drop-shadow(0 .5em 1em rgb(0 0 0 / .55)); }
.sw-clock.c-dali .d { margin-top: .4em; }

/* Flip clock */
.flip { display: flex; align-items: flex-end; gap: .35em; }
.fcard { position: relative; display: inline-grid; place-items: center; min-width: 1.45em; padding: .06em .12em; font: 500 5.2em/1 var(--sans); letter-spacing: -.03em; font-variant-numeric: tabular-nums; color: #f4f1ea;
  background: linear-gradient(180deg, #2a2b2f 0%, #1c1d20 49.6%, #121315 50.4%, #1a1b1e 100%); border-radius: .12em; box-shadow: 0 .12em .3em rgb(0 0 0 / .55), inset 0 1px 0 rgb(255 255 255 / .08); text-shadow: none; }
.fcard i { position: absolute; left: 0; right: 0; top: 50%; height: .03em; background: rgb(0 0 0 / .75); box-shadow: 0 1px 0 rgb(255 255 255 / .05); }
.fcard i::before, .fcard i::after { content: ""; position: absolute; top: -.05em; width: .06em; height: .13em; background: #0a0a0b; border-radius: .02em; }
.fcard i::before { left: -.02em; } .fcard i::after { right: -.02em; }
.fcard.sm { font-size: 2.6em; }
.fam { font: 500 .8em var(--mono); letter-spacing: .14em; opacity: .8; margin: 0 0 .4em .2em; }
.sw-clock.c-flip .d { margin-top: 1em; }

/* Word clock */
.words { display: inline-block; padding: 1.1em 1.3em .8em; border-radius: .6em; background: rgb(8 9 12 / .55); border: 1px solid rgb(255 255 255 / .08); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
.wgrid { display: grid; grid-template-columns: repeat(11, 1.45em); grid-auto-rows: 1.55em; font: 600 1.25em/1.55em var(--mono); text-align: center; text-shadow: none; }
.wgrid span { color: rgb(255 255 255 / .13); transition: color .8s, text-shadow .8s; }
.wgrid span.on { color: #fff; text-shadow: 0 0 .5em rgb(140 185 255 / .9); }
.wdots { display: flex; justify-content: center; gap: .6em; margin-top: .5em; }
.wdots i { width: .32em; height: .32em; border-radius: 50%; background: rgb(255 255 255 / .15); }
.wdots i.on { background: #fff; box-shadow: 0 0 .5em rgb(140 185 255 / .9); }

/* Nixie tubes */
.nixie { display: flex; align-items: center; gap: .28em; }
.tube { position: relative; display: grid; place-items: center; width: 1.25em; height: 1.9em; font: 300 3.6em/1 var(--sans); border-radius: .6em .6em .22em .22em;
  background: radial-gradient(80% 60% at 50% 45%, rgb(255 120 40 / .16), transparent 70%), linear-gradient(90deg, rgb(255 255 255 / .05), rgb(255 255 255 / .14) 30%, rgb(255 255 255 / .03) 70%, rgb(255 255 255 / .09));
  border: 1px solid rgb(255 255 255 / .16); box-shadow: inset 0 -.15em .3em rgb(0 0 0 / .5); text-shadow: none; }
.tube .ghost { position: absolute; color: rgb(255 170 110 / .08); }
.tube b { position: relative; font-weight: 300; color: #ffb36b; text-shadow: 0 0 .08em #fff1d9, 0 0 .2em #ff8a2a, 0 0 .55em #ff5a00; }
.ncol { display: flex; flex-direction: column; gap: .7em; }
.ncol i { width: .38em; height: .38em; border-radius: 50%; background: #ff9b4a; box-shadow: 0 0 .5em #ff6a00; }
.nam { font: 500 .8em var(--mono); letter-spacing: .14em; color: #ffb36b; margin-left: .4em; align-self: flex-end; }

/* Retro LCD */
.lcd { display: inline-flex; align-items: center; gap: .35em; padding: .55em .8em; border-radius: .45em; background: linear-gradient(180deg, #06101f, #030812); border: 1px solid rgb(91 155 255 / .25); box-shadow: inset 0 0 1.4em rgb(0 0 0 / .8), 0 0 2em rgb(47 107 255 / .15); }
.lcd-seg { width: 2.4em; height: 4.3em; display: block; }
.lcd-seg polygon { fill: rgb(120 170 255 / .07); }
.lcd-seg polygon.on { fill: #8cc0ff; filter: drop-shadow(0 0 .12em #4f8dff); }
.scol { display: flex; flex-direction: column; gap: 1.1em; margin: 0 .1em; }
.scol i { width: .42em; height: .42em; background: #8cc0ff; box-shadow: 0 0 .4em #4f8dff; transform: skewX(-8deg); }
.scol.dim i { opacity: .25; }
.ssec { display: inline-flex; gap: .2em; margin-left: .3em; align-self: flex-end; }
.ssec .lcd-seg { width: 1.2em; height: 2.15em; }
.lam { font: 600 .75em var(--mono); color: #8cc0ff; letter-spacing: .1em; align-self: flex-start; margin-left: .3em; }

/* Rings */
.rings { position: relative; width: 13em; height: 13em; }
.rings svg { width: 100%; height: 100%; display: block; filter: drop-shadow(0 0 .6em rgb(0 0 0 / .5)); }
.rings .rt { position: absolute; inset: 0; display: grid; place-items: center; align-content: center; font: 300 2.5em/1 var(--sans); letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
.rings .rt small { display: block; font: 500 .26em var(--mono); letter-spacing: .16em; opacity: .7; margin-top: .5em; text-align: center; }

/* Sun and moon */
.solar { width: 22em; max-width: 100%; }
.solar svg { width: 100%; display: block; overflow: visible; }
.solar .lbl { font: 500 5px var(--mono); fill: rgb(255 255 255 / .55); letter-spacing: .08em; }
.solar .st { font: 400 4.6em/1 var(--serif); letter-spacing: -.02em; margin-top: .15em; }
.solar .st small { font: 500 .17em var(--mono); letter-spacing: .14em; margin-left: .6em; opacity: .75; vertical-align: .9em; }

/* Bauhaus */
.bauhaus { width: 12.5em; height: 12.5em; display: block; filter: drop-shadow(0 .5em 1.2em rgb(0 0 0 / .5)); }

/* Binary */
.binary { display: inline-flex; align-items: flex-end; gap: 1.1em; }
.bgrp { position: relative; display: inline-flex; gap: .45em; padding-bottom: 1.4em; }
.bgrp em { position: absolute; bottom: 0; left: 0; right: 0; text-align: center; font: 500 .7em var(--mono); font-style: normal; letter-spacing: .2em; opacity: .55; }
.bcol { display: flex; flex-direction: column; gap: .45em; }
.bcol i { width: 1.1em; height: 1.1em; border-radius: 50%; border: 1px solid rgb(255 255 255 / .4); background: rgb(0 0 0 / .35); }
.bcol i.on { background: #5b9bff; border-color: #9cc3ff; box-shadow: 0 0 .7em #2f6bff; }
.bread { font: 500 .9em var(--mono); letter-spacing: .12em; opacity: .7; padding-bottom: 1.5em; }

/* Quiet widgets: no panels, a hairline and the text. Made to sit on screen all day. */
.sleep-canvas.quiet .sc-zone { gap: 1.7em; }
.sleep-canvas.quiet .sw:not(.bare) {
  background: none; border: 0; border-top: 1px solid rgb(255 255 255 / .2); border-radius: 0; padding: .85em 0 0;
  backdrop-filter: none; -webkit-backdrop-filter: none; text-shadow: 0 .06em 1.2em rgb(0 0 0 / .75);
}
.sleep-canvas.quiet .sw-h { opacity: .5; margin-bottom: .8em; }
.sleep-canvas.quiet .sw-block { background: none; padding: 0; }

/* Full screen means the app and nothing else, not even a scrollbar. */
html { scrollbar-width: thin; scrollbar-color: var(--line-strong) transparent; }
html.is-fs, html.is-fs body, html.sleeping, html.sleeping body { scrollbar-width: none; }
html.is-fs::-webkit-scrollbar, html.sleeping::-webkit-scrollbar { display: none; }
html.sleeping, html.sleeping body { overflow: hidden; }

/* ==========================================================================
   Today: one day at a time
   ========================================================================== */
.today-head { display: flex; align-items: flex-end; gap: 16px 32px; flex-wrap: wrap; margin: 0 0 26px; }
.today-head h1 { margin: 10px 0 8px; font: 400 56px/1 var(--serif); letter-spacing: -0.02em; }
.today-head .quip { margin: 0; color: var(--ink-2); font-size: 15px; }
.today-head .quip b { font-weight: 600; }
.glance { margin-left: auto; display: flex; gap: 28px; padding-bottom: 4px; }
.glance > div { text-align: right; }
.glance b { display: block; font: 400 30px/1 var(--serif); margin-bottom: 6px; }
.glance .hot b { color: var(--bad); }

.daybar { display: flex; align-items: stretch; gap: 8px; margin: 0 0 32px; }
.daybar .strip { flex: 1; margin: 0; }
.daybar .arrow { width: 38px; padding: 0; }
.daybar .arrow svg { width: 16px; height: 16px; }
.day-pill.is-today:not(.today) .dow { color: var(--ink); font-weight: 600; }
.day-pill.is-today:not(.today) .num { text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 5px; }

.today-grid { display: grid; grid-template-columns: minmax(0, 1.45fr) minmax(0, 1fr); gap: 44px; align-items: start; }
@media (max-width: 1180px) { .today-grid { grid-template-columns: minmax(0, 1fr); gap: 34px; } }
.col-head { display: flex; align-items: baseline; gap: 10px; padding-bottom: 10px; border-bottom: 1px solid var(--ink); }
.col-head h2 { margin: 0; font: 400 27px/1 var(--serif); letter-spacing: -0.01em; }
.col-head .eyebrow { margin-left: auto; }
.block + .block { margin-top: 34px; }

.tl { display: grid; grid-template-columns: 78px 10px minmax(0, 1fr) auto; gap: 12px; align-items: start; padding: 13px 0; border-bottom: 1px solid var(--line); }
.tl .when { font: 400 11.5px/1.45 var(--mono); color: var(--muted); }
.tl .when b { display: block; color: var(--ink); font-weight: 500; font-size: 12.5px; }
.tl .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--c, var(--accent)); margin-top: 6px; }
.tl .what { font-weight: 550; overflow-wrap: anywhere; }
.tl .where { color: var(--muted); font-size: 12.5px; margin-top: 3px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.tl.past { opacity: 0.42; }
.tl.current .when b { color: var(--bad); }
.now-line { display: flex; align-items: center; gap: 10px; padding: 7px 0; font: 500 10px/1 var(--mono); letter-spacing: 0.12em; text-transform: uppercase; color: var(--bad); }
.now-line::after { content: ""; flex: 1; height: 1px; background: currentColor; opacity: 0.45; }

.due { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--line); }
.due .what { font-weight: 550; overflow-wrap: anywhere; }
.due .sub { color: var(--muted); font-size: 12.5px; margin-top: 3px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.due.late .sub .when { color: var(--bad); }
.quiet-note { color: var(--faint); font-size: 13.5px; padding: 16px 0; border-bottom: 1px solid var(--line); }

.row-link { display: flex; justify-content: space-between; align-items: center; gap: 12px; width: 100%; padding: 12px 0; border: 0; border-bottom: 1px solid var(--line); background: none; color: inherit; text-align: left; cursor: pointer; font-size: 13.5px; }
.row-link:hover span:first-child { text-decoration: underline; text-decoration-color: var(--line-strong); text-underline-offset: 3px; }
.row-link b { font: 400 24px/1 var(--serif); }
.row-link.hot b { color: var(--bad); }

.wk { display: grid; grid-template-columns: 112px minmax(0, 1fr) auto; gap: 14px; align-items: baseline; width: 100%; padding: 12px 0; border: 0; border-bottom: 1px solid var(--line); background: none; color: inherit; text-align: left; cursor: pointer; font: inherit; }
