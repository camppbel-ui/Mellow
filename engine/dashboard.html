function storyHtml(s) {
  var meta = [];
  if (s.major) meta.push('<span class="tag solid" title="Leading both the Times and the Journal">Major story</span>');
  if (s.outlet) meta.push(wordmark(s.outlet));
  if (s.publishedAt) meta.push('<span>' + esc(ago(s.publishedAt)) + '</span>');
  if (s.outlets > 1) meta.push('<span class="pill" title="Outlets covering this story">' + outletCount(s) + ' outlets</span>');
  return '<div class="story enter' + (s.rank <= 3 ? ' top' : '') + (s.rank === 1 ? ' lead' : '') + '">' +
    '<div class="rank">' + s.rank + '</div>' +
    '<div style="min-width:0"><a class="headline" href="' + esc(safeUrl(s.link)) + '" target="_blank" rel="noopener">' + esc(s.title) + '</a>' +
      '<div class="meta">' + meta.join('') + '</div>' +
      (s.summary ? '<div class="sum">' + esc(s.summary) + '</div>' : '') +
      readInHtml(s) +
      (s.related && s.related.length ? '<div class="also">Also covering it: ' + s.related.map(function (r) {
        return '<a href="' + esc(safeUrl(r.link)) + '" target="_blank" rel="noopener" title="' + esc(r.title) + '">' + esc(r.outlet) + '</a>';
      }).join(', ') + '</div>' : '') +
    '</div></div>';
}

function viewNews() {
  var n = newsData, src = n && n.source;
  var html = pageHead(src ? esc(src.name) : 'Today', 'News',
    src ? 'The biggest stories right now, in the order ' + esc(src.name.split(' · ')[0]) + ' ranks them.' : 'The biggest stories right now.');

  var sources = (n && n.sources) || [];
  html += '<div class="news-bar enter">' +
    (sources.length > 1 ? '<div class="filters">' + sources.map(function (s) {
      return '<button class="' + (src && src.id === s.id ? 'on' : '') + '" data-news-source="' + esc(s.id) + '">' + esc(s.label || s.name) + '</button>';
    }).join('') + '</div>' : '') +
    '<div class="right">' + (n && n.fetchedAt ? '<span class="eyebrow">Updated ' + esc(ago(n.fetchedAt)) + '</span>' : '') +
      '<button class="btn sm" data-news-refresh="1"' + (newsLoading ? ' disabled' : '') + '>' + I.sync + ' ' + (newsLoading ? 'Loading…' : 'Refresh') + '</button>' +
      '<button class="btn primary sm" data-briefing="1" title="B">Play the briefing</button></div>' +
  '</div>';

  html += subsHtml(n);
  html += marketsHtml();

  if (!n) return html + emptyHtml(I.news, 'Fetching today\'s ranking');

  if (n.error) {
    html += '<div class="alert warn enter" style="margin:0 0 18px">' + I.alert + '<div class="txt"><b>' +
      (n.stories.length ? 'Showing the last ranking.' : 'No news right now.') + '</b> ' +
      esc(n.stories.length ? 'Couldn\'t refresh it: ' + n.error : n.error) + '</div></div>';
  }
  if (!n.stories.length) return html + (n.error ? '' : emptyHtml(I.news, 'Nothing in the feed yet', 'Try Refresh in a minute.'));

  html += orgRender(orgKey(), newsOrgItems(), 'stories') || '<div class="stories">' + n.stories.map(storyHtml).join('') + '</div>';
  var papers = (n.papers || []).filter(function (p) { return p.top && p.top.length; });
  if (papers.length) {
    html += '<div class="section-head"><h2>' + (papers.some(function (p) { return p.subscribed; }) ? 'Your papers' : 'The Times and the Journal') + '</h2><span class="sub">The top of each paper right now</span></div><div class="papers enter">' +
      papers.map(function (p) {
        var st = outletStyle(p.name);
        return '<div class="paper clip s-' + st.id + '"><div class="mast">' + mastInner(st) + '</div>' + p.top.map(function (t) {
          return '<a href="' + esc(safeUrl(t.link)) + '" target="_blank" rel="noopener">' + esc(t.title.length > 140 ? t.title.slice(0, 137) + '…' : t.title) + '</a>';
        }).join('') + '</div>';
      }).join('') + '</div>';
  }
  if (src) {
    html += '<p class="news-note">' + esc(src.ranking) +
      (src.home ? ' <a href="' + esc(safeUrl(src.home)) + '" target="_blank" rel="noopener">Open ' + esc(src.name.split(' · ')[0]) + '</a>' : '') + '</p>';
  }
  return html;
}

/** Which tab a kind of item is added and changed on. */
function finTabFor(kind, card) {
  if (kind === 'accounts') return card ? 'cards' : 'accounts';
  return { cards: 'cards', bills: 'bills', transactions: 'spending', budgets: 'spending', goals: 'goals', holdings: 'investing', subscriptions: 'subscriptions' }[kind] || 'overview';
}

function setFinTab(t) {
  if (!FIN_TABS.some(function (x) { return x[0] === t; })) t = 'overview';
  finTab = t;
  try { localStorage.setItem('mellow-fin-tab', t); } catch (e) {}
}

function refreshFinance() {
  if (location.protocol === 'file:') return Promise.resolve();
  finAt = Date.now();
  return getJson('/api/finance')
    .then(function (d) {
      finData = d && d.summary ? d : { error: 'The engine is still running the old version. Restart it to switch Finance on.' };
    })
    .catch(function () { if (!finData) finData = { error: 'Couldn\'t reach the engine for your finances.' }; })
    .then(function () { if (tab === 'finance' || tab === 'today') render(); });
}

function refreshFinBrief(force) {
  if (location.protocol === 'file:') return Promise.resolve();
  finBriefLoading = true;
  finBriefAt = Date.now();
  if (tab === 'finance' && force) render();
  return getJson('/api/finance/brief' + (force ? '?refresh=1' : ''))
    .then(function (b) { if (b && Array.isArray(b.indices)) finBrief = b; })
    .catch(function () {})
    .then(function () {
      finBriefLoading = false;
      if (tab === 'finance') render();
    });
}

/* ------------------------------ price history ------------------------------ */
var FIN_RANGES = [['1d', '1D'], ['1mo', '1M'], ['3mo', '3M'], ['1y', '1Y']];
var finRange = '1mo';
var finHist = {};        // range -> { SYMBOL: [[ms, close], …] }
var finHistState = {};   // range -> 'loading' | 'done' | 'failed'
try { finRange = localStorage.getItem('ratchet.finRange') || finRange; } catch (_) {}

function loadFinHistory(range) {
  if (range === '1d' || location.protocol === 'file:' || !finData || !finData.summary) return;
  var syms = (finData.summary.holdings || []).map(function (h) { return h.symbol; });
  var key = range + '|' + syms.join(',');
  if (!syms.length || finHistState[range] === 'loading' || finHistState[range + ':key'] === key) return;
  finHistState[range] = 'loading';
  finHistState[range + ':key'] = key;
  getJson('/api/stocks/history?range=' + range + '&symbols=' + encodeURIComponent(syms.join(',')))
    .then(function (d) {
      var out = {};
      Object.keys((d && d.history) || {}).forEach(function (s) { out[s] = d.history[s].points || []; });
      // An engine without the history route answers with nothing useful.
      if (!Object.keys(out).some(function (s) { return out[s].length > 1; })) throw new Error('no history');
      finHist[range] = out;
      finHistState[range] = 'done';
    })
    .catch(function () { finHistState[range] = 'failed'; })
    .then(function () { if (tab === 'finance') render(); });
}

/** One holding's line for the chosen range: [[ms, price]…], or the intraday spark as a fallback. */
function holdingSeries(h, range) {
  var pts = range !== '1d' && finHist[range] && finHist[range][h.symbol];
  if (pts && pts.length > 1) {
    pts = pts.slice();
    if (h.price != null) pts.push([Date.now(), h.price]);
    return pts;
  }
  var sp = h.spark || [];
  return sp.map(function (v, i) { return [i, v]; });
}

/** The whole portfolio's value over the range: every holding carried forward day by day. */
function portfolioSeries(hs, range) {
  var usable = hs.filter(function (h) { return h.price != null; });
  if (!usable.length) return [];
  if (range === '1d' || !finHist[range]) {
    var N = 60;
    var out = [];
    for (var i = 0; i < N; i++) {
      var total = 0;
      usable.forEach(function (h) {
        var sp = h.spark && h.spark.length > 1 ? h.spark : [h.price, h.price];
        total += h.shares * sp[Math.round(i / (N - 1) * (sp.length - 1))];
      });
      out.push([i, total]);
    }
    return out;
  }
  var dayMs = 86400000, byDay = {}, days = {};
  usable.forEach(function (h) {
    var m = {};
    (finHist[range][h.symbol] || []).forEach(function (p) { var d = Math.floor(p[0] / dayMs); m[d] = p[1]; days[d] = true; });
    byDay[h.symbol] = m;
  });
  var keys = Object.keys(days).map(Number).sort(function (a, b) { return a - b; });
  if (keys.length < 2) return [];
  var last = {};
  var series = keys.map(function (d) {
    var total = 0;
    usable.forEach(function (h) {
      var v = byDay[h.symbol][d];
      if (v != null) last[h.symbol] = v;
      // Before a holding's first price in the range, use its first known one.
      var first = null;
      if (last[h.symbol] == null) { for (var k = 0; k < keys.length; k++) { if (byDay[h.symbol][keys[k]] != null) { first = byDay[h.symbol][keys[k]]; break; } } }
      var px = last[h.symbol] != null ? last[h.symbol] : first != null ? first : h.price;
      total += h.shares * px;
    });
    return [d * dayMs, total];
  });
  series.push([Date.now(), usable.reduce(function (s, h) { return s + h.value; }, 0)]);
  return series;
}

/** A line with a soft fill under it. Big draws a baseline at the start value. */
function areaChart(pts, up, big) {
  if (!pts || pts.length < 2) return '';
  var W = 600, H = big ? 220 : 48, pad = big ? 6 : 3;
  var vals = pts.map(function (p) { return p[1]; });
  var lo = Math.min.apply(null, vals), hi = Math.max.apply(null, vals), span = hi - lo || Math.abs(hi) * 0.01 || 1;
  var x = function (i) { return (i / (pts.length - 1) * W).toFixed(1); };
  var y = function (v) { return (pad + (1 - (v - lo) / span) * (H - pad * 2)).toFixed(1); };
  var line = pts.map(function (p, i) { return x(i) + ',' + y(p[1]); }).join(' ');
  var col = up ? 'var(--good)' : 'var(--bad)';
  var id = 'g' + Math.random().toString(36).slice(2, 8);
  return '<svg viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none">' +
    '<defs><linearGradient id="' + id + '" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="' + col + '" stop-opacity="' + (big ? 0.28 : 0.2) + '"/><stop offset="1" stop-color="' + col + '" stop-opacity="0"/></linearGradient></defs>' +
    (big ? '<line x1="0" x2="' + W + '" y1="' + y(vals[0]) + '" y2="' + y(vals[0]) + '" stroke="var(--line-strong)" stroke-dasharray="3 4" vector-effect="non-scaling-stroke"/>' : '') +
    '<polygon points="0,' + H + ' ' + line + ' ' + W + ',' + H + '" fill="url(#' + id + ')"/>' +
    '<polyline points="' + line + '" fill="none" stroke="' + col + '" stroke-width="' + (big ? 2 : 1.5) + '" stroke-linejoin="round" vector-effect="non-scaling-stroke"/></svg>';
}

function donutSvg(parts) {
  var total = parts.reduce(function (s, p) { return s + p.value; }, 0) || 1;
  var r = 42, c = 2 * Math.PI * r, off = 0;
  return '<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="' + r + '" fill="none" stroke="var(--line)" stroke-width="12"/>' + parts.map(function (p) {
    var len = p.value / total * c;
    var seg = '<circle cx="50" cy="50" r="' + r + '" fill="none" stroke="' + p.color + '" stroke-width="12" stroke-dasharray="' + Math.max(0, len - 0.8).toFixed(2) + ' ' + c.toFixed(2) + '" stroke-dashoffset="' + (-off).toFixed(2) + '" transform="rotate(-90 50 50)"><title>' + esc(p.label) + '</title></circle>';
    off += len;
    return seg;
  }).join('') + '</svg>';
}

function cash(n, opts) {
  if (n == null || !isFinite(n)) return '—';

  if (opts.sign) return (n > 0 ? '+' : n < 0 ? '−' : '') + s;
  return (n < 0 ? '−' : '') + s;
}

      if (kind === 'transactions' && f === 'amount') return Math.abs(item.amount);
      if (kind === 'transactions' && f === 'direction') return item.amount < 0 ? 'out' : 'in';
      return item[f] == null ? '' : item[f];
    }
    // A finance to-do can open the form half filled in: a charge that repeats, as a bill.
    if (finEdit.prefill && finEdit.prefill[f] != null) return finEdit.prefill[f];
    if (f === 'date' || f === 'dueDate') return keyOf(new Date());
    if (f === 'direction') return 'out';
    if (f === 'type' && finEdit.card) return 'credit';
    if (f === 'autopay') return 'none';
    return '';
  };
  var noun = finEdit.card ? 'credit card' : item && kind === 'bills' && item.income ? 'payday' : FIN_NOUN[kind];
  var html = '<div class="card fin-form" data-keep="1"><div class="form-title">' + (item ? 'Change ' : 'Add ') + noun + '</div>';
  fields.forEach(function (x) {
    var id = 'fin-f-' + x.f, v = val(x.f);
    if (x.type === 'check') {
      html += '<label class="tick"><input type="checkbox" id="' + id + '"' + (v ? ' checked' : '') + '>' + esc(x.label) + '</label>';
      return;
    }
    html += '<label for="' + id + '">' + esc(x.label);
    if (x.type === 'select') {
      html += '<select id="' + id + '">' + x.opts.map(function (o) { return '<option value="' + esc(o[0]) + '"' + (String(v) === String(o[0]) ? ' selected' : '') + '>' + esc(o[1]) + '</option>'; }).join('') + '</select>';
    } else {
      var type = x.type === 'date' ? 'date' : (x.type === 'money' || x.type === 'number') ? 'text' : 'text';
      var mode = x.type === 'money' || x.type === 'number' ? ' inputmode="decimal"' : '';
      html += '<input type="' + type + '" id="' + id + '"' + mode + ' value="' + esc(v) + '"' + (x.ph ? ' placeholder="' + esc(x.ph) + '"' : '') +
        (x.list ? ' list="fin-cats"' : '') + (x.req ? ' required' : '') + ' autocomplete="off">';
    }
    if (x.hint) html += '<span class="hint">' + esc(x.hint) + '</span>';
    html += '</label>';
  });
  html += all._catList + '<div class="form-acts"><button class="btn primary sm" data-fin-save="' + kind + '">' + (item ? 'Save' : 'Add') + '</button>' +
    '<button class="btn ghost sm" data-fin-cancel="1">Cancel</button>' +
    (errors._fin ? '<div class="err">' + esc(errors._fin) + '</div>' : '') + '</div></div>';
  return html;
}

function finCollect(kind) {
  var item = {}, fields = finFields(kind)[kind];
  fields.forEach(function (x) {
    var el = document.getElementById('fin-f-' + x.f);
    if (!el) return;
    item[x.f] = x.type === 'check' ? el.checked : el.value.trim();
  });
  if (kind === 'transactions') {
    var n = Number(String(item.amount).replace(/[$,\s]/g, ''));
    if (item.amount !== '' && isFinite(n)) item.amount = (item.direction === 'in' ? 1 : -1) * Math.abs(n);
    delete item.direction;
  }
  if (finEdit && finEdit.id) item.id = finEdit.id;
  return item;
}

/** The next 30 days as a line, each renewal pinned on its day. */
function subTrackHtml(ss) {
  var pins = ss.list.filter(function (x) { return (x.status === 'active' || x.status === 'trial') && x.daysUntil != null && x.daysUntil <= 30; })
    .sort(function (a, b) { return a.daysUntil - b.daysUntil; });
  if (!pins.length) return '';
  var rows = [], placed = [];
  pins.forEach(function (x) {
    var r = 0;
    while (placed.some(function (p) { return p.row === r && Math.abs(p.day - x.daysUntil) < 3.5; })) r++;
    placed.push({ row: r, day: x.daysUntil });
    rows.push(r);
  });
  var maxRow = Math.max.apply(null, rows.concat([0]));
  var H = 46 + maxRow * 30, line = H - 8;
  var total = pins.reduce(function (t, x) { return t + (x.status === 'trial' ? 0 : x.amount); }, 0);
  var html = finSec('Next 30 days', plural(pins.length, 'renewal') + ' · ' + cash(total));
  html += '<div class="card fv-trackcard enter"><div class="fv-track" style="height:' + H + 'px">' +
    '<span class="fv-line" style="top:' + line + 'px"></span>' +
    [0, 7, 14, 21, 28].map(function (d) { return '<span class="fv-tick" style="left:' + (d / 30 * 100) + '%;top:' + (line - 4) + 'px"></span>'; }).join('') +
    pins.map(function (x, i) {
      var top = (maxRow - rows[i]) * 30;
      return '<button class="fv-pin' + (x.status === 'trial' ? ' trial' : '') + '" style="left:' + (x.daysUntil / 30 * 100) + '%;top:' + top + 'px" data-sub-open="' + esc(x.id) + '" data-sub-jump="1" title="' +
        esc(x.name + ' · ' + (x.status === 'trial' ? 'trial ends' : cash(x.amount)) + ' · ' + finDay(x.nextCharge)) + '">' + subLogo(x) +
        '<span class="stem" style="height:' + Math.max(4, line - top - 30) + 'px"></span></button>';
    }).join('') +
  '</div><div class="fv-track-labels"><span>Today</span><span>1 week</span><span>2 weeks</span><span>3 weeks</span><span>30 days</span></div></div>';
  return html;
}

    '<button class="card fv-tile' + (s.overdue.length ? ' hot' : '') + '" data-fin-tab="bills"><div class="eyebrow">' + (s.overdue.length ? 'Overdue' : 'Going out, 30 days') + '</div>' +

      }).join('') + '</div></div>';
  }).join('') : '<div class="fin-empty">Nothing due in the next two weeks' + (d.bills.length || (ss && ss.list.length) ? '.' : '. Add bills and subscriptions and they show up here.') + '</div>') + '</div>';

  /* where the money went */
  var cats = (s.month.categories || []).slice(0, 7);
  var catMax = Math.max.apply(null, cats.map(function (c) { return c.amount; }).concat([1]));
  html += finSec('Where it went', esc(monthName) + ' so far', '<button class="btn ghost sm" data-fin-tab="spending">Spending ' + I.arrow + '</button>');
  html += cats.length ? '<div class="fv-bars enter">' + cats.map(function (c, i) {
    var b = s.budgets.filter(function (x) { return x.category.toLowerCase() === c.category.toLowerCase(); })[0];
    return '<div class="fv-bar-row"><span class="l">' + esc(c.category) + '</span><span class="t"><i style="width:' + Math.max(2, Math.round(c.amount / catMax * 100)) + '%;background:' + (b && b.status === 'over' ? 'var(--bad)' : PF_COLORS[i % PF_COLORS.length]) + '"></i></span>' +
      '<span class="a">' + cash(c.amount, { whole: true }) + (b ? '<small> / ' + cash(b.monthly, { whole: true }) + '</small>' : '') + '</span></div>';
  }).join('') + '</div>' : '<div class="fin-empty">No spending this month yet. Drop a bank export and it\'s sorted by category.</div>';

  html += '</div><div>';

  /* what needs you */
  var setup = d.setup || [];
  if (setup.length) {
    var setupShown = finAllSetup ? setup : setup.slice(0, 5);
    html += finSec('Needs you', plural(setup.length, 'thing'));
    html += '<div class="card enter" style="padding:4px 18px">' + setupShown.map(function (it) {
      return '<div class="gap-row"><div style="min-width:0"><div class="what">' + esc(it.title) + '</div><div class="why">' + esc(it.why) + '</div></div>' +
        '<div class="acts"><button class="btn sm' + (it.rank <= 1 ? ' primary' : '') + '" data-fin-go="' + esc(it.id) + '">' + (it.go && it.go.scan ? I.file + ' Drop a file' : it.go && it.go.review ? 'Look' : 'Fix it') + '</button></div></div>';
    }).join('') + '</div>' +
      (setup.length > 5 ? '<button class="fin-more" data-fin-setup-all="1">' + (finAllSetup ? 'Show fewer' : 'Show all ' + setup.length) + '</button>' : '');
  }

  /* the weekly check-in task, when there is one */
  var check = taskById('finances');
  if (check) {
    html += '<div class="card fin-check enter"><button class="check' + (check.done ? ' done' : '') + '" data-done="finances"' + (check.done ? ' disabled' : '') + ' title="Mark done">' + I.check + '</button>' +
      '<div style="min-width:0;flex:1"><div class="what">' + esc(check.title) + '</div><div class="sub">' +
      (check.done ? 'Done this week.' : esc(check.clearedBy || '') + (check.nextDueAt ? ' · due ' + esc(relDay(check.nextDueAt)) + ' ' + clock(check.nextDueAt) : '')) + '</div></div>' +
      (check.overdueFor ? '<span class="pill late">' + esc(check.overdueFor) + ' late</span>' : '') + '</div>';
  }

  /* subscriptions at a glance */
  if (ss && ss.list.length) {
    var next = ss.list.filter(function (x) { return (x.status === 'active' || x.status === 'trial') && x.nextCharge; }).slice(0, 5);
    html += finSec('Renewing next', '', '<button class="btn ghost sm" data-fin-tab="subscriptions">All ' + ss.list.length + ' ' + I.arrow + '</button>');
    html += '<div class="card fv-mini enter">' + next.map(function (x) {
      return '<button class="fv-mini-row" data-fin-tab="subscriptions" data-sub-open="' + esc(x.id) + '" data-sub-jump="1">' + subLogo(x, 'sm') + '<span class="nm">' + esc(x.name) + '<small>' + finWhen(x.daysUntil) + '</small></span>' +
        '<span class="a">' + (x.status === 'trial' ? '<span class="pill soon">Trial</span>' : cash(x.amount)) + '</span></button>';
    }).join('') + '</div>';
  }

  /* budgets at a glance */
  if (s.budgets.length) {
    var pace = Math.round(100 * s.month.dayOfMonth / s.month.daysInMonth);
    html += finSec('Budgets', pace + '% through the month');
    html += '<div class="card fv-mini enter" style="padding:10px 16px">' + s.budgets.slice(0, 6).map(function (b) {
      return '<div class="fv-bud"><div class="top"><span>' + esc(b.category) + '</span><b class="' + (b.status === 'over' ? 'loss' : '') + '">' + cash(b.spent, { whole: true }) + '<small> / ' + cash(b.monthly, { whole: true }) + '</small></b></div>' +
        '<div class="fin-bar ' + b.status + '" style="margin-top:6px"><i style="width:' + Math.min(100, Math.round(b.percent)) + '%"></i><span class="pace" style="left:' + pace + '%"></span></div></div>';
    }).join('') + '</div>';
  }
  html += '</div></div>';

  html += '<div class="fv-briefwrap">' + finBriefHtml() + '</div>';
  return html;
}

/* --------------------------------- accounts -------------------------------- */
function finAccountsHtml(d, s) {
  var order = ['checking', 'savings', 'cash', 'investment', 'retirement', 'other', 'credit', 'loan'];
  // Credit cards have a tab of their own.
  var accts = (s.accounts || []).filter(function (a) { return a.type !== 'credit'; }).sort(function (a, b) { return order.indexOf(a.type) - order.indexOf(b.type); });
  var html = finTabHead('accounts', 'Accounts', accts.length ? 'Net worth ' + cash(s.netWorth) + '. A balance is whatever you last said it was, dated, so a stale one looks stale.' : 'Each account and its balance. No logins or account numbers.',
    '<button class="btn sm" data-scan-file="finance" title="A bank .csv export">' + I.upload + ' Drop an export</button><button class="btn sm primary" data-fin-add="accounts">' + I.plus + ' Account</button>');
  html += finFormFor('accounts');
  if (accts.length) {
    html += '<div class="fv-tiles enter" style="margin:0 0 18px">' +
      [['Cash', s.cash, 'checking, savings and cash'], ['Invested', s.invested, 'brokerage and retirement, at today\'s prices'], ['Other', s.other, 'everything else'], ['Owed', s.debt, 'loans and cards']]
        .filter(function (x) { return x[0] !== 'Other' || x[1]; })
        .map(function (x) { return '<div class="card fv-tile' + (x[0] === 'Owed' && x[1] ? ' hot' : '') + '" style="cursor:default"><div class="eyebrow">' + x[0] + '</div><div class="v">' + wholeCash(x[1]) + '</div><div class="s">' + x[2] + '</div></div>'; }).join('') +
    '</div>';
  }
  html += '<div class="fin-list">' + (accts.length ? accts.map(function (a) {
    var debt = isDebt(a);
    var stale = a.updatedAt && Date.now() - new Date(a.updatedAt) > (d.staleDays || 14) * 86400000;
    var missing = a.balanceMissing || a.balance == null;
    var found = a.detected ? (a.detected.from === 'email' ? 'Found in your email' : a.detected.from === 'import' ? 'Found in a file' : 'Found in your transactions') : '';
    return '<div class="fin-row"><div style="min-width:0"><div class="nm">' + esc(a.name) + '</div><div class="sub">' +
      '<span class="pill">' + esc(ACCOUNT_LABELS[a.type] || a.type) + '</span>' + (a.institution && a.institution !== a.name ? '<span>' + esc(a.institution) + '</span>' : '') +
      (a.private ? '<span class="tag" title="Never shown to the AI">Private</span>' : '') +
      (a.holdingsValue ? '<span>' + cash(a.holdingsValue) + ' in shares</span>' : '') +
      (found ? '<span class="tag" title="' + esc(a.detected.evidence || '') + '">' + esc(found) + '</span>' : '') +
      (missing ? '<span class="pill soon" title="Not counted in your net worth until it has one">No balance yet</span>'
        : '<span class="' + (stale ? 'pill soon' : '') + '" title="When you last updated this balance">' + (stale ? 'Updated ' : '') + esc(ago(a.updatedAt)) + '</span>') + '</div></div>' +
      '<div class="amt' + (debt ? ' neg' : '') + '">' + (missing ? '<span class="muted">—</span>' : (debt ? '−' : '') + cash(Math.abs(a.value)) + (debt ? '<small>owed</small>' : '')) + '</div>' +
      '<div class="acts">' + (missing ? '<button class="btn sm primary" data-fin-edit="accounts|' + esc(a.id) + '">Enter balance</button><button class="btn ghost sm" data-fin-del="accounts|' + esc(a.id) + '" title="Not mine. Delete it, and it isn\'t found again.">✕</button>' : finActs('accounts', a.id)) + '</div></div>';
  }).join('') : '<div class="fin-empty">No accounts yet. Add each one with its balance: just the number you see in your bank\'s app.</div>') + '</div>';
  return html;
}

/* ---------------------------------- cards ---------------------------------- */
function finCardsHtml(d, s) {
  var cards = s.cards || [];
  var ct = s.cardTotals || {};
  var ss = s.subscriptions;
  var html = finTabHead('cards', 'Credit cards', cards.length
    ? cash(ct.balance) + ' owed' + (ct.utilization != null ? ' · ' + Math.round(ct.utilization) + '% of your limits used' : '') + (ct.monthlyInterestIfCarried ? ' · about ' + cash(ct.monthlyInterestIfCarried) + ' a month in interest if carried' : '')
    : 'Balance, limit, due date and APR for each card. Its payment shows up with your bills.',
    '<button class="btn sm primary" data-fin-add="cards">' + I.plus + ' Card</button>');
  html += finFormFor('cards');
  if (!cards.length) return html + '<div class="card fv-empty enter"><div class="ic">' + I.ticket + '</div><h3>No cards yet</h3><p>Add a card with its balance, limit and due date, and its payment joins your bills. The six numbers are all in the summary box of a statement.</p><div class="acts"><button class="btn primary sm" data-fin-add="cards">' + I.plus + ' Add a card</button><button class="btn ghost sm" data-fin-info="cards">What to drop</button></div></div>';
  html += '<div class="card-grid enter">' + cards.map(function (c) {
    var u = c.utilization;
    var ucls = u == null ? '' : u > 50 ? 'over' : u > 30 ? 'near' : 'good';
    var due = c.nextDue ? dateOfKey(c.nextDue) : null;
    var dueTxt = due ? (c.overdue ? '<span class="loss">' + esc(due.toLocaleDateString([], { month: 'short', day: 'numeric' })) + ', late</span>' : esc(relDay(due.toISOString()))) : '<span class="muted">Add a due day</span>';
    var row = function (k, v) { return v == null || v === '' ? '' : '<dt>' + k + '</dt><dd>' + v + '</dd>'; };
    var onCard = ss ? ss.byPayment.filter(function (g) { return g.accountId === c.id; })[0] : null;
    return '<div class="card ccard' + (c.overdue ? ' late' : '') + '">' +
      '<div class="top"><span class="nm">' + esc(c.name) + '</span>' + (c.last4 ? '<span class="l4">•••• ' + esc(c.last4) + '</span>' : '') +
        (c.private ? '<span class="tag" title="Never shown to the AI">Private</span>' : '') + '</div>' +
      '<div class="bal">' + cash(c.balance) + (c.creditLimit ? '<small>of ' + cash(c.creditLimit, { whole: true }) + '</small>' : '') + '</div>' +
      (u != null ? '<div class="fin-bar ' + ucls + '" style="margin-top:0" title="' + Math.round(u) + '% of the limit used"><i style="width:' + Math.min(100, Math.round(u)) + '%"></i></div>' : '') +
      '<dl class="rows" style="margin:0">' +
        row('Payment due', dueTxt) +
        row('Statement balance', c.statementBalance != null ? cash(c.statementBalance) : null) +
        row('Minimum', c.minimumPayment != null ? cash(c.minimumPayment) : null) +
        row('Statement closes', c.nextStatement ? esc(dateOfKey(c.nextStatement).toLocaleDateString([], { month: 'short', day: 'numeric' })) : null) +
        row('Used', u != null ? Math.round(u) + '%' + (c.available != null ? ' · ' + cash(c.available, { whole: true }) + ' free' : '') : null) +
        row('APR', c.apr != null ? c.apr + '%' + (c.monthlyInterestIfCarried ? ' · about ' + cash(c.monthlyInterestIfCarried) + '/mo if carried' : '') : null) +
        row('Autopay', c.autopay && c.autopay !== 'none' ? ({ minimum: 'Minimum', statement: 'Statement balance', full: 'Full balance' })[c.autopay] : 'Off') +
        row('Subscriptions', onCard ? '<button class="fv-link" data-fin-tab="subscriptions">' + onCard.count + ' · ' + cash(onCard.monthly) + '/mo</button>' : null) +
        row('Annual fee', c.annualFee ? cash(c.annualFee, { whole: true }) : null) +
        row('Rewards', c.rewards ? esc(c.rewards) : null) +
      '</dl>' +
      '<div class="acts">' + (c.billId && c.nextDue ? '<button class="btn sm" data-fin-paid="' + esc(c.billId) + '|' + esc(c.nextDue) + '" title="Lowers the balance by the statement amount">' + I.check + ' Paid</button>' : '') +
        '<button class="btn ghost sm" data-fin-edit="cards|' + esc(c.id) + '">Update</button>' +
        '<button class="btn ghost sm" data-fin-del="accounts|' + esc(c.id) + '" title="Delete">✕</button></div>' +
      '<div class="muted" style="font-size:11.5px">Balance ' + esc(ago(c.updatedAt)) + '</div>' +
    '</div>';
  }).join('') + '</div>' +
  '<p class="fin-note">Paying the statement balance by the due date avoids interest. Using under 30% of a limit is the usual guideline for credit scores. Paying a card lowers its balance here and isn\'t counted as spending.</p>';
  return html;
}

/* ---------------------------------- bills ---------------------------------- */
function finBillsHtml(d, s) {
  // Everything late or in the next two weeks, then just the next one of each
  // bill after that, so a monthly bill is not listed twice.
  var seenBill = {};
  var up = (s.upcoming || []).filter(function (u) {
    var first = !seenBill[u.billId];
    seenBill[u.billId] = true;
    return u.overdue || u.daysAway <= 14 || first;
  });
  var html = finTabHead('bills', 'Bills & paydays', (s.monthlyBills ? wholeCash(s.monthlyBills) + ' a month in bills' : 'Rent, phone, insurance, loans, and paydays') + (s.monthlyIncome ? ' · ' + wholeCash(s.monthlyIncome) + ' coming in' : '') + '. Subscriptions have their own tab.',
    '<button class="btn sm primary" data-fin-add="bills">' + I.plus + ' Bill or payday</button>');
  html += finFormHtml('bills');
  html += '<div class="fin-list">' + (up.length ? up.map(function (u) {
    var when = dateOfKey(u.date);
    var pill = u.paid ? '<span class="pill good">' + (u.income ? 'Received' : 'Paid') + '</span>'
      : u.overdue ? '<span class="pill late">' + plural(-u.daysAway, 'day') + ' late</span>'
      : u.daysAway === 0 ? '<span class="pill soon">Today</span>'
      : u.daysAway <= 3 ? '<span class="pill near">' + esc(relDay(when.toISOString())) + '</span>'
      : u.daysAway < 7 ? '<span>' + esc(relDay(when.toISOString())) + '</span>'
      : '<span>In ' + u.daysAway + ' days</span>';
    var act = u.paid
      ? '<button class="btn ghost sm" data-fin-unpaid="' + esc(u.billId) + '|' + u.date + '">Undo</button>'
      : u.autopay && !u.income ? '<span class="tag">Autopay</span>'
      : '<button class="btn sm" data-fin-paid="' + esc(u.billId) + '|' + u.date + '">' + (u.income ? 'Received' : 'Paid') + '</button>';
    return '<div class="fin-row' + (u.paid ? ' is-paid' : '') + (u.overdue ? ' late' : '') + '"><div style="min-width:0"><div class="nm">' + esc(u.name) + '</div>' +
      '<div class="sub">' + pill + '<span>' + esc(when.toLocaleDateString([], { month: 'short', day: 'numeric' })) + '</span><span>' + esc(FREQ_LABELS[u.frequency] || '') + '</span>' +
      (u.autopay ? '<span class="tag">Autopay</span>' : '') + (u.category ? '<span>' + esc(u.category) + '</span>' : '') + '</div></div>' +
      '<div class="amt' + (u.income ? ' gain' : '') + '">' + (u.income ? '+' : '') + cash(u.amount) + '</div><div class="acts">' + act + '</div></div>';
  }).join('') : '<div class="fin-empty">' + (d.bills.length ? 'Nothing due in the next five weeks.' : 'No bills yet. Add rent, your phone, insurance, and paydays too.') + '</div>') + '</div>';
  if (d.bills.length) {
    html += finSec('Every bill and payday', plural(d.bills.length, 'item'));
    html += '<div class="fin-list">' + d.bills.map(function (b) {
      return '<div class="fin-row tx"><div style="min-width:0"><div class="nm" style="font-weight:500">' + esc(b.name) + '</div><div class="sub">' + esc(FREQ_LABELS[b.frequency] || '') + ' from ' + esc(dateOfKey(b.dueDate).toLocaleDateString([], { month: 'short', day: 'numeric', year: 'numeric' })) + (b.autopay ? ' · autopay' : '') + '</div></div>' +
        '<div class="amt' + (b.income ? ' gain' : '') + '">' + (b.income ? '+' : '') + cash(b.amount) + '</div><div class="acts">' +
        (b.cardId ? '<button class="btn ghost sm" data-fin-edit="cards|' + esc(b.cardId) + '" title="Card payments follow the card">Card</button>' : finActs('bills', b.id)) + '</div></div>';
    }).join('') + '</div>';
  }
  return html;
}

/* --------------------------------- spending -------------------------------- */
function finSpendingHtml(d, s) {
  var monthName = new Date().toLocaleDateString([], { month: 'long' });
  var html = finTabHead('spending', 'Spending', monthName + ': ' + cash(s.month.spent) + ' out, ' + cash(s.month.income) + ' in' + (s.month.spentLastMonthToDate ? ' · ' + cash(s.month.spentLastMonthToDate) + ' spent by this day last month' : '') + '.',

  var pace = Math.round(100 * s.month.dayOfMonth / s.month.daysInMonth);
  if (s.budgets.length) {
    html += finSec('Budgets', pace + '% through ' + esc(monthName));
    html += '<div class="fin-list">' + s.budgets.map(function (b) {
      var pct = Math.min(100, Math.round(b.percent));
      var note = b.status === 'over' ? '<span class="pill late">' + cash(-b.left) + ' over</span>'

      return '<div class="fin-row"><div style="min-width:0"><div class="nm">' + esc(b.category) + '</div><div class="sub">' + note + '</div>' +
        '<div class="fin-bar ' + b.status + '"><i style="width:' + pct + '%"></i><span class="pace" style="left:' + pace + '%" title="How far through the month we are"></span></div></div>' +
        '<div class="amt" style="font-size:19px">' + cash(b.spent, { whole: true }) + '<small class="muted">of ' + cash(b.monthly, { whole: true }) + '</small></div>' +
        '<div class="acts">' + finActs('budgets', b.id) + '</div></div>';
    }).join('') + '</div>';
    var budgetedCats = s.budgets.map(function (b) { return b.category.toLowerCase(); });
    var loose = s.month.categories.filter(function (c) { return budgetedCats.indexOf(c.category.toLowerCase()) === -1; });
    if (loose.length) html += '<div class="fin-totals">No budget: ' + loose.map(function (c) { return '<span>' + esc(c.category) + ' <b>' + cash(c.amount) + '</b></span>'; }).join('') + '</div>';
  } else if (s.month.categories.length) {
    var catMax = Math.max.apply(null, s.month.categories.map(function (c) { return c.amount; }).concat([1]));
    html += finSec('By category', 'No budgets yet', '<button class="btn ghost sm" data-fin-add="budgets">' + I.plus + ' Set one</button>');
    html += '<div class="fv-bars">' + s.month.categories.slice(0, 10).map(function (c, i) {
      return '<div class="fv-bar-row"><span class="l">' + esc(c.category) + '</span><span class="t"><i style="width:' + Math.max(2, Math.round(c.amount / catMax * 100)) + '%;background:' + PF_COLORS[i % PF_COLORS.length] + '"></i></span><span class="a">' + cash(c.amount, { whole: true }) + '</span></div>';
    }).join('') + '</div>';
  }
  var txs = d.transactions || [];
  var shown = finAllTx ? txs : txs.slice(0, 12);
  html += finSec('Transactions', d.transactionCount ? plural(d.transactionCount, 'transaction') : '');
  html += '<div class="fin-list">' + (shown.length ? shown.map(function (t) {
    return '<div class="fin-row tx"><div style="min-width:0"><div class="nm" style="font-weight:500">' + esc(t.description) + '</div><div class="sub"><span>' + esc(relDay(dateOfKey(t.date).toISOString())) + '</span>' +
      (t.category ? '<span>' + esc(t.category) + '</span>' : '') + (t.fromBill ? '<span class="tag">Bill</span>' : '') +
      (t.subscriptionId ? '<span class="tag" title="A charge on one of your subscriptions">Subscription</span>' : '') +
      (t.pending ? '<span class="tag" title="Not posted yet. It updates itself when a newer export has it posted.">Pending</span>' : '') +
      (t.transferAccountId ? '<span class="tag" title="Money moved to an account of your own. Not counted as spending.">To ' + esc((finItem('accounts', t.transferAccountId) || {}).name || 'your account') + '</span>' : '') + '</div></div>' +
      '<div class="amt ' + (t.amount < 0 ? '' : 'gain') + '">' + cash(t.amount, { sign: t.amount > 0 }) + '</div><div class="acts">' + finActs('transactions', t.id) + '</div></div>';
  }).join('') : '<div class="fin-empty">No spending logged yet. Drop a bank export, or add one by hand. It\'s a log for your budgets and doesn\'t change account balances.</div>') + '</div>';
  if (txs.length > 12) html += '<button class="fin-more" data-fin-all="1">' + (finAllTx ? 'Show fewer' : d.transactionCount > txs.length ? 'Show the latest ' + txs.length + ' of ' + d.transactionCount : 'Show all ' + d.transactionCount) + '</button>';
  return html;
}

/* ------------------------------- goals, privacy ----------------------------- */
function finGoalsHtml(d, s) {

  html += finFormHtml('goals');
  if (!gs.length) return html + '<div class="card fv-empty enter"><div class="ic">' + I.target + '</div><h3>No goals yet</h3><p>A trip, an emergency fund, a laptop. Set a target and a date.</p><div class="acts"><button class="btn primary sm" data-fin-add="goals">' + I.plus + ' Add a goal</button></div></div>';
  html += '<div class="fv-goals enter">' + gs.map(function (g) {
    var r = 34, c = 2 * Math.PI * r, pct = Math.min(100, Math.round(g.percent));
    return '<div class="card fv-goal"><svg viewBox="0 0 80 80"><circle cx="40" cy="40" r="' + r + '" fill="none" stroke="var(--line)" stroke-width="7"/>' +
      '<circle cx="40" cy="40" r="' + r + '" fill="none" stroke="' + (g.done ? 'var(--good)' : 'var(--accent)') + '" stroke-width="7" stroke-linecap="round" stroke-dasharray="' + (pct / 100 * c).toFixed(1) + ' ' + c.toFixed(1) + '" transform="rotate(-90 40 40)"/>' +

  return '<div class="words"><div class="wgrid">' + WORD_GRID.map(function (row, r) {
    return row.split('').map(function (ch, c) { return '<span' + (lit[r + ':' + c] ? ' class="on"' : '') + '>' + ch + '</span>'; }).join('');
  }).join('') + '</div><div class="wdots">' + dots + '</div></div>';
}

/** Glowing numerals in glass tubes. */
function nixieFace(d, cfg) {
  var p = clockParts(d, cfg);
  var digits = (p.hh + p.m + (cfg.seconds ? p.s : '')).split('');
  return '<div class="nixie">' + digits.map(function (n, i) {
    return (i === 2 || i === 4 ? '<span class="ncol"><i></i><i></i></span>' : '') + '<span class="tube"><span class="ghost">8</span><b>' + n + '</b></span>';
  }).join('') + (p.ampm ? '<span class="nam">' + p.ampm + '</span>' : '') + '</div>';
}

/* A seven-segment display, unlit segments still faintly there. */
var SEGS = { a: '3,1 17,1 14,4 6,4', b: '18,2 18,17 15,15.5 15,5', c: '18,19 18,34 15,31 15,20.5', d: '3,35 17,35 14,32 6,32', e: '2,19 5,20.5 5,31 2,34', f: '2,2 5,5 5,15.5 2,17', g: '3,18 6,16.5 14,16.5 17,18 14,19.5 6,19.5' };
var SEG_ON = ['abcdef', 'bc', 'abdeg', 'abcdg', 'bcfg', 'acdfg', 'acdefg', 'abc', 'abcdefg', 'abcdfg'];
function segDigit(n) {
  return '<svg class="lcd-seg" viewBox="0 0 20 36">' + Object.keys(SEGS).map(function (k) {
    return '<polygon points="' + SEGS[k] + '" class="' + (SEG_ON[n].indexOf(k) !== -1 ? 'on' : '') + '"/>';
  }).join('') + '</svg>';
}
function segmentFace(d, cfg) {
  var p = clockParts(d, cfg);
  var h = cfg.hour12 ? (p.h.length < 2 ? ' ' + p.h : p.h) : p.hh;
  var html = h.split('').map(function (c) { return c === ' ' ? '<svg class="lcd-seg" viewBox="0 0 20 36"></svg>' : segDigit(+c); }).join('') +
    '<span class="scol' + (d.getSeconds() % 2 ? ' dim' : '') + '"><i></i><i></i></span>' + p.m.split('').map(function (c) { return segDigit(+c); }).join('');
  if (cfg.seconds) html += '<span class="ssec">' + p.s.split('').map(function (c) { return segDigit(+c); }).join('') + '</span>';
  return '<div class="lcd">' + html + (p.ampm ? '<span class="lam">' + p.ampm + '</span>' : '') + '</div>';
}

/** Hours, minutes and seconds as arcs closing around the time. */
function ringsFace(d, cfg) {
  var p = clockParts(d, cfg);
  var arc = function (r, frac, color, w) {
    var c = 2 * Math.PI * r;
    return '<circle cx="60" cy="60" r="' + r + '" fill="none" stroke="rgb(255 255 255 / .09)" stroke-width="' + w + '"/>' +
      '<circle cx="60" cy="60" r="' + r + '" fill="none" stroke="' + color + '" stroke-width="' + w + '" stroke-linecap="round" stroke-dasharray="' + (Math.max(0.001, frac) * c).toFixed(2) + ' ' + c.toFixed(2) + '" transform="rotate(-90 60 60)"/>';
  };
  var mins = d.getMinutes() + d.getSeconds() / 60;
  return '<div class="rings"><svg viewBox="0 0 120 120">' +
    arc(54, ((d.getHours() % 12) + mins / 60) / 12, '#5b9bff', 7) + arc(44, mins / 60, '#f4f6fa', 6) +
    (cfg.seconds ? arc(35, d.getSeconds() / 60, '#7ee0c3', 3.5) : '') + '</svg>' +
    '<div class="rt">' + p.h + ':' + p.m + (p.ampm ? '<small>' + p.ampm + '</small>' : '') + '</div></div>';
}

/** The sun crossing the sky by day, the moon by night. */
function solarFace(d, cfg) {
  var p = clockParts(d, cfg);
  var mins = d.getHours() * 60 + d.getMinutes();
  var day = mins >= 360 && mins < 1080;
  var t = day ? (mins - 360) / 720 : ((mins + 1440 - 1080) % 1440) / 720;
  var a = Math.PI * (1 - t), x = 100 + Math.cos(a) * 80, y = 92 - Math.sin(a) * 72;
  var body = day
    ? '<circle cx="' + x.toFixed(1) + '" cy="' + y.toFixed(1) + '" r="16" fill="url(#sun-glow)"/><circle cx="' + x.toFixed(1) + '" cy="' + y.toFixed(1) + '" r="7.5" fill="#ffd36b"/>'
    : '<circle cx="' + x.toFixed(1) + '" cy="' + y.toFixed(1) + '" r="7" fill="#e9eef8"/><circle cx="' + (x + 3.2).toFixed(1) + '" cy="' + (y - 2).toFixed(1) + '" r="6" fill="#0d1526"/>';
  var stars = day ? '' : [[30, 30], [160, 22], [120, 48], [58, 60], [178, 64], [88, 18]].map(function (s) { return '<circle cx="' + s[0] + '" cy="' + s[1] + '" r=".9" fill="#fff" opacity=".7"/>'; }).join('');
  return '<div class="solar"><svg viewBox="0 0 200 104"><defs><radialGradient id="sun-glow"><stop offset="0" stop-color="#ffcf5a" stop-opacity=".7"/><stop offset="1" stop-color="#ffcf5a" stop-opacity="0"/></radialGradient></defs>' + stars +
    '<path d="M20 92 A80 72 0 0 1 180 92" fill="none" stroke="rgb(255 255 255 / .28)" stroke-dasharray="1.5 4" stroke-linecap="round"/>' +
    '<path d="M20 92 A80 72 0 0 1 ' + x.toFixed(1) + ' ' + y.toFixed(1) + '" fill="none" stroke="' + (day ? '#ffd36b' : '#9fb8e8') + '" stroke-width="1.6" stroke-linecap="round" opacity=".8"/>' +
    '<line x1="8" x2="192" y1="92" y2="92" stroke="rgb(255 255 255 / .35)"/>' + body +
    '<text x="20" y="102" class="lbl">' + (day ? '6 AM' : '6 PM') + '</text><text x="180" y="102" text-anchor="end" class="lbl">' + (day ? '6 PM' : '6 AM') + '</text></svg>' +
    '<div class="st">' + p.h + ':' + p.m + (p.ampm ? '<small>' + p.ampm + '</small>' : '') + '</div></div>';
}

/** A plain face in primary colours: a disc, three hands, four dots. */
function bauhausFace(d, seconds) {
  var at = function (deg, r) { var a = deg * Math.PI / 180; return [(50 + Math.sin(a) * r).toFixed(2), (50 - Math.cos(a) * r).toFixed(2)]; };
  var hand = function (deg, from, to, w, color) { var a = at(deg, from), b = at(deg, to); return '<line x1="' + a[0] + '" y1="' + a[1] + '" x2="' + b[0] + '" y2="' + b[1] + '" stroke="' + color + '" stroke-width="' + w + '" stroke-linecap="round"/>'; };
  var mins = d.getMinutes() + d.getSeconds() / 60, hrs = d.getHours() % 12 + mins / 60;
  var dots = [0, 90, 180, 270].map(function (deg, i) { var q = at(deg, 38); return '<circle cx="' + q[0] + '" cy="' + q[1] + '" r="' + (i ? 2.6 : 3.6) + '" fill="' + (i ? '#1b1b1b' : '#d8412f') + '"/>'; }).join('');
  return '<svg class="bauhaus" viewBox="0 0 100 100"><circle cx="50" cy="50" r="48" fill="#f2ede3"/>' +
    '<path d="M50 2 A48 48 0 0 1 98 50 L50 50 Z" fill="#f1c232" opacity=".22"/>' + dots +
    hand(hrs * 30, -4, 24, 5.5, '#1b1b1b') + hand(mins * 6, -6, 36, 3.2, '#2f5fd0') +
    (seconds ? hand(d.getSeconds() * 6, -9, 41, 1.2, '#d8412f') : '') +
    '<circle cx="50" cy="50" r="3" fill="#d8412f"/></svg>';
}

/** Each digit as a column of lit and unlit dots, read as binary. */
function binaryFace(d, cfg) {
  var p = clockParts(d, cfg);
  var groups = [[p.hh, 'H'], [p.m, 'M']].concat(cfg.seconds ? [[p.s, 'S']] : []);
  var col = function (n, bits) { var out = ''; for (var b = bits - 1; b >= 0; b--) out += '<i class="' + ((n >> b) & 1 ? 'on' : '') + '"></i>'; return '<span class="bcol">' + out + '</span>'; };
  return '<div class="binary">' + groups.map(function (g) {
    return '<span class="bgrp">' + col(+g[0][0], 4) + col(+g[0][1], 4) + '<em>' + g[1] + '</em></span>';
  }).join('') + '<span class="bread">' + p.h + ':' + p.m + (p.ampm ? ' ' + p.ampm : '') + '</span></div>';
}

/** The inside of the clock widget, in whichever style is chosen. */
function clockInner(cfg) {
  var d = new Date(), style = cfg.clockStyle;
  var date = '<div class="d">' + esc(d.toLocaleDateString([], { weekday: 'long', month: 'long', day: 'numeric' })) + '</div>';
  if (style === 'analog') return analogFace(d, cfg.seconds) + date;
  if (style === 'flip') return flipFace(d, cfg) + date;
  if (style === 'words') return wordFace(d) + date;
  if (style === 'nixie') return nixieFace(d, cfg) + date;
  if (style === 'segment') return segmentFace(d, cfg) + date;
  if (style === 'rings') return ringsFace(d, cfg) + date;
  if (style === 'solar') return solarFace(d, cfg) + date;
  if (style === 'bauhaus') return bauhausFace(d, cfg.seconds) + date;
  if (style === 'binary') return binaryFace(d, cfg) + date;
  if (style === 'dali') {
    return daliFace(d, cfg.seconds) + '<div class="d">' + esc(d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit', hour12: cfg.hour12 })) + ' · ' +
      esc(d.toLocaleDateString([], { weekday: 'long', month: 'long', day: 'numeric' })) + '</div>';
  }
  var h = d.getHours(), ampm = '';
  if (cfg.hour12) { ampm = h < 12 ? 'AM' : 'PM'; h = h % 12 || 12; } else h = pad(h);
  var sec = cfg.seconds && style !== 'stack' && style !== 'minimal' ? '<span class="sec">:' + pad(d.getSeconds()) + '</span>' : '';
  return '<div class="t"><span class="h">' + h + '</span><span class="colon">:</span><span class="m">' + pad(d.getMinutes()) + '</span>' + sec +
    (ampm ? '<span class="ampm">' + ampm + '</span>' : '') + '</div>' + date;
}

function updateClocks(root) {

  if (el.lastHtml !== html) { el.innerHTML = html; el.lastHtml = html; }
}

/**
 * The handful of things worth a glance, most urgent first. Each is one line,
 * and none repeats what another widget already says in full.
 */
function worthKnowing() {
  var out = [];
  if (!state) return out;
  var now = Date.now();
  var e = state.enforcement;
  if (e && e.blocking && e.reasons && e.reasons[0]) out.push({ k: 'Blocked', v: 'Distractions, until ' + e.reasons[0].title + ' is done', hot: true });

  var next = nextEvent();
  if (next && new Date(next.start) - now < 2 * 3600000) out.push({ k: countdown(next.start).text, v: splitCourse(next.title).title + (next.location ? ', ' + next.location : '') });

  var soonExams = [];
  ((cal && cal.days) || []).slice(0, 3).forEach(function (d) {
    d.items.forEach(function (it) {
      if (it.kind === 'exam' && new Date(it.start) > now && new Date(it.start) - now < 48 * 3600000) soonExams.push(it);
    });
  });
  soonExams.slice(0, 2).forEach(function (it) {
    var t = taskById(it.taskId);
    out.push({ k: 'Exam ' + relDay(it.start).toLowerCase(), v: (t ? t.title : splitCourse(it.title).title) + ', ' + clock(it.start), hot: true });
  });

  var late = lateTasks();
  if (late.length) out.push({ k: 'Overdue', v: late.length === 1 ? late[0].title : late.length + ' items, oldest ' + late[0].title, hot: true });

  var dueToday = itemsOn(keyOf(new Date())).filter(function (it) {
    if (onSchedule(it)) return false;
    var t = taskById(it.taskId);
    return !(t && t.done) && new Date(dueOf(it, t)) > now;
  });
  if (dueToday.length) {
    var first = taskById(dueToday[0].taskId);
    out.push({ k: 'Due today', v: dueToday.length === 1 ? (first ? first.title : dueToday[0].title) + ', ' + clock(dueOf(dueToday[0], first)) : dueToday.length + ' things, first at ' + clock(dueOf(dueToday[0], first)) });
  }

  var sg = (cal && cal.suggestions) || [];
  if (sg.length) out.push({ k: 'From email', v: sg[0].title + ', ' + relDay(sg[0].start) + ' ' + clock(sg[0].start) + (sg.length > 1 ? ' (+' + (sg.length - 1) + ' more to review)' : ' - add it?') });

  var fsum = finData && finData.summary;
  if (fsum) {
    if (fsum.overdue.length) {
      out.push({ k: 'Bill overdue', v: fsum.overdue.length === 1 ? fsum.overdue[0].name + ', ' + cash(fsum.overdue[0].amount) : fsum.overdue.length + ' bills, oldest ' + fsum.overdue[0].name, hot: true });
    }
    var billsNow = fsum.upcoming.filter(function (u) { return !u.paid && !u.income && !u.autopay && u.daysAway >= 0 && u.daysAway <= 1; });
    if (billsNow.length) {
      out.push({ k: 'Bill due ' + (billsNow[0].daysAway ? 'tomorrow' : 'today'), v: billsNow.length === 1 ? billsNow[0].name + ', ' + cash(billsNow[0].amount) : billsNow.length + ' bills, ' + cash(billsNow.reduce(function (t, u) { return t + u.amount; }, 0)) });
    }
    var overBudget = fsum.budgets.filter(function (b) { return b.status === 'over'; });
    if (overBudget.length) out.push({ k: 'Over budget', v: overBudget.map(function (b) { return b.category; }).join(', ') });
  }

  var major = ((newsData && newsData.stories) || []).filter(function (s) { return s.major; })[0];
  if (major) out.push({ k: 'Major story', v: major.title });

  ((stocksData && stocksData.quotes) || []).filter(function (q) { return q.changePercent != null && Math.abs(q.changePercent) >= 3; })
    .sort(function (a, b) { return Math.abs(b.changePercent) - Math.abs(a.changePercent); }).slice(0, 1)
    .forEach(function (q) { out.push({ k: q.symbol + ' ' + pctText(q), v: q.name + (q.session === 'open' ? ' today' : ' at the close') + ', ' + money(q.price) }); });

  return out;
}

  return { root: root, arts: root.children[0], layer: root.children[2], artKey: null };
}

function paintSleep(c) {
  if (!c) return;
  var cfg = sleepCfg();
  c.root.style.setProperty('--dim', cfg.dim);
  c.root.classList.toggle('quiet', cfg.widgetStyle !== 'panels');
  var art = currentArt(cfg);
  paintArt(c, art, cfg);
  var zones = { left: [], right: [] };
  cfg.widgets.forEach(function (w) {
    if (!zones[w.zone] || !SW[w.id]) return;
    var html = SW[w.id](cfg, art);
    if (html) zones[w.zone].push(html);
  });
  c.layer.innerHTML = '<div class="sc-zone sc-left">' + zones.left.join('') + '</div><div class="sc-zone sc-right">' + zones.right.join('') + '</div>';

  // More than fits: leave out whole widgets from the bottom of the list rather
  // than slicing one in half. A zone stacked from the bottom overflows off its
  // top, one stacked from the top (a phone) off its bottom.
  Array.prototype.forEach.call(c.layer.children, function (zone) {
    var kids = zone.children;
    var over = function (last) {
      return kids[0].offsetTop < zone.offsetTop - 1 || last.offsetTop + last.offsetHeight > zone.offsetTop + zone.clientHeight + 1;
    };
    for (var i = kids.length - 1; i > 0 && over(kids[i]); i--) kids[i].style.display = 'none';
  });
}

/**
 * In "Whole painting" mode, the painting is sized to the largest box of its
 * own shape that fits the screen, never stretched and never cropped. On the
 * gallery wall it hangs with a margin and a shadow. The fill modes are laid
 * out by CSS instead.
 */
function layoutArt(c) {
  if (!c) return;
  var cw = c.root.clientWidth, ch = c.root.clientHeight;
  if (!cw || !ch) return;
  Array.prototype.forEach.call(c.arts.children, function (el) {
    var img = el.querySelector('img.front');
    if (!img || !el.ratio || el.classList.contains('fit-fill')) return;
    var m = el.classList.contains('bd-wall') ? Math.round(Math.min(cw, ch) * 0.05) : 0;
    var w = Math.min(cw - 2 * m, (ch - 2 * m) * el.ratio), h = w / el.ratio;
    img.style.width = w + 'px';
    img.style.height = h + 'px';
    img.style.left = (cw - w) / 2 + 'px';
    img.style.top = (ch - h) / 2 + 'px';
  });
}

/** Swaps the painting only when it actually changed, fading the new one in over the old. */
function paintArt(c, art, cfg) {
  var cw = c.root.clientWidth || innerWidth, ch = c.root.clientHeight || innerHeight;
  // Filling is worked out for the screen's shape, so a new shape means a new fill.
  var shape = cfg.fit === 'fill' ? (cw / ch).toFixed(2) : '';
  var key = [art.id, art.url || '', cfg.fit, cfg.backdrop, cfg.drift, shape].join('|');
  if (c.artKey === key) return layoutArt(c);
  c.artKey = key;

  var el = document.createElement('div');
  el.className = 'sc-art ' + (cfg.fit === 'whole' ? 'bd-' + cfg.backdrop : 'fit-fill') + (cfg.drift ? ' drift' : '');
  el.style.opacity = '0';
  var old = Array.prototype.slice.call(c.arts.children);
  c.arts.appendChild(el);
  var reveal = function () {
    requestAnimationFrame(function () { requestAnimationFrame(function () { el.style.opacity = '1'; }); });
    setTimeout(function () { old.forEach(function (o) { if (o.parentNode) o.parentNode.removeChild(o); }); }, 1700);
  };
  var fail = function () {
    if (c.artKey !== key) return;
    el.className = 'sc-art sc-midnight';
    el.innerHTML = '<div class="art-missing">Couldn\'t load the painting</div>';
    reveal();
  };

  if (art.type) {
    el.className = 'sc-art ' + (art.type === 'black' ? 'sc-black' : 'sc-midnight');
    return reveal();
  }

  var source = art.pop ? POP.render(art, 1800) : Promise.resolve(artSrc(art, 1920));
  source.then(function (src) {
    if (cfg.fit !== 'fill' || c.artKey !== key) return src;
    // A picture that won't allow its pixels to be read (some web links) is
    // simply cropped instead.
    return POP.fill(src, 1920, Math.round(1920 * ch / cw), art.fx, art.fy).catch(function () { return src; });
  }).then(function (src) {
    if (c.artKey !== key) return;
    var front = new Image();
    front.className = 'front';
    front.alt = art.title || '';
    if (cfg.fit === 'crop') front.style.objectPosition = Math.round((art.fx == null ? 0.5 : art.fx) * 100) + '% ' + Math.round((art.fy == null ? 0.5 : art.fy) * 100) + '%';
    front.onload = function () {
      if (c.artKey !== key) return;
      el.ratio = front.naturalWidth / front.naturalHeight;
      if (cfg.fit === 'whole' && cfg.backdrop === 'blur') {
        var back = new Image();
        back.className = 'back';
        back.alt = '';
        back.src = src;
        el.insertBefore(back, front);
      }
      layoutArt(c);
      reveal();
    };
    front.onerror = fail;
    front.src = src;
    el.appendChild(front);
  }, fail);
}

var previewCanvas = null;

function mountPreview() {

/* ============================================================================
   Sleep screen: falling asleep and waking up
   ============================================================================ */
var sleepOn = false, sleepEl = null, sleepCanvas = null, sleepStartedAt = 0, wokeAt = 0;
var lastActive = Date.now(), sleepMoved = 0, lastPoint = null, wakeLock = null, sleepFullscreen = false;

/* ============================================================================
   Night mode: the screen goes black except for the time, dim and warm, for
   when you are actually asleep. N switches it on and off from the sleep
   screen without waking anything. Only a key or a click ends it; the mouse
   being nudged in the dark does not.
   ============================================================================ */
var nightMode = false;

function nightTimeHtml() {
  var cfg = sleepCfg(), d = new Date(), h = d.getHours(), ampm = '';
  if (cfg.nightClock !== 'plain') {
    // Any sleep screen clock, without seconds or the date, dimmed by CSS.
    return '<div class="sw-clock c-' + cfg.nightClock + '">' + clockInner(Object.assign({}, cfg, { clockStyle: cfg.nightClock, seconds: false })) + '</div>';
  }
  if (cfg.hour12) { ampm = h < 12 ? 'AM' : 'PM'; h = h % 12 || 12; } else h = pad(h);
  return h + ':' + pad(d.getMinutes()) + (ampm ? '<span class="ampm">' + ampm + '</span>' : '');
}

var NIGHT_CLOCKS = [['plain', 'Plain']].concat(CLOCK_STYLES);

function nightClockName(id) {
  return (NIGHT_CLOCKS.filter(function (s) { return s[0] === id; })[0] || NIGHT_CLOCKS[0])[1];
}

/** ← and → in night mode step through the clocks. */
function cycleNightClock(step) {
  var cfg = sleepCfg();
  var i = NIGHT_CLOCKS.map(function (s) { return s[0]; }).indexOf(cfg.nightClock);
  cfg.nightClock = NIGHT_CLOCKS[(i + step + NIGHT_CLOCKS.length) % NIGHT_CLOCKS.length][0];
  saveSleep();
  var t = sleepEl && sleepEl.querySelector('.night-time');
  if (t) {
    t.classList.toggle('styled', cfg.nightClock !== 'plain');
    t.innerHTML = t.lastHtml = nightTimeHtml();
  }
  var hint = sleepEl && sleepEl.querySelector('.sleep-hint');
  if (hint) hint.textContent = 'Night clock: ' + nightClockName(cfg.nightClock) + ' · ← →';
  sleepEl.classList.add('hint');
  clearTimeout(setNight.timer);
  setNight.timer = setTimeout(function () { if (sleepEl) sleepEl.classList.remove('hint'); }, 2500);
}

function setNight(on) {
  if (!sleepEl) return;
  nightMode = on;
  var layer = sleepEl.querySelector('.night-layer');
  if (!layer) {
    layer = document.createElement('div');
    layer.className = 'night-layer';
    layer.innerHTML = '<div class="night-time"></div>';
    sleepEl.appendChild(layer);
  }
  layer.firstChild.classList.toggle('styled', sleepCfg().nightClock !== 'plain');
  layer.firstChild.innerHTML = layer.firstChild.lastHtml = nightTimeHtml();
  sleepEl.classList.toggle('night', on);
  var hint = sleepEl.querySelector('.sleep-hint');
  if (hint) hint.textContent = on ? 'Night mode · ← → change the clock · N brings everything back' :'Move the mouse, tap, or press any key to wake · N for night mode';
  sleepEl.classList.add('hint');
  clearTimeout(setNight.timer);
  setNight.timer = setTimeout(function () { if (sleepEl) sleepEl.classList.remove('hint'); }, 2500);
}

function tickNight() {
  var t = sleepEl && sleepEl.querySelector('.night-time');
  if (!t) return;
  var html = nightTimeHtml();
  if (t.lastHtml !== html) { t.innerHTML = t.lastHtml = html; }
  // Some faces (rings, hands) change every second; only move once a minute.
  var minute = new Date().getMinutes();
  if (t.minute !== minute) {
    t.minute = minute;
    // A new spot every minute, within the middle of the screen, so a bright
    // pixel never sits in one place all night.
    t.style.transform = 'translate(' + Math.round(Math.random() * 24 - 12) + 'vw,' + Math.round(Math.random() * 24 - 12) + 'vh)';
  }
}

function enterNight() {
  if (!sleepOn) enterSleep(true);
  setNight(true);
}

function enterSleep(byHand) {
  if (sleepOn) return;
  closeHelp();
  hideToast();
  var cfg = sleepCfg();
  sleepOn = true;
  sleepStartedAt = Date.now();
  sleepMoved = 0;
  lastPoint = null;

  sleepEl = document.createElement('div');
  sleepEl.className = 'sleep hint';
  document.documentElement.classList.add('sleeping');
  sleepCanvas = buildCanvas();
  sleepEl.appendChild(sleepCanvas.root);
  document.body.appendChild(sleepEl);
  paintSleep(sleepCanvas);
  requestAnimationFrame(function () { requestAnimationFrame(function () { if (sleepEl) sleepEl.classList.add('show'); }); });
  setTimeout(function () { if (sleepEl) sleepEl.classList.remove('hint'); }, 3500);

  // Full screen needs a click or key to allow it, so only when started by hand.
  if (byHand && cfg.fullscreen && document.documentElement.requestFullscreen && !document.fullscreenElement) {
    document.documentElement.requestFullscreen().then(function () { sleepFullscreen = true; }).catch(function () {});
  }
  if (cfg.keepAwake) holdWakeLock();
  if (Date.now() - newsAt > 60000) refreshNews(false);
}

function wake() {
  if (!sleepOn) return;
  sleepOn = false;
  nightMode = false;
  wokeAt = lastActive = Date.now();
  var el = sleepEl;
  sleepEl = null;
  sleepCanvas = null;
  document.documentElement.classList.remove('sleeping');
  el.classList.remove('show');
  setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 750);
  if (sleepFullscreen && document.fullscreenElement) document.exitFullscreen().catch(function () {});
  sleepFullscreen = false;
  releaseWakeLock();
  refresh();
}

function holdWakeLock() {
  try {
    if (navigator.wakeLock && !wakeLock) {
      navigator.wakeLock.request('screen').then(function (l) {
        wakeLock = l;
        l.addEventListener('release', function () { wakeLock = null; });
      }).catch(function () {});
    }
  } catch (e) {}
}

function releaseWakeLock() {
  try { if (wakeLock) wakeLock.release(); } catch (e) {}
  wakeLock = null;
}

/* Capture phase, so a key or click that wakes the screen is spent on waking
   and never also presses whatever happens to be underneath. */
function swallowWhileAsleep(ev) {
  if (!sleepOn) { lastActive = Date.now(); return; }
  ev.preventDefault();
  ev.stopImmediatePropagation();
  // N switches night mode without waking.
  if (ev.type === 'keydown' && (ev.key === 'n' || ev.key === 'N')) return ev.repeat ? undefined : setNight(!nightMode);
  // Arrows pick night mode's clock without waking.
  if (nightMode && ev.type === 'keydown' && (ev.key === 'ArrowLeft' || ev.key === 'ArrowRight')) return cycleNightClock(ev.key === 'ArrowLeft' ? -1 : 1);
  // The click or Z that started it should not also end it.
  if (Date.now() - sleepStartedAt > 800) wake();
}
document.addEventListener('keydown', swallowWhileAsleep, true);
document.addEventListener('pointerdown', swallowWhileAsleep, true);
document.addEventListener('click', function (ev) {
  if (sleepOn || Date.now() - wokeAt < 500) { ev.preventDefault(); ev.stopImmediatePropagation(); }
}, true);
document.addEventListener('wheel', function () { if (sleepOn) { if (!nightMode) wake(); } else lastActive = Date.now(); }, { capture: true, passive: true });
document.addEventListener('mousemove', function (ev) {
  if (!sleepOn) { lastActive = Date.now(); return; }
  if (nightMode) return;
  // A desk getting bumped is not someone wanting the screen back.
  if (lastPoint && Date.now() - sleepStartedAt > 1200) sleepMoved += Math.abs(ev.clientX - lastPoint[0]) + Math.abs(ev.clientY - lastPoint[1]);
  lastPoint = [ev.clientX, ev.clientY];
  if (sleepMoved > 40) wake();
}, true);

document.addEventListener('fullscreenchange', function () {
  // Esc leaves full screen before the page ever sees the key.
  if (sleepOn && sleepFullscreen && !document.fullscreenElement) { sleepFullscreen = false; wake(); }
});

document.addEventListener('visibilitychange', function () {
  if (document.visibilityState !== 'visible') return;
  if (sleepOn) { if (sleepCfg().keepAwake) holdWakeLock(); } else lastActive = Date.now();
});

/* ============================================================================
   Morning alarm and briefing
   ============================================================================ */
var alarmFired = (function () { try { return localStorage.getItem('ratchet-alarm-fired') || ''; } catch (e) { return ''; } })();

function checkAlarm(cfg) {
  if (!cfg.alarmOn) return;
  var now = new Date();
  if (cfg.alarmDays.indexOf(now.getDay()) === -1) return;
  var at = +cfg.alarmTime.slice(0, 2) * 60 + +cfg.alarmTime.slice(3);
  var mins = now.getHours() * 60 + now.getMinutes();
  // Ten minutes ahead, fetch fresh news and prices, so the briefing opens on
  // this morning's ranking rather than last night's.
  if (at - mins > 0 && at - mins <= 10) {
    if (Date.now() - newsAt > 5 * 60000) refreshNews(true);
    if (Date.now() - stocksAt > 5 * 60000) refreshStocks();
    if (Date.now() - finBriefAt > 5 * 60000) { refreshFinBrief(false); refreshFinance(); }
  }
  var stamp = keyOf(now) + ' ' + cfg.alarmTime;
  // A timer in a background window can run late, so anything within five
  // minutes after the alarm still counts. Once a day, never twice.
  if (mins >= at && mins - at <= 5 && alarmFired !== stamp) {
    alarmFired = stamp;
    try { localStorage.setItem('ratchet-alarm-fired', stamp); } catch (e) {}
    alarmWake(cfg);
  }
}

/**
 * The alarm going off. Night mode ends and the full sleep screen comes back -
 * the painting, the clock and everything worth knowing - freshly painted. If
 * you chose the briefing instead, that plays.
 */
function alarmWake(cfg) {
  if (cfg.alarmAction === 'briefing') return startBriefing(true);
  if (briefEl) endBriefing(false);
  if (!sleepOn) enterSleep(false);
  if (nightMode) setNight(false);
  if (cfg.keepAwake) holdWakeLock();
  if (cfg.alarmChime) chime();
  // Fresh news and prices, then paint again once they land.
  Promise.all([refreshNews(true), refreshStocks()]).then(function () { if (sleepOn) paintSleep(sleepCanvas); });
  paintSleep(sleepCanvas);
}

/** A test run of the alarm, without waiting for the time. */
function testAlarm() {
  var cfg = sleepCfg();
  if (cfg.alarmAction === 'briefing') return startBriefing(true);
  enterNight();
  setTimeout(function () { if (sleepOn) alarmWake(cfg); }, 4000);
}

/* Sound needs the page to have been clicked since it opened. The first click
   or key unlocks it, so a chime at 7am can play from a page left open all night. */
var audioCtx = null;
function unlockAudio() {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
  } catch (e) {}
}
document.addEventListener('pointerdown', unlockAudio, { capture: true, passive: true });
document.addEventListener('keydown', unlockAudio, { capture: true, passive: true });

/** A soft E major arpeggio, three times, each a little louder. */
function chime() {
  unlockAudio();
  if (!audioCtx) return;
  var t0 = audioCtx.currentTime + 0.05;
  for (var r = 0; r < 3; r++) {
    [659.25, 830.61, 987.77, 1318.51].forEach(function (f, i) {
      var o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = 'sine';
      o.frequency.value = f;
      var st = t0 + r * 2.6 + i * 0.26, peak = 0.12 + r * 0.05;
      g.gain.setValueAtTime(0.0001, st);
      g.gain.exponentialRampToValueAtTime(peak, st + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, st + 2.2);
      o.connect(g);
      g.connect(audioCtx.destination);
      o.start(st);
      o.stop(st + 2.3);
    });
  }
}

      return '<div class="r"><span class="t">Due ' + clock(dueOf(it, t)) + '</span><span>' + mark(providerFor(it)) + ' ' + esc(t ? t.title : splitCourse(it.title).title) + '</span></div>';
    })).concat(late.slice(0, 3).map(function (t) {
      return '<div class="r late"><span class="t">' + esc(t.overdueFor) + ' late</span><span>' + esc(t.title) + '</span></div>';
    }));
    slides.push({ kicker: 'Your day', html: '<h1>Today</h1><div class="brief-list">' + rows.slice(0, 8).join('') + '</div>', dur: 14000 });
  }
  return slides;
}

function startBriefing(fromAlarm) {
  if (briefEl) return;
  if (sleepOn) wake();
  closeHelp();
  hideToast();
  var cfg = sleepCfg();

  briefEl = document.createElement('div');
  briefEl.className = 'brief';
  var canvas = buildCanvas();
  briefEl.appendChild(canvas.root);
  briefEl.insertAdjacentHTML('beforeend',
    '<div class="brief-top"><span class="label">Morning briefing</span><div class="brief-bars"></div>' +
      '<button class="brief-btn" data-brief="pause">Pause</button><button class="brief-btn" data-brief="done">Done</button></div>' +
    '<div class="brief-slides"></div>' +
    '<div class="brief-nav"><button class="brief-btn" data-brief="prev">Back</button><button class="brief-btn" data-brief="next">Next</button></div>');
  document.body.appendChild(briefEl);
  document.documentElement.classList.add('sleeping');
  canvas.root.style.setProperty('--dim', 0.62);
  paintArt(canvas, currentArt(cfg), cfg);

  brief = { i: -1, slides: [], timer: null, paused: false, startedAt: Date.now(), touchedAt: Date.now(), canvas: canvas };
  requestAnimationFrame(function () { requestAnimationFrame(function () { if (briefEl) briefEl.classList.add('show'); }); });
  if (cfg.keepAwake) holdWakeLock();
  if (fromAlarm && cfg.alarmChime) chime();

  // Open on what is already loaded, then again once fresh news and prices land.
  var fresh = Promise.all([
    Date.now() - newsAt > 5 * 60000 ? refreshNews(false) : null,
    Date.now() - stocksAt > 5 * 60000 ? refreshStocks() : null,
    Date.now() - finBriefAt > 5 * 60000 ? refreshFinBrief(false) : null,
    Date.now() - finAt > 60000 ? refreshFinance() : null
  ]);
  var go = function () {
    if (!brief || brief.i !== -1) return;
    brief.i = 0;
    brief.slides = buildSlides();
    renderSlides();
    requestAnimationFrame(function () { requestAnimationFrame(function () { showSlide(0); }); });
  };
  fresh.then(go);
  setTimeout(go, 2500);
}

function renderSlides() {
  briefEl.querySelector('.brief-slides').innerHTML = brief.slides.map(function (x) {
    return '<div class="brief-slide ' + (x.cls || '') + '"><div class="kicker">' + x.kicker + '</div>' + x.html + '</div>';
  }).join('');
}

function showSlide(i) {
  if (!brief || !briefEl) return;
  var n = brief.slides.length;
  if (!n) return;
  if (i >= n) {
    // Round again, rebuilt, so a briefing left running picks up new stories.
    brief.slides = buildSlides();
    renderSlides();
    n = brief.slides.length;
    i = 0;
  }
  if (i < 0) i = 0;
  brief.i = i;
  var s = brief.slides[i];
  Array.prototype.forEach.call(briefEl.querySelectorAll('.brief-slide'), function (el, k) { el.classList.toggle('on', k === i); });
  briefEl.querySelector('.brief-bars').innerHTML = brief.slides.map(function (x, k) {
    return '<i class="' + (k < i ? 'done' : k === i ? 'now' : '') + '" style="--dur:' + (x.dur || 12000) + 'ms"><b></b></i>';
  }).join('');
  clearTimeout(brief.timer);
  brief.slideStarted = Date.now();
  brief.remaining = s.dur || 12000;
  if (!brief.paused) brief.timer = setTimeout(function () { showSlide(brief.i + 1); }, brief.remaining);
}

function pauseBriefing(pause) {
  if (!brief) return;
  brief.paused = pause;
  briefEl.classList.toggle('paused', pause);
  var btn = briefEl.querySelector('[data-brief="pause"]');
  if (btn) btn.textContent = pause ? 'Play' : 'Pause';
  clearTimeout(brief.timer);
  if (pause) brief.remaining = Math.max(500, brief.remaining - (Date.now() - brief.slideStarted));
  else { brief.slideStarted = Date.now(); brief.timer = setTimeout(function () { showSlide(brief.i + 1); }, brief.remaining); }
}

function endBriefing(backToSleep) {
  if (!briefEl) return;
  clearTimeout(brief.timer);
  var el = briefEl;
  briefEl = null;
  brief = null;
  el.classList.remove('show');
  setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 900);
  document.documentElement.classList.remove('sleeping');
  lastActive = Date.now();
  if (backToSleep) enterSleep(false); else releaseWakeLock();
}

/* Once the briefing has run its length untouched, the sleep screen comes back. */
function tickBriefing(cfg) {
  if (!brief) return;
  if (Date.now() - brief.touchedAt > cfg.briefingMinutes * 60000) endBriefing(true);
}

document.addEventListener('click', function (ev) {
  if (!briefEl) return;
  var el = ev.target.closest('[data-brief]');
  brief.touchedAt = Date.now();
  if (!el) return;
  ev.preventDefault();
  ev.stopImmediatePropagation();
  var act = el.getAttribute('data-brief');
  if (act === 'done') return endBriefing(false);
  if (act === 'pause') return pauseBriefing(!brief.paused);
  if (act === 'next') return showSlide(brief.i + 1);
  if (act === 'prev') return showSlide(brief.i - 1);
}, true);

document.addEventListener('keydown', function (ev) {
  if (!briefEl) return;
  brief.touchedAt = Date.now();
  if (ev.key === 'ArrowRight') showSlide(brief.i + 1);
  else if (ev.key === 'ArrowLeft') showSlide(brief.i - 1);
  else if (ev.key === ' ') pauseBriefing(!brief.paused);
  else if (ev.key === 'Escape') endBriefing(false);
  else {
    // Tab still moves between the links; the app's own shortcuts wait until it's closed.
    if (ev.key !== 'Tab' && ev.key !== 'Enter') ev.stopImmediatePropagation();
    return;
  }
  ev.preventDefault();
  ev.stopImmediatePropagation();
}, true);

var sleepTicks = 0;
setInterval(function () {
  sleepTicks++;
  if (sleepOn) {
    updateClocks(sleepCanvas.root);
    if (nightMode) tickNight();
    if (sleepTicks % 60 === 0) {
      paintSleep(sleepCanvas);
      // Nudge the widgets a few pixels each minute so nothing burns in.
      sleepCanvas.layer.style.transform = 'translate(' + Math.round(Math.random() * 16 - 8) + 'px,' + Math.round(Math.random() * 12 - 6) + 'px)';
    }
  } else if (tab === 'sleep' && previewCanvas) {
    updateClocks(previewCanvas.root);
    if (sleepTicks % 60 === 0) paintSleep(previewCanvas);
  }

  var cfg = sleepCfg();
  if (!sleepOn && !briefEl && !focusRunning() && cfg.idleMinutes > 0 && document.visibilityState === 'visible' && state &&
      Date.now() - lastActive >= cfg.idleMinutes * 60000) {
    enterSleep(false);
  }
  checkAlarm(cfg);
  if (briefEl) tickBriefing(cfg);
}, 1000);

/* ============================================================================
   Reading what only this PC and devices with the token may read
   ============================================================================ */
function authGet(path) {
  var headers = {};
  var token = getToken();
  if (token) headers['X-Ratchet-Token'] = token;
  return fetch(path, { cache: 'no-store', headers: headers }).then(function (r) {
    if (r.status === 401 && !authGet.asked) {
      authGet.asked = true;
      var entered = window.prompt('This device needs the engine token to open this.\n\nIt is in engine-config.json on the PC, under "token".');
      if (entered) { setToken(entered.trim()); authGet.asked = false; return authGet(path); }
    }
    return r.json().catch(function () { return {}; }).then(function (j) { j._status = r.status; return j; });
  });
}

/* ============================================================================
   Calendar views: day, week and month
   ============================================================================ */
var calView = (function () { try { return localStorage.getItem('ratchet-cal-view') || 'day'; } catch (e) { return 'day'; } })();
var calRanges = {};

function addDaysLocal(d, n) { return new Date(d.getFullYear(), d.getMonth(), d.getDate() + n); }
/* Weeks start on Monday, so a Sunday deadline sits at the end of its week, as it does on the Tasks page. */
function weekStart(d) { return addDaysLocal(d, -((d.getDay() + 6) % 7)); }

function setCalView(v) {
  if (['day', 'week', 'month'].indexOf(v) === -1) return;
  calView = v;
  try { localStorage.setItem('ratchet-cal-view', v); } catch (e) {}
  if (tab !== 'today') switchTab('today'); else { animateNextRender(); render(); }
}

/** A stretch of the calendar, fetched once a minute at most, and whatever was last fetched meanwhile. */
function loadRange(from, days) {
  var k = keyOf(from) + '/' + days;
  var r = calRanges[k];
  if (r && (r.loading || Date.now() - r.at < 60000)) return r.data;
  calRanges[k] = { at: r ? r.at : 0, data: r ? r.data : null, loading: true };
  getJson('/api/calendar?from=' + keyOf(from) + '&days=' + days)
    .then(function (d) { calRanges[k] = { at: Date.now(), data: d && d.days ? d : (r ? r.data : null), loading: false }; })
    .catch(function () { calRanges[k] = { at: Date.now(), data: r ? r.data : null, loading: false }; })
    .then(function () { if (tab === 'today') render(); });
  return r ? r.data : null;
}

function rangeLoaded(from, days) {
  var r = calRanges[keyOf(from) + '/' + days];
  return !!(r && r.data);
}

function calItemHtml(it, cls) {
  var t = isDeadline(it) ? taskById(it.taskId) : null;
  var sp = splitCourse(it.title);
  var course = it.course || sp.course;
  var color = colorFor(course) || it.color || (isDeadline(it) ? 'var(--warn)' : 'var(--accent)');
  var done = !!(t && t.done && t.once);
  var late = isDeadline(it) && !done && new Date(dueOf(it, t)) < Date.now();
  var title = t ? t.title : sp.title;
  var when = it.allDay ? (isDeadline(it) ? 'Due' : 'All day') : (isDeadline(it) ? 'Due ' : '') + clock(isDeadline(it) ? dueOf(it, t) : it.start);
  var lt = labelText(it);
  if (cls === 'chip') {
    return '<span class="chipline' + (isDeadline(it) ? ' dl' : '') + (late ? ' late' : '') + '" style="--c:' + esc(color) + '" title="' + esc(when + ' · ' + title + (lt ? ' · ' + lt : '')) + '">' +
      (it.allDay ? '' : esc(clock(isDeadline(it) ? dueOf(it, t) : it.start).replace(/:00|\s/g, '').toLowerCase()) + ' ') + esc(title) + '</span>';
  }
  return '<button class="wev' + (isDeadline(it) ? ' dl' : '') + (late ? ' late' : '') + (done ? ' done' : '') + '" style="--c:' + esc(color) + '" data-day="' + keyOf(new Date(it.start)) + '">' +
    '<span class="t">' + mark(providerFor(it)) + esc(when) + (lt ? ' · ' + esc(lt) : '') + '</span>' + esc(title) + '</button>';
}

function viewBarHtml() {
  var anchor = dateOfKey(viewDay || keyOf(new Date()));

  if (calView === 'week') {
    var s = weekStart(anchor), e = addDaysLocal(s, 6);
    label = s.toLocaleDateString([], { month: 'short', day: 'numeric' }) + ' – ' + e.toLocaleDateString([], s.getMonth() === e.getMonth() ? { day: 'numeric' } : { month: 'short', day: 'numeric' });
  } else if (calView === 'month') {
    label = anchor.toLocaleDateString([], { month: 'long', year: 'numeric' });
  }
  return '<div class="viewbar enter">' +
    (label ? '<span class="range">' + esc(label) + '</span>' : '<span style="margin-right:auto"></span>') +

    '<div class="seg">' + [['day', 'Day', 'D'], ['week', 'Week', 'W'], ['month', 'Month', 'M']].map(function (v) {
