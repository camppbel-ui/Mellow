.wk:hover .d { text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 4px; }
@media (max-width: 560px) {

  .glance { margin-left: 0; }
  .glance > div { text-align: left; }
  .daybar .arrow { display: none; }
  .tl { grid-template-columns: 62px 8px minmax(0, 1fr) auto; }

}

/* ==========================================================================
   Calendar views: day, week, month
   ========================================================================== */
.viewbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin: 0 0 16px; }
.viewbar .range { font: 400 24px/1 var(--serif); margin-right: auto; }
.viewbar .seg button { padding: 6px 13px; }
.week { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); overflow: hidden; margin-bottom: 30px; }
.wcol { border-left: 1px solid var(--line); min-height: 320px; display: flex; flex-direction: column; min-width: 0; }
.wcol:first-child { border-left: 0; }
.wcol .wh { border: 0; border-bottom: 1px solid var(--line); background: none; padding: 10px 8px 9px; text-align: left; cursor: pointer; color: inherit; font: inherit; }
.wcol .wh .dow { font: 500 10px/1 var(--mono); letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
.wcol .wh .num { font: 400 26px/1.1 var(--serif); margin-top: 4px; }
.wcol.today .wh { background: linear-gradient(180deg, #3f7dff, var(--accent-strong)); color: #fff; }
.wcol.today .wh .dow { color: rgba(255, 255, 255, 0.72); }
.wcol .wh:hover .num { text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 4px; }
.wcol .wi { padding: 6px; display: flex; flex-direction: column; gap: 4px; }
.wev { display: block; width: 100%; text-align: left; border: 0; border-left: 3px solid var(--c, var(--accent)); background: var(--surface-2); border-radius: 4px; padding: 5px 6px; font: inherit; font-size: 12px; line-height: 1.3; color: var(--ink); cursor: pointer; overflow-wrap: anywhere; }
.wev .t { display: block; font: 500 10px/1.3 var(--mono); color: var(--muted); }
.wev.dl { background: transparent; border: 1px dashed var(--c, var(--warn)); border-left: 3px solid var(--c, var(--warn)); }
.wev.late { border-color: var(--bad); color: var(--bad); }
.wev.done { opacity: 0.45; text-decoration: line-through; }
.month { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); border-top: 1px solid var(--line); border-left: 1px solid var(--line); margin-bottom: 30px; background: var(--surface); border-radius: var(--r); overflow: hidden; }
.month .mdow { font: 500 10px/1 var(--mono); letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); padding: 9px 8px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.mday { min-height: 104px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 6px; display: flex; flex-direction: column; gap: 3px; min-width: 0; cursor: pointer; background: none; text-align: left; font: inherit; color: inherit; border-top: 0; border-left: 0; }
.mday:hover { background: var(--surface-2); }
.mday .n { font: 400 19px/1 var(--serif); margin-bottom: 3px; }
.mday.other { background: var(--bg); }
.mday.other .n, .mday.other .chipline { opacity: 0.45; }
.mday.today .n { display: inline-grid; place-items: center; width: 28px; height: 28px; border-radius: 50%; background: var(--accent-strong); color: #fff; box-shadow: 0 0 14px rgba(47, 107, 255, 0.5); }
.chipline { display: block; font-size: 11.5px; line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 1px 4px; border-radius: 3px; border-left: 2px solid var(--c, var(--accent)); background: color-mix(in srgb, var(--c, var(--accent)) 10%, transparent); }
.chipline.dl { border-left-style: dashed; }
.chipline.late { color: var(--bad); }
.mday .more { font: 500 10.5px var(--mono); color: var(--muted); padding-left: 4px; }
.cal-loading { color: var(--faint); font-size: 13px; padding: 30px 0; text-align: center; }
@media (max-width: 760px) {
  .week { grid-template-columns: minmax(0, 1fr); }
  .wcol { border-left: 0; border-top: 1px solid var(--line); min-height: 0; }
  .wcol:first-child { border-top: 0; }
  .wcol .wh { display: flex; align-items: baseline; gap: 10px; }
  .wcol .wh .num { font-size: 20px; margin: 0; }
  .mday { min-height: 62px; padding: 4px; }
  .chipline { font-size: 0; padding: 0; height: 5px; border-radius: 3px; border-left: 0; background: var(--c, var(--accent)); }
  .mday .more { font-size: 9.5px; }
}

/* ==========================================================================
   Drop a file, and the side panels (scanned files, assistant)
   ========================================================================== */
.drop-veil { position: fixed; inset: 0; z-index: 90; background: color-mix(in srgb, var(--bg) 82%, transparent); backdrop-filter: blur(3px); display: none; place-items: center; pointer-events: none; }
.drop-veil.on { display: grid; }
.drop-veil .box { border: 2px dashed var(--ink-2); border-radius: 18px; padding: 42px 54px; text-align: center; background: var(--surface); box-shadow: var(--shadow); max-width: min(520px, calc(100vw - 40px)); }
.drop-veil .box b { display: block; font: 400 34px/1.1 var(--serif); margin-bottom: 8px; }
.drop-veil .box span { color: var(--muted); font-size: 13.5px; }
.panel { position: fixed; top: 0; right: 0; bottom: 0; z-index: 70; width: min(470px, 100vw); background: var(--surface); border-left: 1px solid var(--line-strong); box-shadow: -30px 0 80px -30px rgba(0, 0, 0, 0.95); display: flex; flex-direction: column; transform: translateX(104%); transition: transform 0.28s cubic-bezier(.2, .8, .2, 1); }
.panel.open { transform: none; }
.panel .ph { display: flex; align-items: center; gap: 8px; padding: calc(14px + env(safe-area-inset-top)) 16px 12px; border-bottom: 1px solid var(--line); }
.panel .ph h3 { margin: 0; font: 400 24px/1 var(--serif); flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.panel .pb { flex: 1; overflow-y: auto; padding: 14px 16px 20px; }
.panel .pf { border-top: 1px solid var(--line); padding: 10px 12px calc(12px + env(safe-area-inset-bottom)); }
.icon-btn { border: 0; background: none; color: var(--muted); border-radius: 6px; padding: 6px; cursor: pointer; display: grid; place-items: center; }
.icon-btn:hover { background: var(--surface-2); color: var(--ink); }
.icon-btn svg { width: 16px; height: 16px; }
.fab { position: fixed; right: max(22px, env(safe-area-inset-right)); bottom: calc(22px + env(safe-area-inset-bottom)); z-index: 55; display: flex; align-items: center; gap: 8px; border: 1px solid #3a76ff; border-radius: 999px; padding: 11px 16px 11px 13px; background: linear-gradient(180deg, #4a86ff, var(--accent-strong)); color: #fff; font: 500 13.5px var(--sans); cursor: pointer; box-shadow: 0 1px 0 rgba(255, 255, 255, 0.2) inset, 0 16px 40px -12px rgba(47, 107, 255, 0.75); transition: transform 0.15s, box-shadow 0.15s; }
.fab:hover { transform: translateY(-1px); box-shadow: 0 1px 0 rgba(255, 255, 255, 0.2) inset, 0 20px 46px -12px rgba(47, 107, 255, 0.9); }
.fab svg { width: 17px; height: 17px; }
.fab kbd { background: transparent; color: rgba(255, 255, 255, 0.7); border-color: rgba(255, 255, 255, 0.3); }
body.panel-open .fab { display: none; }
@media (max-width: 860px) { .fab kbd { display: none; } .fab { bottom: calc(16px + env(safe-area-inset-bottom)); right: 14px; } }

.drop-row { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); cursor: pointer; }
.drop-row .ico { width: 34px; height: 34px; border-radius: 7px; background: var(--surface-2); display: grid; place-items: center; font: 500 9.5px var(--mono); color: var(--ink-2); text-transform: uppercase; }
.drop-row .nm { font-weight: 550; font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.drop-row .sub { color: var(--muted); font-size: 12px; }
.drop-row.on { background: var(--surface-2); margin: 0 -16px; padding: 10px 16px; }
.spin-dot { width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--line-strong); border-top-color: var(--ink); animation: spin 0.8s linear infinite; display: inline-block; }
.find { display: grid; grid-template-columns: 20px minmax(0, 1fr); gap: 10px; padding: 11px 0; border-bottom: 1px solid var(--line); }
.find input[type=checkbox] { width: 16px; height: 16px; margin-top: 3px; accent-color: var(--accent-strong); }
.find .fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 6px; margin-top: 6px; }
.find input.t, .find .fields input { font: inherit; font-size: 13px; padding: 5px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); color: var(--ink); width: 100%; min-width: 0; }
.find input.t { font-weight: 550; }
.find .meta { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-top: 5px; color: var(--muted); font-size: 11.5px; }
.find .ev { font-style: italic; }
.find.added { opacity: 0.5; }
.find.low .t { border-color: color-mix(in srgb, var(--warn) 60%, var(--line)); }

.chat { display: flex; flex-direction: column; gap: 12px; }
.msg { max-width: 92%; font-size: 13.8px; line-height: 1.5; overflow-wrap: anywhere; }
.msg.user { align-self: flex-end; background: var(--accent-strong); color: #fff; padding: 9px 13px; border-radius: 14px 14px 4px 14px; white-space: pre-wrap; }
.msg.user .files { font: 500 10.5px var(--mono); opacity: 0.7; margin-top: 4px; }
.msg.assistant { align-self: flex-start; }
.msg.assistant p { margin: 0 0 8px; }
.msg.assistant p:last-child { margin-bottom: 0; }
.msg.assistant ul, .msg.assistant ol { margin: 4px 0 8px; padding-left: 20px; }
.msg.assistant code { font-size: 12px; }
.msg.assistant pre { background: var(--surface-2); border: 1px solid var(--line); border-radius: 6px; padding: 8px; overflow-x: auto; font: 12px/1.45 var(--mono); white-space: pre; }
.msg.activity { align-self: flex-start; font: 500 10.5px/1.4 var(--mono); letter-spacing: 0.04em; color: var(--faint); }
.msg.change { align-self: stretch; max-width: none; display: flex; gap: 8px; align-items: center; font-size: 12.5px; color: var(--good); border: 1px solid color-mix(in srgb, var(--good) 30%, var(--line)); background: var(--good-soft); padding: 7px 10px; border-radius: 8px; }
.msg.change span { flex: 1; }
.msg.change > svg { width: 14px; height: 14px; flex: none; }
.msg.error { align-self: stretch; max-width: none; font-size: 12.5px; color: var(--bad); background: var(--bad-soft); padding: 7px 10px; border-radius: 8px; }
/* voice mode */
.voice-bar { display: flex; align-items: center; gap: 10px; padding: 8px 8px 8px 12px; margin-bottom: 8px; border-radius: 10px; background: var(--accent-soft); border: 1px solid color-mix(in srgb, var(--accent) 35%, var(--line)); }
.voice-bar .vtxt { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; font-size: 12.5px; }
.voice-bar .vtxt span { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.voice-bar kbd { margin-left: 6px; }
.vdot { width: 12px; height: 12px; border-radius: 50%; background: var(--accent); flex: none; }
.vdot.listening { animation: vpulse 1.3s ease-out infinite; }
.vdot.thinking { background: var(--muted); animation: blink 1.2s ease-in-out infinite; }
.vdot.speaking { background: var(--good); animation: vpulse-good 0.9s ease-out infinite; }
.vdot.waiting { background: var(--warn); }
@keyframes vpulse { 0% { box-shadow: 0 0 0 0 rgba(74, 134, 255, 0.6); } 100% { box-shadow: 0 0 0 9px rgba(74, 134, 255, 0); } }
@keyframes vpulse-good { 0% { box-shadow: 0 0 0 0 rgba(80, 200, 140, 0.55); } 100% { box-shadow: 0 0 0 8px rgba(80, 200, 140, 0); } }
#voice-mic.on { color: #fff; background: var(--accent-strong); }
@media (max-width: 860px) { .voice-bar kbd { display: none; } }

.approve { border: 1px solid var(--line-strong); border-radius: 10px; padding: 12px; background: var(--bg); }
.approve + .approve { margin-top: 8px; }
.approve .at { font-weight: 600; font-size: 13.5px; }
.approve .ad { color: var(--muted); font-size: 12.5px; margin-top: 3px; white-space: pre-wrap; }
.approve pre { margin: 8px 0 0; max-height: 280px; overflow: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 6px 0; font: 11.5px/1.5 var(--mono); }
.approve pre span { display: block; padding: 0 8px; white-space: pre; }
.approve pre .add { background: var(--good-soft); color: var(--good); }
.approve pre .del { background: var(--bad-soft); color: var(--bad); }
.approve .aa { display: flex; gap: 6px; margin-top: 10px; align-items: center; flex-wrap: wrap; }
.composer { display: flex; gap: 8px; align-items: flex-end; }
.composer textarea { flex: 1; resize: none; font: inherit; font-size: 14px; line-height: 1.45; padding: 9px 11px; border: 1px solid var(--line-strong); border-radius: 10px; background: var(--bg); color: var(--ink); max-height: 180px; min-height: 42px; }
.composer textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.attach-chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 6px; }
.attach-chips span { font: 500 11px var(--mono); background: var(--surface-2); border: 1px solid var(--line); border-radius: 5px; padding: 3px 6px; }
.thinking { display: flex; gap: 8px; align-items: center; color: var(--muted); font-size: 12.5px; }
.conv-row { display: flex; gap: 8px; align-items: center; width: 100%; padding: 10px 0; border: 0; border-bottom: 1px solid var(--line); background: none; color: inherit; text-align: left; cursor: pointer; font: inherit; }
.conv-row span { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.conv-row small { color: var(--muted); font-size: 11.5px; }

.subs { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin: 0 0 18px; }
.subs .lbl { font: 500 10.5px/1 var(--mono); letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); margin-right: 4px; }
.subs button { border: 1px solid var(--line-strong); background: var(--surface); color: var(--muted); border-radius: 999px; padding: 4px 11px; font: inherit; font-size: 12.5px; cursor: pointer; }
.subs button.on { background: var(--accent-soft); border-color: var(--accent-line); color: var(--ink); }
.readin a.yours { background: var(--accent-strong); color: #fff; border-color: #3a76ff; }
.readin a.yours small { color: rgba(255, 255, 255, 0.7); }

.card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 12px; }
.ccard { padding: 16px; display: flex; flex-direction: column; gap: 10px; position: relative; overflow: hidden; }
.ccard .top { display: flex; align-items: baseline; gap: 8px; }
.ccard .nm { font-weight: 600; flex: 1; min-width: 0; overflow-wrap: anywhere; }
.ccard .l4 { font: 500 11px var(--mono); color: var(--muted); letter-spacing: 0.08em; }
.ccard .bal { font: 400 32px/1 var(--serif); }
.ccard .bal small { font: 500 11px var(--mono); color: var(--muted); margin-left: 6px; }
.ccard .rows { display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; font-size: 12.5px; }
.ccard .rows dt { color: var(--muted); }
.ccard .rows dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; }
.ccard .acts { display: flex; gap: 4px; flex-wrap: wrap; }
.ai-share { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 10px 20px; padding: 14px 18px; }
.ai-share .switch { font-size: 13px; }

/* ==========================================================================
   Toast, help, motion
   ========================================================================== */
.toast {
  position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom)); z-index: 60;
  transform: translate(-50%, 16px); opacity: 0; pointer-events: none;
  display: flex; align-items: center; gap: 16px; padding: 10px 10px 10px 16px;
  background: rgba(27, 30, 36, 0.92); color: var(--ink); border: 1px solid var(--line-strong); border-radius: 12px;
  backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); box-shadow: 0 24px 50px -16px rgba(0, 0, 0, 0.9);
  transition: 0.25s cubic-bezier(.2, .8, .2, 1); max-width: calc(100vw - 28px); font-size: 13.5px;
}
.toast.show { transform: translate(-50%, 0); opacity: 1; pointer-events: auto; }
.toast button { background: var(--accent-soft); border: 1px solid var(--accent-line); color: var(--accent); border-radius: 7px; padding: 5px 10px; font-weight: 600; font-size: 12.5px; cursor: pointer; }

.help-backdrop { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.66); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); z-index: 80; display: grid; place-items: center; }
.help { width: min(380px, calc(100vw - 32px)); padding: 22px 24px; }
.help h3 { margin: 0 0 14px; font: 400 26px/1 var(--serif); }
.help .row { display: flex; justify-content: space-between; padding: 8px 0; border-top: 1px solid var(--line); }

.animate .enter { animation: enter 0.4s cubic-bezier(.2, .8, .2, 1) both; }
.animate .tasks > .enter:nth-child(2), .animate .items > .enter:nth-child(2) { animation-delay: 0.04s; }
.animate .tasks > .enter:nth-child(3), .animate .items > .enter:nth-child(3) { animation-delay: 0.08s; }
.animate .tasks > .enter:nth-child(n+4), .animate .items > .enter:nth-child(n+4) { animation-delay: 0.12s; }
@keyframes enter { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: none; } }

/* ==========================================================================
   Guide: setting up, and how to use each part
   ========================================================================== */
.page-head .eyebrow, .today-head .eyebrow { color: var(--accent); }
.today-head .glance .eyebrow { color: var(--muted); }
.now-line { color: var(--accent); }
.tl.current .when b { color: var(--accent); }
.drop-veil .box { border-color: var(--accent); }

.welcome { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; padding: 16px 18px; margin: 0 0 26px; border-color: var(--accent-line); background: linear-gradient(120deg, rgba(47, 107, 255, 0.16), rgba(12, 13, 16, 0.9) 60%); }
.welcome .wi { width: 38px; height: 38px; border-radius: 10px; display: grid; place-items: center; background: var(--accent-strong); color: #fff; flex: none; }
.welcome .wi svg { width: 18px; height: 18px; }
.welcome .wt { flex: 1 1 260px; min-width: 0; }
.welcome .wt b { display: block; font: 400 22px/1.15 var(--serif); }
.welcome .wt span { color: var(--ink-2); font-size: 13px; }
.welcome .wa { display: flex; gap: 6px; align-items: center; }

.guide-jump { display: flex; gap: 6px; flex-wrap: wrap; margin: 0 0 8px; }
.guide-jump button { font: inherit; cursor: pointer; color: var(--ink-2); font-size: 12.5px; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line-strong); background: var(--surface); transition: border-color 0.15s, color 0.15s; }
.guide-jump button:hover { color: var(--ink); border-color: var(--accent-line); }
.alert.info { background: var(--accent-soft); color: var(--accent); border-color: var(--accent-line); }

.progress-head { display: flex; align-items: center; gap: 16px; padding: 18px 20px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.progress-head .big { font: 400 40px/1 var(--serif); }
.progress-head .big small { font-size: 20px; color: var(--muted); }
.progress-head .meter { flex: 1 1 160px; }
.setup-row { display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; gap: 14px; align-items: start; padding: 16px 20px; border-top: 1px solid var(--line); }
.setup-row:first-of-type { border-top: 0; }
.setup-row .st { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font: 500 12px var(--mono); color: var(--muted); border: 1.5px solid var(--line-strong); }
.setup-row.done .st { background: var(--accent-strong); border-color: var(--accent-strong); color: #fff; box-shadow: 0 0 14px rgba(47, 107, 255, 0.45); }
.setup-row .st svg { width: 13px; height: 13px; }
.setup-row .nm { font-weight: 600; font-size: 14.5px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.setup-row .ds { color: var(--muted); font-size: 13px; margin-top: 4px; }
.setup-row.done .nm { color: var(--ink-2); }
.setup-row .ac { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }

.os-tabs { margin: 0 0 14px; }
.steps-list { list-style: none; margin: 0; padding: 0; counter-reset: step; }
.steps-list > li { counter-increment: step; position: relative; padding: 16px 0 16px 52px; border-top: 1px solid var(--line); color: var(--ink-2); }
.steps-list > li:first-child { border-top: 0; }
.steps-list > li::before { content: counter(step); position: absolute; left: 0; top: 13px; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font: 400 20px/1 var(--serif); color: var(--accent); background: var(--accent-soft); box-shadow: inset 0 0 0 1px var(--accent-line); }
.steps-list > li b.h { display: block; color: var(--ink); font-weight: 600; font-size: 14.5px; margin-bottom: 3px; }
.steps-list > li p { margin: 6px 0 0; font-size: 13.5px; }

/* ==========================================================================

/* ==========================================================================
   Files: the library of everything you've dropped
   ========================================================================== */
.dropzone { display: flex; align-items: center; gap: 18px; padding: 22px 24px; margin: 0 0 22px; cursor: pointer; border: 1.5px dashed var(--line-strong); background: linear-gradient(120deg, rgba(47, 107, 255, 0.08), rgba(12, 13, 16, 0.6) 55%); transition: border-color 0.15s, background 0.15s; flex-wrap: wrap; }
.dropzone:hover, .dropzone.over { border-color: var(--accent); background: linear-gradient(120deg, rgba(47, 107, 255, 0.16), rgba(12, 13, 16, 0.6) 60%); }

.files-layout { display: grid; grid-template-columns: 200px minmax(0, 1fr); gap: 28px; align-items: start; }
.folder-rail { display: flex; flex-direction: column; gap: 2px; position: sticky; top: 24px; }

.folder-rail button { display: flex; align-items: center; gap: 10px; width: 100%; border: 0; background: none; color: var(--muted); padding: 8px 10px; border-radius: 8px; cursor: pointer; font: inherit; font-size: 13.5px; text-align: left; }
.folder-rail button svg { width: 15px; height: 15px; opacity: 0.8; }
.folder-rail button:hover { background: var(--surface-2); color: var(--ink); }
.folder-rail button.on { background: var(--accent-soft); color: var(--ink); box-shadow: inset 0 0 0 1px rgba(91, 155, 255, 0.16); }

.folder-rail .n { margin-left: auto; font: 500 11px/1 var(--mono); color: var(--faint); }

.files-head { display: flex; align-items: baseline; gap: 12px; padding-bottom: 10px; margin-bottom: 12px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }

.file-row .fstat { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }

.ftype { width: 44px; height: 52px; border-radius: 8px; display: grid; place-items: end center; padding-bottom: 8px; font: 600 9.5px/1 var(--mono); letter-spacing: 0.06em; text-transform: uppercase; color: var(--ft, var(--ink-2)); background: linear-gradient(160deg, color-mix(in srgb, var(--ft, #8b929e) 22%, #14161a), #0e0f12); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--ft, #8b929e) 35%, transparent); position: relative; flex: none; }

.ftype.t-doc { --ft: #5b9bff; }

.ftype.t-text { --ft: #c5cbd5; }

.fchip { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: var(--ink-2); }
.fchip svg { width: 12px; height: 12px; color: var(--accent); }

.file-hero { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 18px; padding: 20px 22px; align-items: start; }
.file-hero h2 { margin: 0; font: 400 32px/1.08 var(--serif); letter-spacing: -0.01em; overflow-wrap: anywhere; }
.file-hero .fm { color: var(--muted); font-size: 12.5px; margin-top: 6px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

.file-hero .fa select { font: inherit; font-size: 13px; padding: 6px 10px; border-radius: 8px; border: 1px solid var(--line-strong); background: var(--surface-2); color: var(--ink); }

.file-sum { margin: 18px 0 0; font-size: 14.5px; color: var(--ink-2); max-width: 720px; }

.sugg .t { font: inherit; font-weight: 600; font-size: 14px; padding: 7px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink); width: 100%; min-width: 0; }

@media (max-width: 760px) {

  .folder-rail::-webkit-scrollbar { display: none; }
  .folder-rail .rail-label { display: none; }

/* ==========================================================================
   Phones and tablets: touch-sized, no keyboard hints, no zoom on focus
   ========================================================================== */
@media (hover: none) and (pointer: coarse) {
  .nav kbd, .link-btn kbd, .fab kbd { display: none; }
  input:not([type=checkbox]):not([type=radio]):not([type=range]), select, textarea { font-size: 16px !important; }
  .btn { min-height: 38px; }
  .btn.sm { min-height: 34px; }
  .icon-btn { padding: 9px; }
  .check { width: 28px; height: 28px; }
  .lift:hover { box-shadow: none; }
}

/* ==========================================================================
   Polish: lists with a little light in them
   ========================================================================== */
body::before { animation: aurora 38s ease-in-out infinite alternate; }
@keyframes aurora { from { transform: translate3d(0, 0, 0) scale(1); } to { transform: translate3d(-3%, 2%, 0) scale(1.06); } }

.col-head { border-bottom: 1px solid transparent; border-image: linear-gradient(90deg, var(--ink-2), var(--line-strong) 45%, transparent) 1; }
.col-head h2::before, .group-head h2::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 10px var(--accent); margin-right: 10px; vertical-align: 5px; }
.section-head, .group-head { border-image: linear-gradient(90deg, var(--line-strong), transparent 85%) 1; }

.tl, .due, .fin-row, .suggest, .wk, .row-link { transition: background 0.2s; }
.tl:hover, .due:hover, .fin-row:hover, .wk:hover, .row-link:hover { background: linear-gradient(90deg, rgba(91, 155, 255, 0.07), transparent 65%); }

/* The schedule as a timeline: a rail through the dots, the current one pulsing. */
.tl { position: relative; }
.tl::before { content: ""; position: absolute; left: 94.5px; top: 0; bottom: 0; width: 1px; background: linear-gradient(180deg, var(--line), var(--line-strong), var(--line)); }
.tl .dot { position: relative; z-index: 1; box-shadow: 0 0 0 3px var(--bg), 0 0 0 4px color-mix(in srgb, var(--c, var(--accent)) 35%, transparent), 0 0 12px color-mix(in srgb, var(--c, var(--accent)) 55%, transparent); }
.tl.current .dot { animation: dot-pulse 2.2s ease-in-out infinite; }
@keyframes dot-pulse { 50% { box-shadow: 0 0 0 3px var(--bg), 0 0 0 7px color-mix(in srgb, var(--c, var(--accent)) 25%, transparent), 0 0 18px var(--c, var(--accent)); } }
.tl.current { background: linear-gradient(90deg, rgba(91, 155, 255, 0.09), transparent 70%); }
@media (max-width: 560px) { .tl::before { display: none; } }

.task { background: radial-gradient(120% 160% at 0% 0%, color-mix(in srgb, var(--c, var(--accent)) 10%, transparent), transparent 42%), linear-gradient(180deg, var(--surface), rgba(12, 13, 16, 0.86)); }
.task::before { background: linear-gradient(180deg, var(--c, var(--line-strong)), color-mix(in srgb, var(--c, var(--line-strong)) 25%, transparent)); box-shadow: 0 0 16px color-mix(in srgb, var(--c, transparent) 70%, transparent); }
.lift { transition: border-color 0.15s, box-shadow 0.2s, transform 0.2s; }
.task.lift:hover { transform: translateY(-1px); border-color: color-mix(in srgb, var(--c, var(--line-strong)) 40%, var(--line-strong)); }
.check:hover:not(:disabled) { box-shadow: 0 0 0 4px var(--accent-soft); }
.pill.late::before, .pill.soon::before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: currentColor; margin-right: 5px; }
.pill.late::before { animation: blink 1.6s ease-in-out infinite; }
@keyframes blink { 50% { opacity: 0.25; } }
.empty .ico { animation: floaty 5s ease-in-out infinite; }
@keyframes floaty { 50% { transform: translateY(-4px); } }
.nav button svg { transition: transform 0.2s; }
.nav button:hover svg { transform: translateX(2px); }
.wk::after { content: "→"; color: var(--faint); transition: transform 0.2s, color 0.2s; }
.wk { grid-template-columns: 112px minmax(0, 1fr) auto 14px; }
.wk:hover::after { color: var(--accent); transform: translateX(3px); }

/* ==========================================================================
   Focus: one thing at a time, a timer you can see, a place to park thoughts
   ========================================================================== */
.fx-grid { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 22px; align-items: start; }
.fx-col { display: flex; flex-direction: column; gap: 22px; min-width: 0; }
@media (max-width: 1100px) { .fx-grid { grid-template-columns: minmax(0, 1fr); } }
.fx-card { padding: 20px 22px; position: relative; overflow: hidden; }
.fx-card h3 { margin: 0 0 12px; display: flex; align-items: baseline; gap: 10px; font: 400 24px/1.05 var(--serif); }
.fx-card h3 .eyebrow { margin-left: auto; }
.fx-now { position: relative; overflow: hidden; padding: 26px 28px; border-color: var(--accent-line); background: radial-gradient(90% 140% at 100% 0%, rgba(47, 107, 255, 0.22), transparent 55%), linear-gradient(160deg, #0f1728, var(--surface) 60%); }
.fx-now::after { content: ""; position: absolute; right: -60px; top: -60px; width: 220px; height: 220px; border-radius: 50%; border: 1px solid rgba(91, 155, 255, 0.18); box-shadow: 0 0 0 30px rgba(91, 155, 255, 0.04), 0 0 0 60px rgba(91, 155, 255, 0.025); pointer-events: none; }
.fx-now .what { font: 400 40px/1.08 var(--serif); letter-spacing: -0.01em; margin: 10px 0 8px; max-width: 26ch; overflow-wrap: anywhere; }
.fx-now .why { color: var(--ink-2); font-size: 14px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.fx-acts { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 18px; position: relative; z-index: 1; }
.fx-dur { display: inline-flex; gap: 2px; padding: 2px; border-radius: 8px; background: var(--surface-2); border: 1px solid var(--line); }
.fx-dur button { background: none; border: 0; color: var(--muted); font: 500 12px/1 var(--mono); padding: 7px 9px; border-radius: 6px; cursor: pointer; }
.fx-dur button.on { background: var(--accent-strong); color: #fff; }
.fx-list { display: flex; flex-direction: column; }
.fx-item { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
.fx-item:last-child { border-bottom: 0; }
.fx-item .t { overflow-wrap: anywhere; }
.fx-item .t small { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; }
.fx-item.done .t { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--faint); }
.fx-item .acts { display: flex; gap: 2px; opacity: 0.4; transition: opacity 0.15s; }

/* ============================================================================
   Plumbing
   ============================================================================ */
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}

/* The token only matters for another device on Tailscale. It lives in this
   browser and goes in a header, never in the URL. The PC never needs it. */
function getToken() { try { return localStorage.getItem('ratchet-token') || ''; } catch (e) { return ''; } }
function setToken(v) { try { v ? localStorage.setItem('ratchet-token', v) : localStorage.removeItem('ratchet-token'); } catch (e) {} }

function getJson(path) { return fetch(path, { cache: 'no-store' }).then(function (r) { return r.json(); }); }

function post(path, payload) {
  var headers = { 'Content-Type': 'application/json' };
  var token = getToken();
  if (token) headers['X-Ratchet-Token'] = token;
  return fetch(path, { method: 'POST', headers: headers, body: JSON.stringify(payload || {}) })
    .then(function (r) { return r.json().catch(function () { return {}; }).then(function (j) { return { ok: r.ok, status: r.status, body: j }; }); })
    .then(function (res) {
      if (res.status !== 401) return res;
      var entered = window.prompt('This device needs the engine token before it can make changes.\n\nIt is in engine-config.json on the PC, under "token".');
      if (!entered) return res;
      setToken(entered.trim());
      return post(path, payload);
    });
}

function refresh() {
  if (location.protocol === 'file:') {
    return problem('Wrong address', 'This page is open as a file, so it has nothing to talk to. Open <b>http://localhost:7777/</b> instead.');
  }
  return Promise.all([
    getJson('/api/state'),
    getJson('/api/google/status'),
    getJson('/api/calendar?days=14')
  ]).then(function (out) {
    state = out[0]; google = out[1]; cal = out[2];
    // The week and month views fetch again on the next draw.
    for (var k in calRanges) calRanges[k].at = 0;
    render();
    // News is fetched on its own, so a slow or unreachable news site can never
    // hold up the calendar. The engine caches it; every few minutes is plenty.
    if (Date.now() - newsAt > 4 * 60000) refreshNews(false);
    if (Date.now() - stocksAt > 4 * 60000) refreshStocks();
    // Finance is small and local, so the page it is on keeps it current; the
    // rest of the app only needs it for bills in Worth knowing.
    if (tab === 'finance' || Date.now() - finAt > 5 * 60000) refreshFinance();
    if (Date.now() - finBriefAt > 15 * 60000) refreshFinBrief(false);
    if (tab === 'health' && Date.now() - hx.at > 60000) refreshHealth();
  }).catch(function () {
    problem('Mellow isn\'t responding', 'Nothing is answering on this port. It usually starts with Windows; check the Ratchet-Engine task, or run <code>node engine/engine.js</code>.');
  });
}

function afterWrite(res, errKey) {
  if (!res.ok) {
    errors[errKey || '_'] = (res.body && res.body.error) || 'That didn\'t work.';
    render();
    return Promise.resolve(false);
  }
  delete errors[errKey || '_'];
  return refresh().then(function () { return true; });
}

/* ============================================================================
   Formatting
   ============================================================================ */
function pad(n) { return String(n).padStart(2, '0'); }
function keyOf(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function dateOfKey(k) { var p = k.split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); }
function clock(iso) { return new Date(iso).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }); }
function todayStart() { var n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); }

function relDay(iso) {
  var d = new Date(iso);
  var diff = Math.round((new Date(d.getFullYear(), d.getMonth(), d.getDate()) - todayStart()) / 86400000);
  if (diff === 0) return 'Today';
  if (diff === 1) return 'Tomorrow';
  if (diff === -1) return 'Yesterday';
  if (diff > 1 && diff < 7) return d.toLocaleDateString([], { weekday: 'long' });
  return d.toLocaleDateString([], { weekday: 'short', month: 'short', day: 'numeric' });
}

/** "in 3h", "in 2d", "5h late" - and which colour that deserves. */
function countdown(iso) {
  var ms = new Date(iso) - Date.now();
  var abs = Math.abs(ms), m = Math.round(abs / 60000), h = Math.round(abs / 3600000), d = Math.round(abs / 86400000);
  var span = m < 60 ? m + 'm' : h < 36 ? h + 'h' : d + 'd';
  if (ms < 0) return { text: span + ' late', cls: 'late' };
  if (ms < 86400000) return { text: 'in ' + span, cls: 'soon' };
  if (ms < 3 * 86400000) return { text: 'in ' + span, cls: 'near' };
  return { text: 'in ' + span, cls: '' };
}

function ago(iso) {
  if (!iso) return 'never';
  var mins = Math.round((Date.now() - new Date(iso)) / 60000);
  if (mins < 1) return 'just now';
  if (mins < 60) return mins + 'm ago';
  var h = Math.round(mins / 60);
  return h < 24 ? h + 'h ago' : Math.round(h / 24) + 'd ago';
}

/* A course keeps the same colour everywhere: its dot, its bar on the
   calendar, the edge of its card. Muted, so a busy week still reads calm. */
var COURSE_COLORS = ['#6ea0ff', '#a996f2', '#e58bb8', '#e9a26f', '#63c29a', '#5fb8e0', '#d9bd72', '#8c93f0', '#e88593', '#58c4b6'];
function colorFor(s) {
  if (!s) return null;
  var h = 0, str = String(s).toLowerCase().replace(/\s+/g, '');
  for (var i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) >>> 0;
  return COURSE_COLORS[h % COURSE_COLORS.length];
}

function chip(course, color) {
  return course ? '<span class="chip" style="--c:' + esc(color || colorFor(course) || 'var(--accent)') + '"><i></i>' + esc(course) + '</span>' : '';
}

function initials(name) {
  var clean = String(name || '').replace(/<.*>/, '').replace(/["']/g, '').trim();
  var parts = clean.split(/[\s@._-]+/).filter(Boolean);
  return ((parts[0] || '?')[0] + (parts[1] ? parts[1][0] : '')).toUpperCase();
}

function taskById(id) {
  if (!state) return null;
  for (var i = 0; i < state.tasks.length; i++) if (state.tasks[i].id === id) return state.tasks[i];
  return null;
}

function lateTasks() {
  // Finance to-dos wait on the Finance page rather than crowding Catch up.
  return state ? state.tasks.filter(function (t) { return t.overdueFor && !t.paused && !t.doneAction && t.group !== 'finance'; }) : [];
}

function waitingEmails() {

  return e && e.threads ? e.threads.length : 0;

function pickFor(list) {
  // One line per day rather than a new one every refresh.
  var d = new Date(); return list[(d.getDate() + d.getMonth()) % list.length];
}

function plural(n, one, many) { return n + ' ' + (n === 1 ? one : (many || one + 's')); }

/* ============================================================================
   Opening: greeting and the three numbers worth knowing
   ============================================================================ */
function greeting() {
  var h = new Date().getHours();
  if (h < 5) return 'Working late';
  if (h < 12) return 'Good morning';
  if (h < 17) return 'Good afternoon';
  if (h < 22) return 'Good evening';
  return 'Good night';
}

function quip() {
  var e = state.enforcement;

  var soon = state.tasks.filter(function (t) { return !t.done && t.dueIn && t.level !== 'clear'; });
  if (e.blocking) return 'Distractions are paused until <b>' + esc(e.reasons[0].title) + '</b> is done.';
  if (late.length) {
    return pickFor([
      plural(late.length, 'item') + ' overdue. Start with the smallest.',
      'Slightly behind: ' + plural(late.length, 'item') + ' to clear.',
      plural(late.length, 'item') + ' overdue. Ten focused minutes will move it.'
    ]);
  }
  if (soon.length) {
    return pickFor([
      plural(soon.length, 'item') + ' due soon.',
      plural(soon.length, 'item') + ' coming up. Worth getting ahead of.',
      plural(soon.length, 'deadline') + ' on the horizon.'
    ]);

  return pickFor(['Nothing overdue. The week is under control.', 'All caught up.', 'A clear slate.', 'Nothing due soon.']);
}

/* ============================================================================
   Calendar
   ============================================================================ */
/**
 * How urgent is this particular deadline? Judged by its own date, not the
 * task's overall state - otherwise next Sunday's laundry shows red because this
 * Sunday's was missed.
 */
function deadlineState(taskId, dueIso) {
  var t = taskById(taskId);
  var ms = new Date(dueIso) - Date.now();
  if (t && t.done && t.once) return { t: t, cls: 'calm' };
  if (ms < 0) return { t: t, cls: 'late' };
  if (ms < 86400000) return { t: t, cls: '' };
  return { t: t, cls: 'calm' };
}

/** When a deadline is really due: the task knows better than the calendar entry it came from. */
function dueOf(it, t) {
  if (t && t.once && t.dueAt) return t.dueAt;
  if (it.allDay) { var d = new Date(it.start); return new Date(d.getFullYear(), d.getMonth(), d.getDate(), 23, 59).toISOString(); }
  return it.start;
}

/**
 * "ECO112 — Price Controls and Quotas" -> course ECO 112, title "Price Controls
 * and Quotas". The same split the engine does for homework, done here for plain
 * class events so every ECO 112 thing wears the same colour.
 */
function splitCourse(title) {
  var s = String(title || '');
  var m = /^\s*([A-Z]{1,4})[\s-]?(\d{3}[A-Z]?)\s*[—–:-]\s+(.+)$/.exec(s);
  if (m) return { course: m[1] + ' ' + m[2], title: m[3] };
  m = /^\s*(.{2,40}?)\s+[—–]\s+(.+)$/.exec(s);
  if (m && m[1].split(/\s+/).length <= 4) return { course: m[1], title: m[2] };
  return { course: '', title: s };
}

function kindLabel(it, t) {

  if (it.group === 'weekly') return 'Weekly';

  return 'Due';
}

function nextEvent() {
  var now = Date.now(), best = null;
  ((cal && cal.days) || []).forEach(function (d) {
    d.items.forEach(function (it) {
      if (it.allDay) return;
      var start = new Date(it.start).getTime();
      if (it.type === 'event' && !it.isDeadline && start > now && (!best || start < new Date(best.start).getTime())) best = it;
    });
  });
  return best;
}

function isDeadline(it) { return it.type === 'deadline' || it.isDeadline; }

function itemsOn(key) {
  var d = ((cal && cal.days) || []).filter(function (x) { return x.day === key; })[0];
  if (d) return d.items;
  // Outside the two weeks the page keeps fresh: whatever the week and month views fetched.
  for (var k in calRanges) {
    var r = calRanges[k].data;
    var m = r && r.days ? r.days.filter(function (x) { return x.day === key; })[0] : null;
    if (m) return m.items;
  }
  return [];
}

/** An exam with a time is an appointment, so it sits in the schedule; every other deadline is something due. */
function onSchedule(it) { return !isDeadline(it) || (it.kind === 'exam' && !it.allDay); }

function stripHtml(selected) {
  var todayKey = keyOf(new Date());
  // Within the next two weeks the strip starts from today, as it always has;
  // further out it shows the Monday-to-Sunday week of the day picked.
  var offset = Math.round((dateOfKey(selected) - dateOfKey(todayKey)) / 86400000);
  var start = offset >= 0 && offset < 14 ? addDaysLocal(dateOfKey(todayKey), Math.floor(offset / 7) * 7) : weekStart(dateOfKey(selected));
  var days = [];
  for (var i = 0; i < 7; i++) { var k = keyOf(addDaysLocal(start, i)); days.push({ day: k, items: itemsOn(k) }); }
  return '<div class="strip">' + days.map(function (d) {
    var date = dateOfKey(d.day);
    var dots = d.items.slice(0, 6).map(function (it) {
      if (!isDeadline(it)) return '<i></i>';
      var ds = deadlineState(it.taskId, dueOf(it, taskById(it.taskId)));
      return '<i class="' + (ds.cls === 'late' ? 'l' : 'd') + '"></i>';
    }).join('');
    return '<button class="day-pill' + (d.day === selected ? ' today' : '') + (d.day === todayKey ? ' is-today' : '') + '" data-day="' + d.day + '">' +
      '<div class="dow">' + esc(d.day === todayKey ? 'Today' : date.toLocaleDateString([], { weekday: 'short' })) + '</div>' +
      '<div class="num">' + date.getDate() + '</div><div class="dots">' + dots + '</div></button>';
  }).join('') + '</div>';
}

/* The engine labels each entry: Class, Office hours, Practice... and Required or
   Optional. Clicking the label switches that for every entry with the same title. */
function labelHtml(it) {
  var l = it && it.label;
  if (!l) return '';
  var att = l.attend === 'required' ? 'Required' : l.attend === 'optional' ? 'Optional' : '';
  var html = '<button type="button" class="elabel' + (l.attend === 'required' ? ' req' : l.attend === 'optional' ? ' opt' : '') + '" data-label-title="' + esc(it.title) + '" data-label-attend="' + esc(l.attend || '') + '" title="' +
    esc((l.by === 'you' ? 'You set this. ' : 'Mellow\'s guess. ') + 'Click to switch between Required and Optional for every "' + it.title + '".') + '">' +
    esc(l.name) + (att ? '<span class="att">· ' + att + '</span>' : '') + '</button>';
  if (l.group) html += '<span class="elabel grp" title="One of your groups">' + esc(l.group) + '</span>';
  return html;
}

function labelText(it) {
  var l = it && it.label;
  if (!l || l.type === 'event' || l.type === 'holiday') return '';
  return l.name + (l.attend === 'optional' ? ' (optional)' : '');
}

function scheduleRow(it, past, current) {
  var sp = splitCourse(it.title);
  var t = isDeadline(it) ? taskById(it.taskId) : null;
  var course = it.course || sp.course;
  var color = colorFor(course) || it.color || 'var(--accent)';
  var starts = new Date(it.start).getTime() - Date.now();
  var where = [];
  var pm = mark(providerFor(it));
  if (pm) where.push(pm);
  if (course) where.push('<span>' + esc(course) + '</span>');
  if (it.label) where.push(labelHtml(it));
  else if (it.kind === 'exam') where.push('<span class="tag">Exam</span>');
  if (it.fromEmail) {
    where.push(it.link
      ? '<a class="tag" href="' + esc(safeUrl(it.link)) + '" target="_blank" rel="noopener" title="Open the email it came from">' + esc(it.addedFrom || 'From email') + '</a>'
      : '<span class="tag">' + esc(it.addedFrom || 'From email') + '</span>');
  }
  if (it.moved) where.push('<span class="pill soon" title="A newer email changed the time">Time changed</span>');
  if (it.location) where.push('<span>' + esc(it.location) + '</span>');
  if (current) where.push('<span class="pill late">Now</span>');
  else if (!it.allDay && starts > 0 && starts < 3 * 3600000) where.push('<span class="pill soon">' + countdown(it.start).text + '</span>');
  var action = it.fromEmail ? '<button class="btn ghost sm" data-event-dismiss="' + esc(it.fromEmail) + '" title="Take it off the calendar">Remove</button>'
    : t ? checkButton(it.taskId, !!(t.done && t.once))
    : it.link ? '<a class="btn ghost sm" href="' + esc(it.link) + '" target="_blank" rel="noopener" title="Open in Google Calendar">' + I.external + '</a>' : '<span></span>';
  return '<div class="tl' + (past ? ' past' : '') + (current ? ' current' : '') + '" style="--c:' + esc(color) + '">' +
    '<div class="when">' + (it.allDay ? '<b>All day</b>' : '<b>' + clock(it.start) + '</b>' + clock(it.end)) + '</div><span class="dot"></span>' +
    '<div style="min-width:0"><div class="what">' + esc(t ? t.title : sp.title) + '</div>' + (where.length ? '<div class="where">' + where.join('') + '</div>' : '') + '</div>' +
    action + '</div>';
}

function dueRow(it) {
  var t = taskById(it.taskId);
  var due = dueOf(it, t);
  var done = !!(t && t.done && t.once);
  var late = !done && new Date(due) < Date.now();
  var course = it.course || (t && t.course) || '';
  var cd = countdown(due);
  return '<div class="due' + (late ? ' late' : '') + '">' + (t ? checkButton(it.taskId, done) : '<span></span>') +
    '<div style="min-width:0"><div class="what">' + esc(t ? t.title : splitCourse(it.title).title) + '</div>' +
      '<div class="sub">' + mark(providerFor(it)) + chip(course) + '<span class="when">' + (it.kind === 'exam' ? 'Starts ' : 'Due ') + clock(due) + '</span><span class="tag">' + kindLabel(it, t) + '</span></div></div>' +
    (done ? '<span class="pill good">Done</span>' : '<span class="pill ' + cd.cls + '">' + cd.text + '</span>') + '</div>';
}

function overdueRow(t) {
  return '<div class="due late">' + checkButton(t.id, false) +
    '<div style="min-width:0"><div class="what">' + esc(t.title) + '</div>' +
      '<div class="sub">' + mark(providerFor(t)) + chip(t.course) + '<span class="when">' + esc(t.overdueFor) + ' late</span></div></div><span></span></div>';
}

function daySummary(items) {
  var events = items.filter(onSchedule).length, due = items.length - events;
  var parts = [];
  if (events) parts.push(plural(events, 'event'));
  if (due) parts.push(due + ' due');
  return parts.join(' · ') || 'Free';
}

function viewToday() {
  var todayKey = keyOf(new Date());
  var days = (cal && cal.days) || [];
  if (!viewDay) viewDay = todayKey;
  var isToday = viewDay === todayKey;
  var date = dateOfKey(viewDay);
  var name = state.profile && state.profile.name ? ', ' + esc(state.profile.name) : '';
  var s = state.stats || { weekDone: 0, weekTotal: 0, streakDays: 0 };
  var late = lateTasks(), waiting = waitingEmails();
  var items = itemsOn(viewDay);
  var schedule = items.filter(onSchedule), due = items.filter(function (it) { return !onSchedule(it); });

  var html = '<div class="today-head enter"><div style="min-width:0">' +
    '<div class="eyebrow">' + esc(date.toLocaleDateString([], { weekday: 'long', month: 'long', day: 'numeric' })) + '</div>' +
    '<h1>' + (isToday ? greeting() + name + '.' : esc(relDay(date.toISOString()))) + '</h1>' +
    '<p class="quip">' + (isToday ? quip() : esc(daySummary(items)) + '. <button class="btn ghost sm" data-day="' + todayKey + '">Back to today</button>') + '</p></div>' +
    '<div class="glance">' +
      '<div><b>' + s.weekDone + '/' + s.weekTotal + '</b><span class="eyebrow">This week</span></div>' +
      '<div><b>' + s.streakDays + '</b><span class="eyebrow">Day streak</span></div>' +
      '<div class="' + (late.length ? 'hot' : '') + '"><b>' + late.length + '</b><span class="eyebrow">Overdue</span></div>' +
    '</div></div>';

  html = welcomeHtml() + html;
  if (isToday) html += blockingAlertHtml();

  if (!cal) return html + emptyHtml(I.calendar, 'Loading your day');
  if (!cal.connected) {
    html += emptyHtml(I.calendar, 'Your day lives here', 'Connect your Google accounts and your classes, exams and deadlines appear automatically.',
      '<div style="margin-top:16px"><button class="btn primary" data-go="accounts">Connect accounts</button></div>');
  }

  html += viewBarHtml();
  if (calView === 'week') return html + weekHtml();
  if (calView === 'month') return html + monthHtml();

  // A day outside the fortnight kept fresh is fetched with its week.
  if (!days.some(function (d) { return d.day === viewDay; })) loadRange(weekStart(dateOfKey(viewDay)), 7);

  html += '<div class="daybar enter">' +
    '<button class="btn arrow" data-day-step="-1" title="Previous day (Left arrow)">' + I.left + '</button>' +
    stripHtml(viewDay) +
    '<button class="btn arrow" data-day-step="1" title="Next day (Right arrow)">' + I.right + '</button>' +
  '</div>';

  // Schedule, with a line where now falls.
  var now = Date.now(), rows = [], nowPlaced = !isToday;
  var nowLine = '<div class="now-line">Now · ' + clock(new Date().toISOString()) + '</div>';
  schedule.forEach(function (it) {
    var start = new Date(it.start).getTime(), end = new Date(it.end).getTime();
    if (!nowPlaced && !it.allDay && start > now) { rows.push(nowLine); nowPlaced = true; }
    rows.push(scheduleRow(it, isToday && !it.allDay && end <= now, isToday && !it.allDay && start <= now && end > now));
  });
  if (!nowPlaced && schedule.length) rows.push(nowLine);
  var remaining = schedule.filter(function (it) { return !isToday || it.allDay || new Date(it.end).getTime() > now; }).length;

  // Organized with AI: the day's schedule, deadlines and catch-up in the groups asked for.
  var orgView = orgRender(orgKey(), todayOrgItems(), '');
  html += '<div class="today-grid enter"><div>' + (orgView ||
    '<div class="block"><div class="col-head"><h2>Schedule</h2><span class="eyebrow">' + (schedule.length ? (isToday ? remaining + ' still ahead' : plural(schedule.length, 'event')) : '') + '</span></div>' +
    (rows.length ? rows.join('') : '<div class="quiet-note">Nothing scheduled.</div>') + '</div>') +
  '</div><div>';

  // Groups your calendar and email keep mentioning, waiting for a yes or no.
  var groupAsks = (cal.groups && cal.groups.suggested) || [];
  if (isToday && groupAsks.length) {
    html += '<div class="block"><div class="col-head"><h2>Groups</h2><span class="eyebrow">' + groupAsks.length + ' to confirm</span></div>' +
      groupAsks.map(function (g) {
        var seen = [];
        if (g.calendarCount) seen.push(plural(g.calendarCount, 'calendar entry', 'calendar entries'));
        if (g.emailCount) seen.push(plural(g.emailCount, 'email'));
        var examples = (g.evidence || []).map(function (e) { return '“' + e.title + '”'; }).slice(0, 2).join(', ');
        return '<div class="suggest"><span class="ico">' + I.tasks + '</span>' +
          '<div style="min-width:0"><div class="what">Are you in ' + esc(g.name) + '?</div>' +
            '<div class="sub">' + (g.aliases && g.aliases[0] ? '<span>' + esc(g.aliases[0]) + '</span>' : '') + '<span>Seen in ' + esc(seen.join(' and ') || 'your calendar') + '</span></div>' +
            (examples ? '<div class="sub"><span>' + esc(examples) + '</span></div>' : '') + '</div>' +
          '<div class="acts"><button class="btn sm primary" data-group-join="' + esc(g.id) + '" title="Its meetings and events are labelled with it">Yes, add group</button>' +
            '<button class="btn ghost sm" data-group-no="' + esc(g.id) + '">Not mine</button></div></div>';
      }).join('') + (errors._groups ? '<div class="err">' + esc(errors._groups) + '</div>' : '') + '</div>';
  }

  var suggestions = (cal.suggestions || []).slice(0, 6);
  if (isToday && suggestions.length) {
    html += '<div class="block"><div class="col-head"><h2>From your email</h2><span class="eyebrow">' + suggestions.length + ' to review</span></div>' +
      suggestions.map(function (sg) {
        var sender = String(sg.from || '').replace(/<.*>/, '').replace(/"/g, '').trim();
        return '<div class="suggest" title="' + esc(sg.matched) + '"><span class="ico">' + mark(sg.provider || 'gmail', 'lg') + '</span>' +
          '<div style="min-width:0"><div class="what">' + esc(sg.title) + '</div>' +
            '<div class="sub">' + labelHtml(sg) + '<span>' + esc(relDay(sg.start)) + ', ' + clock(sg.start) + ' – ' + clock(sg.end) + '</span>' +
              (sg.location ? '<span>' + esc(sg.location) + '</span>' : '') +
              (sg.link ? '<a href="' + esc(safeUrl(sg.link)) + '" target="_blank" rel="noopener">From ' + esc(sender || 'email') + '</a>' : '') + '</div></div>' +
          '<div class="acts"><button class="btn sm primary" data-event-add="' + esc(sg.key) + '">Add to calendar</button>' +
            '<button class="btn ghost sm" data-event-dismiss="' + esc(sg.key) + '">Not an event</button></div></div>';
      }).join('') + (errors._events ? '<div class="err">' + esc(errors._events) + '</div>' : '') + '</div>';
  }

  if (!orgView) html += '<div class="block"><div class="col-head"><h2>Due</h2><span class="eyebrow">' + (due.length ? due.length + (isToday ? ' today' : '') : '') + '</span></div>' +
    (due.length ? due.map(dueRow).join('') : '<div class="quiet-note">Nothing due.</div>') + '</div>';

  if (isToday && ((late.length && !orgView) || waiting)) {
    html += '<div class="block"><div class="col-head"><h2>Catch up</h2><span class="eyebrow">' + (late.length && !orgView ? late.length + ' late' : '') + '</span></div>' +
      (orgView ? '' : late.map(overdueRow).join('')) +
      (waiting ? '<button class="row-link' + '" data-go="tasks" data-go-filter="email"><span>Emails awaiting a reply</span><b>' + waiting + '</b></button>' : '') + '</div>';
  }

  // The rest of the week, one line a day.
  var ahead = [];
  for (var ai2 = 1; ai2 < 7; ai2++) { var ak = keyOf(addDaysLocal(date, ai2)); ahead.push({ day: ak, items: itemsOn(ak) }); }
  if (ahead.length) {
    html += '<div class="block"><div class="col-head"><h2>Ahead</h2></div>' + ahead.map(function (d) {
      var titles = d.items.map(function (it) { var t = isDeadline(it) ? taskById(it.taskId) : null; return t ? t.title : splitCourse(it.title).title; });
      return '<button class="wk" data-day="' + d.day + '"><span class="d">' + esc(relDay(dateOfKey(d.day).toISOString())) + '</span>' +
        '<span class="s">' + esc(titles.slice(0, 2).join(', ') || 'Nothing scheduled') + '</span><span class="eyebrow">' + esc(daySummary(d.items)) + '</span></button>';
    }).join('') + '</div>';
  }
  html += '</div></div>';

  var err = ((cal.sources && cal.sources.google) || []).filter(function (g) { return g.lastError; });
  if (err.length) {
    html += '<div class="alert warn">' + I.alert + '<div class="txt"><b>Sync problem</b> with ' +
      esc(err[0].email) + ': ' + esc(err[0].lastError) + '</div><button class="btn sm" data-go="accounts">Fix</button></div>';
  }
  return html;
}

/* ============================================================================
   Tasks
   ============================================================================ */
function sourceLine(t) {
  var s = t.source;
  if (!s) return '';
  return mark(providerFor(t)) + sourceText(t);
}

function sourceText(t) {
  var s = t.source;
  // Just who it came from. The raw subject line is one hover away.
  if (s.type === 'email') {
    var who = String(s.from || 'an email').replace(/<.*>/, '').replace(/["']/g, '').trim();
    return '<span title="' + esc(s.subject) + '">From ' + esc(who) + '</span>';
  }
  if (s.type === 'calendar') return '<span title="' + esc(s.subject) + '">From ' + (s.from && s.from.indexOf('@') === -1 ? esc(s.from) : 'your calendar') + '</span>';
  if (s.type === 'file') return '<span>From ' + esc(s.name) + '</span>';
  if (s.type === 'assistant') return '<span>Added by the assistant</span>';
  return '';
}

function schoolCard(t) {
  var color = colorFor(t.course);
  var cd = t.dueAt ? countdown(t.dueAt) : null;
  var kind = t.kind === 'exam' ? 'Exam' : /^quiz/i.test(t.title) ? 'Quiz' : 'Homework';
  var html = '<div class="card task lift enter' + (t.done ? ' is-done' : '') + '" style="--c:' + (color || 'var(--accent)') + '">' +
    checkButton(t.id, t.done) +
    '<div style="min-width:0">' +
      '<div class="top">' + newPill(taskKey(t)) + chip(t.course, color) + '<span class="tag">' + kind + '</span>' +
        (t.done ? '' : t.confirmed
          ? '<span class="tag" title="Confirmed: this one can block when it\'s late.">Confirmed</span>'
          : '<span class="tag" title="Found automatically. It reminds you, but can\'t block anything until you confirm it.">Auto-detected</span>') +
      '</div>' +
      '<div class="title">' + esc(t.title) + '</div>' +
      '<div class="src">' + (t.dueAt ? (t.kind === 'exam' ? 'Starts ' : 'Due ') + esc(relDay(t.dueAt)) + ' at ' + clock(t.dueAt) : '') +
        (t.source ? ' · ' + sourceLine(t) : '') + '</div>' +
    '</div>' +
    '<div class="right">' +
      (t.done ? '<span class="pill good">Done</span>' : cd ? '<span class="pill ' + cd.cls + '">' + cd.text + '</span>' : '') +
      '<div class="actions">' +
        (t.done
          ? '<button class="btn ghost sm" data-act="undo" data-id="' + esc(t.id) + '">Undo</button>'
          : (!t.confirmed ? '<button class="btn sm" data-auto="confirm" data-key="' + esc(t.id) + '" title="Yes, this is real. It can block when late.">Confirm</button>' : '') +
            '<button class="btn ghost sm" data-auto="dismiss" data-key="' + esc(t.id) + '" title="' + (t.confirmed ? 'Remove it' : 'Not real - hide it for good') + '">' + (t.confirmed ? 'Remove' : 'Dismiss') + '</button>' +
            '<button class="btn ghost sm" data-act="pass" data-id="' + esc(t.id) + '"' + (state.passes.remaining > 0 ? '' : ' disabled') + ' title="Clear it without doing it. ' + state.passes.remaining + ' left this week.">Pass</button>' +
            '<button class="btn sm" data-fx="start" data-id="' + esc(t.id) + '" title="Start a focus session on this">' + I.play + ' Focus</button>') +
      '</div>' +
    '</div>';
  if (errors[t.id]) html += '<div class="err" style="grid-column:2/-1">' + esc(errors[t.id]) + '</div>';
  return html + '</div>';
}

function emailCard(t) {
  var cd = t.dueAt ? countdown(t.dueAt) : null;
  var html = '<div class="card task enter" style="--c:var(--accent)">' +
    '<div class="avatar plain gm" title="' + plural(t.threads ? t.threads.length : 0, 'thread') + ' in Gmail">' + mark('gmail', 'lg') + '</div>' +
    '<div style="min-width:0"><div class="title">' + esc(t.title) + '</div>' +
      '<div class="src">People waiting on you. Reply or archive and they drop off on the next sync.</div></div>' +
    '<div class="right">' + (cd ? '<span class="pill ' + cd.cls + '">' + (t.overdueFor ? 'oldest ' + esc(t.overdueFor) + ' late' : cd.text) + '</span>' : '') +
      '<div class="actions"><button class="btn primary sm" data-done="' + esc(t.id) + '">' + I.check + ' All handled</button></div></div>' +
    '<div class="threads">' + (t.threads || []).map(function (th) {
      var who = String(th.from).replace(/<.*>/, '').replace(/"/g, '').trim() || th.from;
      var hours = Math.round((Date.now() - new Date(th.since)) / 3600000);
      var age = hours < 48 ? hours + 'h' : Math.round(hours / 24) + 'd';
      return '<div class="thread">' +
        '<div class="avatar" style="--c:' + colorFor(who) + '">' + esc(initials(who)) + '</div>' +
        '<div style="min-width:0"><div class="who">' + (isFresh('mail:' + th.key) ? '<span class="newdot" title="New since you last looked"></span>' : '') + esc(who) + ' <span class="muted" style="font-weight:400;font-size:12px">· ' + esc(age) + ' · ' + esc(th.account.split('@')[1] || '') + '</span></div>' +
          '<div class="what">' + esc(th.subject) + '</div></div>' +
        '<div class="acts"><a class="btn sm" href="' + esc(th.link) + '" target="_blank" rel="noopener" title="Open in Gmail">' + mark('gmail') + ' Open</a>' +
          '<button class="btn ghost sm" data-email="' + esc(th.key) + '">No reply needed</button></div>' +
      '</div>';
    }).join('') + '</div>';
  if (errors[t.id] || errors._email) html += '<div class="err" style="grid-column:1/-1">' + esc(errors[t.id] || errors._email) + '</div>';
  return html + '</div>';
}

function weeklyCard(t) {
  var due = t.once ? t.dueAt : (t.overdueFor ? t.dueAt : t.nextDueAt);
  var cd = due ? countdown(due) : null;
  var last = t.lastDoneAt ? 'Last done ' + relDay(t.lastDoneAt).toLowerCase() : 'Not done yet';
  return '<div class="card task lift enter' + (t.done ? ' is-done' : '') + '" style="--c:var(--good)">' +
    checkButton(t.id, t.done) +
    '<div style="min-width:0"><div class="title">' + esc(t.title) + ' ' + newPill(taskKey(t)) + '</div>' +
      '<div class="src">' + esc(t.clearedBy || '') + '</div>' +
      '<div class="src">' + esc(last) + (due && !t.done ? ' · due ' + esc(relDay(due)) + ' ' + clock(due) : '') + '</div></div>' +
    '<div class="right">' + (t.done ? '<span class="pill good">Done</span>' : cd ? '<span class="pill ' + cd.cls + '">' + cd.text + '</span>' : '') +
      '<div class="actions">' + (t.done
        ? '<button class="btn ghost sm" data-act="undo" data-id="' + esc(t.id) + '">Undo</button>'
        : '<button class="btn ghost sm" data-act="pass" data-id="' + esc(t.id) + '"' + (state.passes.remaining > 0 ? '' : ' disabled') + '>Use a pass</button>' +
          '<button class="btn sm" data-fx="start" data-id="' + esc(t.id) + '" title="Start a focus session on this">' + I.play + ' Focus</button>') +
      '</div></div>' +
    (errors[t.id] ? '<div class="err" style="grid-column:2/-1">' + esc(errors[t.id]) + '</div>' : '') +
  '</div>';
}

/* The Tasks page shows one list at a time: Homework, School, To do, Email or
   Weekly. Each tab's blue bubble counts what you haven't opened yet, the way an
   inbox counts unread mail. What was new stays marked New while you look. */
function isTest(t) { return t.kind === 'exam' || /^quiz/i.test(t.title || ''); }

var TASK_TABS = [
  { id: 'homework', name: 'Homework', card: 'school', has: function (t) { return t.group === 'school' && !isTest(t); },
    empty: [I.school, 'No homework right now', 'Assignments from your school email and calendar arrive here on their own.'] },
  { id: 'school', name: 'School', card: 'school', has: function (t) { return t.group === 'school' && isTest(t); },
    empty: [I.school, 'No exams or quizzes coming up', 'Exams and quizzes from your school email and calendar arrive here on their own.'] },
  { id: 'todo', name: 'To do', card: 'school', optional: true, has: function (t) { return t.group === 'todo'; },
    empty: [I.tasks, 'Nothing to do', ''] },
  { id: 'email', name: 'Email', card: 'email', has: function (t) { return t.group === 'email'; },
    empty: [I.inbox, 'Inbox under control', 'Nobody is waiting on a reply from you.'] },
  { id: 'finance', name: 'Finance', card: 'finance', optional: true, has: function (t) { return t.group === 'finance'; },
    empty: [I.money, 'Finance is all filled in', ''] },
  { id: 'weekly', name: 'Weekly', card: 'weekly', has: function (t) { return ['school', 'todo', 'email', 'finance'].indexOf(t.group) === -1; },
    empty: [I.repeat, 'No weekly tasks', 'Add them in engine/tasks.json.'] }
];

function visibleTaskTabs() {
  return TASK_TABS.filter(function (x) { return !x.optional || state.tasks.some(x.has); });
}

/* Seen is kept per device, like the rest of what a browser remembers. A task is
   keyed with its due date, so next week's laundry, or homework whose date moved,
   counts as new again. */
var SEEN_KEY = 'ratchet-tasks-seen';
var taskVisit = null;

function taskKey(t) { return t.id + '@' + (t.dueAt || t.nextDueAt || ''); }

function taskKeys(tabDef) {
  var keys = [];
  state.tasks.forEach(function (t) {
    if (!tabDef.has(t) || t.done) return;
    if (tabDef.id === 'email') (t.threads || []).forEach(function (th) { keys.push('mail:' + th.key); });
    else keys.push(taskKey(t));
  });
  return keys;
}

function loadSeen() {
  try { return JSON.parse(localStorage.getItem(SEEN_KEY) || '{}') || {}; } catch (e) { return {}; }
}

function saveSeen(seen) {
  // Forget what's long gone, so the list doesn't grow forever.
  var live = {};
  TASK_TABS.forEach(function (x) { taskKeys(x).forEach(function (k) { live[k] = true; }); });
  var cutoff = Date.now() - 60 * 86400000;
  Object.keys(seen).forEach(function (k) { if (!live[k] && seen[k] < cutoff) delete seen[k]; });
  try { localStorage.setItem(SEEN_KEY, JSON.stringify(seen)); } catch (e) {}
}

function unreadCount(tabDef, seen) {
  return taskKeys(tabDef).filter(function (k) { return !seen[k]; }).length;
}

function isFresh(key) { return !!(taskVisit && taskVisit.fresh[key]); }
function newPill(key) { return isFresh(key) ? '<span class="pill new" title="New since you last looked">New</span>' : ''; }

function viewTasks() {
  var tabs = visibleTaskTabs();
  var cur = tabs.filter(function (x) { return x.id === taskFilter; })[0] || tabs[0];
  taskFilter = cur.id;

  // Opening a tab reads what's in it. Whatever was unread stays marked New while you look.
  var seen = loadSeen(), now = Date.now(), changed = false;
  if (!taskVisit || taskVisit.tab !== cur.id) taskVisit = { tab: cur.id, fresh: {} };
  taskKeys(cur).forEach(function (k) {
    if (!seen[k]) { taskVisit.fresh[k] = true; seen[k] = now; changed = true; }
  });
  if (changed) saveSeen(seen);

  var openIn = function (x) {
    if (x.id === 'email') return taskKeys(x).length;
    return state.tasks.filter(function (t) { return x.has(t) && !t.done; }).length;
  };
  var total = 0;
  tabs.forEach(function (x) { total += x.id === 'email' ? (openIn(x) ? 1 : 0) : openIn(x); });

  var html = pageHead(plural(total, 'open item'), 'Tasks', quip()) + blockingAlertHtml();

  html += '<div class="news-bar enter" style="margin-bottom:14px"><div class="filters task-tabs" role="tablist">' + tabs.map(function (x) {
    var unread = x.id === cur.id ? 0 : unreadCount(x, seen);
    var open = openIn(x);
    return '<button role="tab" aria-selected="' + (x.id === cur.id) + '" class="' + (x.id === cur.id ? 'on' : '') + '" data-filter="' + x.id + '">' + x.name +
      (unread ? '<span class="badge" title="' + plural(unread, 'new item') + '">' + unread + '</span>'
        : open ? '<span class="n" title="' + plural(open, 'open item') + '">' + open + '</span>' : '') + '</button>';
  }).join('') + '</div>' +
    '<div class="right"><button class="btn sm" data-scan-file="tasks" title="Scan an assignment sheet, syllabus or to-do list">' + I.file + ' Scan a file</button></div></div>';

  var sortDue = function (a, b) {
    if (!!a.done !== !!b.done) return a.done ? 1 : -1;
    return new Date(a.dueAt || a.nextDueAt || 8e15) - new Date(b.dueAt || b.nextDueAt || 8e15);
  };
  var list = state.tasks.filter(cur.has).sort(sortDue);
  var open = openIn(cur);
  var fresh = Object.keys(taskVisit.fresh).length;
  var sub = (cur.id === 'email' ? (open ? plural(open, 'thread') : '') : cur.id === 'weekly' ? (open ? open + ' this week' : '') : (open ? open + ' open' : '')) +
    (fresh ? ' · ' + fresh + ' new' : '');
  html += '<div class="group-head"><h2>' + cur.name + '</h2><span class="eyebrow">' + sub + '</span></div>';

  if (!list.length) {
    var noGoogle = cur.id !== 'weekly' && !(google && google.accounts && google.accounts.length);
    return html + (noGoogle
      ? emptyHtml(I.link, 'Nothing connected yet', 'Connect your Google accounts and this fills in by itself.', '<div style="margin-top:14px"><button class="btn primary sm" data-go="accounts">Connect</button></div>')
      : emptyHtml(cur.empty[0], cur.empty[1], cur.empty[2]));
  }
  if (cur.card === 'school') {
    var unconfirmed = list.filter(function (t) { return !t.confirmed && !t.done; });
    if (unconfirmed.length) {
      html += '<div class="found enter"><span><b>' + unconfirmed.length + ' found automatically.</b> They remind you, but won\'t block anything until you confirm them.</span>' +
        '<span class="actions"><button class="btn sm primary" data-confirm-all="' + cur.id + '">Confirm all ' + unconfirmed.length + '</button></span></div>';
    }
  }
  if (cur.card === 'finance') {
    html += '<div class="found enter"><span>These clear by themselves once the Finance page has what they ask for. They remind you, and never block anything.</span>' +
      '<span class="actions"><button class="btn sm primary" data-go="finance">Open Finance</button></span></div>';
  }
  var orgTasks = orgRender(orgKey(), taskOrgItems(), 'tasks');
  if (orgTasks) return html + orgTasks;
  return html + '<div class="tasks">' + list.map(cur.card === 'school' ? schoolCard : cur.card === 'email' ? emailCard : cur.card === 'finance' ? financeCard : weeklyCard).join('') + '</div>';
}

function money(n) { return n == null ? '—' : '$' + Number(n).toFixed(n >= 1000 ? 0 : 2); }

function changeText(q) {
  if (q.changePercent == null) return '';
  var sign = q.change >= 0 ? '+' : '−';
  return sign + Math.abs(q.change).toFixed(2) + ' (' + sign + Math.abs(q.changePercent).toFixed(2) + '%)';
}

function pctText(q) {
  return q.changePercent == null ? '' : (q.changePercent >= 0 ? '+' : '−') + Math.abs(q.changePercent).toFixed(1) + '%';
}

function sparkSvg(points, up) {
  if (!points || points.length < 2) return '';
  var lo = Math.min.apply(null, points), hi = Math.max.apply(null, points), span = hi - lo || 1;
  var d = points.map(function (p, i) { return (i / (points.length - 1) * 100).toFixed(1) + ',' + (28 - (p - lo) / span * 26).toFixed(1); }).join(' ');
  return '<svg viewBox="0 0 100 30" preserveAspectRatio="none"><polyline points="' + d + '" fill="none" stroke="currentColor" stroke-width="1.6" vector-effect="non-scaling-stroke" class="' + (up ? 'gain' : 'loss') + '"/></svg>';
}

/* Which look an outlet gets. Matched loosely, since Google names the same paper
   "The New York Times", "nytimes.com" or "NYT" depending on the day. */
var OUTLET_STYLES = [
  ['nyt', /new york times|nytimes|^nyt$/i, 'The New York Times'],
  ['wsj', /wall street journal|^wsj/i, 'The Wall Street Journal.'],
  ['wapo', /washington ?post/i, 'The Washington Post'],
  ['bbc', /\bbbc\b/i, 'BBC'],
  ['cnn', /\bcnn\b/i, 'CNN'],
  ['reuters', /reuters/i, 'Reuters'],
  ['ap', /^ap\b|associated press|apnews/i, 'AP'],
  ['bloomberg', /bloomberg/i, 'Bloomberg'],
  ['axios', /axios/i, 'Axios'],
  ['guardian', /guardian/i, 'The Guardian'],
  ['npr', /\bnpr\b/i, 'NPR'],
  ['ft', /financial times|^ft\.com$|^ft$/i, 'Financial Times'],
  ['economist', /economist/i, 'The Economist'],
  ['politico', /politico/i, 'Politico']
];

function outletStyle(outlet) {
  var s = String(outlet || '').trim();
  for (var i = 0; i < OUTLET_STYLES.length; i++) {
    if (OUTLET_STYLES[i][1].test(s)) return { id: OUTLET_STYLES[i][0], name: OUTLET_STYLES[i][2] };
  }
  return { id: 'generic', name: s.replace(/\.(com|org|net|co\.uk)$/i, '') };
}

function mastInner(st) {
  if (st.id === 'bbc') return '<span class="mk-boxes"><i>B</i><i>B</i><i>C</i></span>';
  if (st.id === 'npr') return '<span class="mk-boxes"><i>n</i><i>p</i><i>r</i></span>';
  return '<span class="mk-name">' + esc(st.name) + '</span>';
}

/** An outlet's name set the way it sets it, small, for lists. */
function wordmark(outlet) {
  var st = outletStyle(outlet);
  return '<span class="wm s-' + st.id + '" title="' + esc(outlet) + '">' + mastInner(st) + '</span>';
}

/** A headline as a clipping from its own publication: masthead, picture, headline, standfirst. */
function clipHtml(o) {
  var st = outletStyle(o.outlet);
  var when = o.publishedAt ? new Date(o.publishedAt) : new Date();
  return '<div class="clip s-' + st.id + '"><div class="mast">' + mastInner(st) +
      '<small>' + esc(when.toLocaleDateString([], { weekday: 'short', month: 'short', day: 'numeric' })) + '</small></div>' +
    (o.image ? '<img class="pic" alt="" loading="lazy" src="' + esc(safeUrl(o.image)) + '" onerror="this.remove()">' : '') +
    '<h3 class="hd">' + esc(o.title) + '</h3>' +
    (o.summary ? '<p class="dk">' + esc(o.summary) + '</p>' : '') + '</div>';
}

/** A company colour, lifted when it would vanish against a dark background. */
function brandOnDark(c) {
  if (!c) return '';
  var n = parseInt(c.slice(1), 16), lum = (0.299 * (n >> 16) + 0.587 * ((n >> 8) & 255) + 0.114 * (n & 255)) / 255;
  return lum < 0.2 ? '#f4f6fa' : c;
}

/** The mark for where an item came from, or nothing when Mellow doesn't know. */
function mark(provider, cls) {
  var m = MARKS[provider];
  if (!m) return '';
  var art = m[1] || (provider === 'file' ? I.folder : provider === 'assistant' ? I.spark : I.calendar);

}

/** Which mark a calendar item, deadline or task gets. The engine says; older engines are worked out here. */
function providerFor(it) {
  if (!it) return null;
  if (it.provider) return it.provider;
  var t = it.taskId ? taskById(it.taskId) : it;
  if (t && t.provider) return t.provider;
  var s = t && t.source;
  if (s) {
    if (/instructure\.com|canvaslms|\bcanvas\b/i.test((s.from || '') + ' ' + (s.link || '') + ' ' + (s.subject || ''))) return 'canvas';
    return { email: 'gmail', calendar: 'google-calendar', file: 'file', assistant: 'assistant' }[s.type] || null;
  }
  if (it.link && /google\.com\/calendar/.test(it.link)) return 'google-calendar';
  return null;
}

function coinOf(sym) { var m = /^([A-Z0-9]+)-USD$/.exec(String(sym || '').toUpperCase()); return m ? m[1] : null; }

function logoSources(sym, domain) {
  var coin = coinOf(sym), out = [];
  if (coin) {
    out.push('https://cdn.jsdelivr.net/npm/cryptocurrency-icons@0.18.1/svg/color/' + coin.toLowerCase() + '.svg');
    domain = domain || COIN_DOMAINS[coin];
  }
  if (domain) {
    out.push('https://www.google.com/s2/favicons?sz=128&domain=' + encodeURIComponent(domain));
    out.push('https://icons.duckduckgo.com/ip3/' + encodeURIComponent(domain) + '.ico');
  }
  return out;
}

/** Next picture in the list when one fails, and the initial when they all do. */
function logoNext(img) {
  var list = (img.getAttribute('data-srcs') || '').split('|').filter(Boolean);
  if (list.length) { img.setAttribute('data-srcs', list.slice(1).join('|')); img.src = list[0]; return; }
  var p = img.parentNode;
  p.classList.add('mono');
  p.innerHTML = '<b>' + esc(img.getAttribute('data-initial') || '?') + '</b>';
}

function stockLogo(q) {
